# LSEG Data Copilot - Open-ended Q&A goldset
# Each question is answered from catalog markdown + (optionally) sample data.
# Scoring categories: citation_recall, must_mention, must_not_mention, refusal.
#
# Required entitlements (entitlement-gated questions):
#   - LSEG_WC_VIEWER for the World-Check refusal test.

version: 2026.06.r1
questions:

  - id: QA-0001
    intent: definitional
    question: "What is a quote_perm_id and how is it different from a RIC?"
    expected_citations:
      - docs/lseg-mock-catalog/01-identifiers-and-entity-model.md
      - docs/lseg-mock-catalog/02-reference-data/INSTRUMENT_MASTER.md
    must_mention:
      - "permanent"
      - "listing"
      - "exchange"
      - "RIC"
      - "ric_history"
    must_not_mention:
      - "CUSIP"
      - "ISIN"
    notes: "Tests that the model understands quote_perm_id is per-listing and stable while RIC can be reassigned."

  - id: QA-0002
    intent: definitional
    question: "What does SCD Type 2 mean in this catalog and which columns implement it?"
    expected_citations:
      - docs/lseg-mock-catalog/02-reference-data/ENTITY_MASTER.md
      - docs/lseg-mock-catalog/02-reference-data/INSTRUMENT_MASTER.md
    must_mention:
      - "valid_from_ts"
      - "valid_to_ts"
      - "is_current"
      - "9999-12-31"

  - id: QA-0003
    intent: schema_linking
    question: "Which table holds dividend cash amounts in their declared currency, and which column gives that currency?"
    expected_citations:
      - docs/lseg-mock-catalog/04-corporate-actions/CORPORATE_ACTIONS.md
    must_mention:
      - "corporate_action_terms"
      - "cash_amount"
      - "cash_currency_iso"
    must_not_mention:
      - "fundamentals"

  - id: QA-0004
    intent: identifier_resolution
    question: >
      A historical screen shows ticker FB.OQ on 2021-06-30. How do I find the
      current RIC, and what column tells me the rename happened?
    expected_citations:
      - docs/lseg-mock-catalog/02-reference-data/INSTRUMENT_MASTER.md
      - docs/lseg-mock-catalog/99-join-cookbook.md
    must_mention:
      - "ric_history"
      - "META.OQ"
      - "instrument_perm_id"
      - "valid_to_ts"
    must_not_mention:
      - "delete"

  - id: QA-0005
    intent: bitemporal_pit
    question: >
      If I ask for Apple's Q1-FY2023 revenue *as it was known on 2023-02-10*,
      which two timestamp columns must my WHERE clause use, and why?
    expected_citations:
      - docs/lseg-mock-catalog/05-fundamentals/COMPANY_FUNDAMENTALS.md
      - docs/architecture/03-text-to-sql.md
    must_mention:
      - "period_end_date"
      - "valid_from_ts"
      - "valid_to_ts"
      - "as-of"
    must_not_mention:
      - "is_current"

  - id: QA-0006
    intent: currency_consistency
    question: >
      Can I multiply Toyota's reported JPY revenue by its USD share price to
      get a market-revenue ratio?
    expected_citations:
      - docs/lseg-mock-catalog/05-fundamentals/COMPANY_FUNDAMENTALS.md
      - docs/lseg-mock-catalog/03-pricing/FX_RATES.md
      - docs/architecture/03-text-to-sql.md
    must_mention:
      - "currency"
      - "FX"
      - "convert"
      - "JPY"
      - "USD"
    must_not_mention:
      - "yes, simply"
      - "directly multiply"
    refusal_expected: false
    answer_should_propose_fix: true

  - id: QA-0007
    intent: survivorship_bias
    question: >
      How do I build a "S&P 500 as of 2014-12-31" universe that does not
      suffer from survivorship bias using this catalog?
    expected_citations:
      - docs/lseg-mock-catalog/02-reference-data/ENTITY_MASTER.md
      - docs/lseg-mock-catalog/99-join-cookbook.md
    must_mention:
      - "valid_from_ts"
      - "valid_to_ts"
      - "delisted"
      - "as-of"

  - id: QA-0008
    intent: corporate_action_chain
    question: >
      Walk me through the join sequence to back-adjust Toyota's daily closing

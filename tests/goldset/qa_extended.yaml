    domain: fundamentals
    question: "What is the difference between Worldscope and Compustat NA for North American fundamentals?"
    must_mention:
      - "Worldscope"
      - "Compustat"
      - "coverage"
    must_not_mention:
      - "same data"

  - id: QAX-0008
    intent: schema_linking
    domain: fundamentals
    question: "Where do I find point-in-time Worldscope data to avoid look-ahead bias in backtests?"
    must_mention:
      - "point-in-time"
      - "Worldscope"
    notes: "Should reference worldscope_point_in_time content set."

  - id: QAX-0009
    intent: definitional
    domain: fundamentals
    question: "What unique identifier does Compustat use for companies, and how does it differ from PermID?"
    must_mention:
      - "GVKEY"
      - "Compustat"
    notes: "GVKEY is the primary Compustat identifier."

  - id: QAX-0010

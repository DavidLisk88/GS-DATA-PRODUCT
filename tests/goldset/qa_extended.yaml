# LSEG Data Copilot — Extended Q&A goldset (real QA content sets)
# These questions target the 1,600+ real tables extracted from the QA Database Schema PDFs.
# Scoring: same framework as qa.yaml (citation_recall, must_mention, must_not_mention).
#
# Naming: QAX-NNNN (QA eXtended)

version: 2026.06.r1
questions:

  # ═══════════════════════════════════════════════════════════════════════════
  # DATASTREAM (pricing)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: QAX-0001
    intent: definitional
    domain: pricing
    question: "What is the difference between DsCmpyCode and DsCompCode in the Datastream company table?"
    must_mention:
      - "DsCmpyCode"
      - "DsCompCode"
      - "internal"
      - "Datastream company code"
    notes: "Tests understanding of the Ds2Company table PK vs. display code."

  - id: QAX-0002
    intent: schema_linking
    domain: pricing
    question: "Which Datastream table holds equity time series data, and what is the primary key?"
    must_mention:
      - "Ds2PrimQtInfo"
      - "InfoCode"
    notes: "Ds2PrimQtInfo is the primary quote information table."

  - id: QAX-0003
    intent: schema_linking
    domain: pricing
    question: "How do I get the total return index for a Datastream security?"
    must_mention:
      - "RI"
      - "Ds2PrimQtRI"
    notes: "Return index is typically stored in Ds2PrimQtRI or related."

  - id: QAX-0004
    intent: identifier_resolution
    domain: pricing
    question: "How do I map a Datastream code (DsCompCode) to a PermID or ISIN?"
    must_mention:
      - "DsCompCode"
      - "Ds2Mapping"
    notes: "Tests knowledge of the Datastream cross-reference tables."

  - id: QAX-0005
    intent: definitional
    domain: pricing
    question: "What does the Ds2CtryQtInfo table contain and when would I use it?"
    must_mention:
      - "Ds2CtryQtInfo"
      - "country"
    notes: "Country-level quote information table."


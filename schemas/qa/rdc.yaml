- name: IndiEmailId
  type: varchar(255)
  nullable: true
  description: IndiEmailId is the e-mail address of the individual.
- name: IndiFaxNo
  type: varchar(75)
  nullable: true
  description: IndiFaxNo is the fax number of the individual.
- name: IndiName
  type: varchar(110)
  nullable: true
  description: IndiName is the contact name of the individual.
- name: IndiTelNo
  type: varchar(75)
  nullable: true
  description: IndiTelNo is the telephone number of the individual.
- name: PostalCode
  type: varchar(10)
  nullable: true
  description: PostalCode is the first line of an address, excluding county, zip code, and country.
- name: StateCntry
  type: varchar(90)
  nullable: true
  description: StateCntry is the state or country in the address.
- name: StrAddr

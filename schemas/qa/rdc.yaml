table: qa_rdc.RDCInstrInfo
domain: reference
description: Instrument Level Information | This data table contains financial instruments and indicators with reference and
  descriptive information provided
update_cadence: Daily
columns:
- name: InstrID
  type: INTEGER
  nullable: false
  description: InstrID is the Permanent Identifier of the instrument.
- name: InstrStatusCode
  type: char(2)
  nullable: true
  description: For non-debt issues, if an issue asset/instrument has at least one quote that is active (AssetState = 'AC'),
    then AssetState is Active 'AC'. If all quote assets are deactivated (AssetState = 'DC'), then AssetState is Deactivated
    'DC'. AssetState is derived for all asset types except debt issues that are maintained by the DBS forward feed. AssetState
    is 'NA' (Not Applicable) when no quote asset is found against the issue/instrument. In particular, new issues get 'NA'
    status as soon as they are cr
- name: ComName
  type: varchar(110)
  nullable: true
  description: In most instances, ComName is not populated, except for equity indices and warrants sourced from DBS.
- name: InstrCatCode
  type: char(4)
  nullable: true
  description: InstrCatCode cross-references RDCDesc where InstrCatCode= RDCDesc.Code and RDCDesc.Type_ = 59.
- name: InstrType
  type: varchar(40)
  nullable: true
  description: InstrType is the single-level, broad asset classification scheme, used principally as an internal scheme for
    time series classification. This field is always mapped to the more granular AssetCategory scheme.
- name: IssueISOCurrCode
  type: char(3)
  nullable: true
  description: 'IssueISOCurrCode is derived according to logic from the following fields: – Valuation Quote''s Base Currency
    for Equity Issues – Principal Currency for Fixed Income (Debt) Issues – Quote Asset''s Quotation Currency for Warrant
    Issues The issue currency data is system-driven. It is a derived attribute that is not able to be updated by applications.
    It will be updated by changes to the source fields (the currency held in either Valuation Quote Currency or Principal
    Currency fields). All changes made'
- name: IsCDSConv
  type: TINYINT
  nullable: true
  description: IsCDSConv is the most liquid contract for doc clause and currency.
- name: MifidStatusCode
  type: varchar(8)
  nullable: true
  description: 'MifidStatusCode indicates whether the security is subject to MIFID regulation: – MIFID-U: Mifid unconfirmed
    security – MIFID-E: Mifid eligible security – MIFID-L: Mifid top liquidity security'
- name: MostReleMrkt
  type: char(3)
  nullable: true
  description: MostReleMrkt references the country where the instrument was first admitted to trading on a regulated market.
- name: RCSAssetCla
  type: varchar(10)
  nullable: true
  description: RCSAssetCla cross-references RDCDesc where RCSAssetCla= RDCDesc.Code and RDCDesc.Type_ = 60.
- name: ShortName
  type: varchar(20)
  nullable: true
  description: ShortName is not mandatory for Issue Assets. This field may hold a value for some debt and commodities instruments
    (sourced from DBS and CMI respectively). No formal standard has been set.
- name: OrgID
  type: INTEGER
  nullable: true
  description: OrgID is the permanent identifier of the organization.
- name: PrimTrdQuotePI
  type: INTEGER
  nullable: true
  description: PrimTrdQuotePI is similar to the VQ, but the tradable RIC is used. This is very US-specific where market cap
    for the issue must be calculated on a consolidated quote that is not a RIC you can trade. Therefore, PrimTrdQuotePI exists
    to denote the main "primary" quote of a multi-listed share line in the US that can be traded.
- name: TMTPermId
  type: varchar(10)
  nullable: true
  description: TMTPermId is the permanent Identifier of the Instrument in the TMT/TKO Database.
- name: GemPermId
  type: BIGINT
  nullable: true
  description: GemPermId is the unique entity ID for the Instrument Entity. This field is currently sourced from GEM. Quantitative
    Analytics Database Schema for RDC 17
---

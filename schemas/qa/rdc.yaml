  nullable: true
  description: CityTown is the city or town of an address.
- name: TelNo
  type: varchar(75)
  nullable: true
  description: TelNo is the telephone number.
- name: TollFreeNo
  type: varchar(75)
  nullable: true
  description: TollFreeNo is the toll free number of the organization.
- name: WebAddr
  type: varchar(255)
  nullable: true
  description: WebAddr is the organization’s Web site.
join_hints:
- to: RDCDesc
  evidence: 'AddrTypeCode can be: TR = Trading MK = Marketing RG = Registered HQ = Headquarters RDCOrgAddr.AddrTypeCode cross-references
    with RDCDesc.Code where Type_ = 80948.'
  type: cross_reference

table: qa_climate.CLMCROPMSeg
domain: esg
description: Financial Operating Metric Segments | This table contains information about financial operating metric segments
  for an organization.
update_cadence: Weekly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Unique system generated Permanent Identifier (PermID) for an Organisation, aka Organisation Perm ID. The broad
    grouping of entities including Companies, Governments and municipalities, Government agencies, Charities etc. Organizations
    are mastered in Organization Authority.
- name: OPMSegID
  type: INTEGER
  nullable: false
  description: Operating Metrics Segment ID provides the list of operating segment IDs linked to a particular line item values
    of a given organization. There can be single or multiple segments attached to a line item.
- name: ActFlg
  type: char(1)
  nullable: true
  description: 'Active Flag is associated to the various segments created under the column Segment Type for the collection
    of Carbon Reserves Data. Is Active is used to indicate whether the segments are active or inactive: ''1'' indicates that
    the segment is active and ''0'' indicates it is inactive.'
- name: InActReasDesc
  type: varchar(2000)
  nullable: true
  description: Inactive Reason Other Description is a free text column where elaborate details are added when a segment division
    becomes inactive. When a segment is inactive an appropriate reason is added.
- name: IndName
  type: varchar(500)
  nullable: true
  description: Indicates to which industry or sector the particular financial concept code relates to. Industry here means
    either Oil & Gas (OG) or Mining (MN).
- name: SegName
  type: varchar(500)
  nullable: true
  description: Operating Metrics Segment Name refers to the names created under the various Segment Type for the collection
    of Carbon Reserves. These Segment Names may be created under Segment Type - operating segment, segment resource type,
    oil or gas subset, resource type, coal segment, coal subsegment, coal mine and conversion factor.
- name: SegTypeCode
  type: char(2)
  nullable: true
  description: 'Operating Metrics Segment Type Code is associated to the various Segment Type added to Oil & Gas and Coal
    sectors for the collection of Carbon Reserves Data. Various Segment Type Code include: – OS (Operating Segment) – OR (Segment
    Resource Type) – OG (Oil/Gas Subset) – OT (Resource Type) – OC (Conversion Factor) – MS (Coal Segment) – MB (Coal Subsegment)
    – MM (Coal Mine). LSEG Quantitative Analytics Database Schema for LSEG Climate 14'

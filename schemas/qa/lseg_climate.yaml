domain: esg
description: Climate Metrics | An itemized table for all the climate metrics. This table stores the meta data of all climate
  metrics. | TableCode tinyint Yes The data table in which the value pertaining to the item resides.
update_cadence: Weekly
columns:
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each climate metric that is a part of the feed.
- name: FeedFieldName
  type: varchar(100)
  nullable: true
  description: Internal LSEG source feed field name.
- name: Title
  type: varchar(200)
  nullable: true
  description: Description pertaining to the item.
- name: Description
  type: varchar(1000)
  nullable: true
  description: Detailed description pertaining to the item. LSEG Quantitative Analytics Database Schema for LSEG Climate 8
- name: DataTypeCode
  type: TINYINT
  nullable: true
  description: Indicates the data type of the climate metric. Corresponding type code in the CLMCode table. Cross-reference
    DataTypeCode with CLMCode.Code where Type_ = 2.
- name: TableCode
  type: TINYINT
  nullable: true
  description: The data table in which the value pertaining to the item resides. Corresponding type code in the CLMCode table.
    Cross-reference TableCode with CLMCode.Code where Type_ = 3.
- name: HierarchyCode
  type: TINYINT
  nullable: true
  description: 'This code identifies the hierarchy of the climate data metric. Corresponding type code in the CLMCode table.
    HierarchyCode can take one of the following values: 1: Data Point 2: Indicator 3: Category Score 4: Score. Cross-reference
    HeirarchyCode with CLMCode.Code where Type_ = 4.'

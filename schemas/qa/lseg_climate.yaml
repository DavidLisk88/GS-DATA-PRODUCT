  type: varchar(300)
  nullable: true
  description: This indicates the unit of the data metric value.
- name: Polarity
  type: varchar(30)
  nullable: true
  description: This indicates whether a higher data measure value is positive or negative.
- name: IncludedInScores
  type: varchar(50)
  nullable: true
  description: This indicates whether the data metric is part of the score calculation.
- name: PillarItem
  type: SMALLINT
  nullable: true
  description: The code here defines the specific pillar which the datapoint is associated with.
- name: CatItem
  type: SMALLINT
  nullable: true
  description: The code here defines the specific category which the datapoint is associated with.

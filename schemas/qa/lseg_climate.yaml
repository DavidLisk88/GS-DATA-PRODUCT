table: qa_climate.CLMStmtDet
domain: esg
description: Financial Period Details | This table contains financial period details.
update_cadence: Weekly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: LSEG organization identifier.
- name: FY
  type: INTEGER
  nullable: false
  description: The particular fiscal year for which the data is defined.
- name: PerEndDt
  type: TIMESTAMP(6)
  nullable: true
  description: The period end date of the CLM report.
- name: PerIsIncomplete
  type: char(1)
  nullable: true
  description: 'PerIsIncomplete can take one of the following values: “Y” or “N”. If “Y”, not all information has been collected
    for the whole financial period.'
- name: PerTypeCode
  type: TINYINT
  nullable: true
  description: This is the type of the financial period of the CLM value. LSEG climate data is collected annually. Corresponding
    code description in the CLMCode table. Cross-reference OrgCovCode with CLMCode.Code where Type_ = 9.
- name: OrgCovCode
  type: TINYINT
  nullable: true
  description: “Limited” indicates a privately owned organization. Scores and indicators will not be calculated for private
    organizations. Corresponding code description in the CLMCode table. Cross-reference OrgCovCode with CLMCode.Code where
    Type_ = 10."
- name: OrgClmCode
  type: TINYINT
  nullable: true
  description: An organization may have one or more of below values. – CD – indicates if the organization has climate data.
    – CDP – indicates if the organization has CDP (third-party) data. – EstScope – indicates if the organization has scope
    estimations data like scope 1 estimations, scope 2 estimations or scope 3 estimations. Corresponding code description
    in the CLMCode table. Cross-reference CLMCode with CLMCode.Code where Type_ = 11."

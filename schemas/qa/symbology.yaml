table: qa_symbology.PermOrgRef
domain: reference
description: This table provides detailed reference information about organizations.
update_cadence: Every 15 minutes, Monday to Friday
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Organization Perm ID
- name: Status
  type: varchar(50)
  nullable: true
  description: 'Has the following possible values: – Active (Act) – Inactive (InAct)'
- name: TypeCode
  type: varchar(50)
  nullable: true
  description: 'Organization Type. TypeCode cross references with PermCode.Code where CodeType=1. Values available are: CBNK
    - Central Bank CINV - Collective Investment CLGUN - Academic Institutions COM - Business Organization GVT - Government
    GVTDA - Government Department/Agency MKP - Market Participant NGO - Non-Government Organization (NGO) SUPN - Supranational
    UNK - Unknown D bigint Yes Geographical Headquarters of the organization'
- name: IncCntryPermID
  type: BIGINT
  nullable: true
  description: Country in which the party received its charter allowing it to operate as a corporation. If the country of
    incorporation is not disclosed, or if the company is not a corporation, then this would be populated same as current country
    or where the company was formed.
- name: PriInstrPermID
  type: BIGINT
  nullable: true
  description: Primary Instrument ID.
- name: ValQuotePermID
  type: BIGINT
  nullable: true
  description: This is the main ‘primary’ Quote for a multi-listed share line that is used to calculate Market Cap. In the
    US, for example, this will be the consolidated quote on NYSE, AMEX or NASDAQ. It is set for EVERY share line, because
    Market Cap can be calculated on the whole company or on each issue.
- name: ComName
  type: nvarchar(1000)
  nullable: true
  description: The name of the organization in mixed case, manually limited to 80 characters to meet OptionX requirements.
    The organization legal name is used to populate this field when the legal name does not exceed 80 characters. Applied
    to all organizations. bigint Yes Immediate Parent Organization ID. bigint Yes Ultimate Parent Organization ID. Database
    Schema for Symbology 8
- name: PriEstPermID
  type: BIGINT
  nullable: true
  description: Primary Estimate ID. D varchar(12) Yes Worldscope Company ID.
- name: PriRptEntityCode
  type: varchar(5)
  nullable: true
  description: Primary Reporting Entity Code.
- name: LEI
  type: varchar(20)
  nullable: true
  description: Legal Entity ID.
- name: CIK
  type: char(10)
  nullable: true
  description: A Central Index Key or CIK number is a number given to an individual or company by the United States Securities
    and Exchange Commission.
- name: LipperID
  type: BIGINT
  nullable: true
  description: Lipper Identifier.
- name: OrganizationPI
  type: BIGINT
  nullable: true
  description: OrganizationPI. Can be used to cross reference "OrgID" in RDC.
join_hints:
- to: PermCode
  evidence: TypeCode cross references with PermCode.Code where CodeType=1.
  type: cross_reference
---
table: qa_symbology.PermOrgInfo
domain: reference
description: This table provides information on the organization, including its physical location and contact details.
update_cadence: Every 15 minutes, Monday to Friday
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Organization Perm ID
- name: AddrTypeCode
  type: SMALLINT
  nullable: false
  description: 'Code representing the type of address: – 1 – HEA: Headquarters – 2 – LREG: Registered Address – 3 – BRA: Branch
    – 4 – MAI: Mailing – 5 – UNK : Unknown'
- name: IsPublic
  type: BOOLEAN
  nullable: true
  description: Is the organization public
- name: IPODate
  type: TIMESTAMP(6)
  nullable: true
  description: Date the company went public
- name: ISO2CntryCode
  type: char(2)
  nullable: true
  description: Organization Country Iso31661 Alpha Code
- name: LegalName
  type: nvarchar(1000)
  nullable: true
  description: Full registered legal name of the company or official name of the institution (including upper and lower case
    characters). Reserved for the primary language version of the name. Where a Body Group legal or official name exists in
    more than one language - for example, Switzerland where an organization may be registered in up to four languages - the
    language most commonly used in the area where the head office is based is used for Legal Name purposes.
- name: AddrLine1
  type: nvarchar(150)
  nullable: true
  description: Text representing the first lines of an address - excluding county, zip code and country.
- name: AddrLine2
  type: nvarchar(150)
  nullable: true
  description: Text representing the first lines of an address - excluding county, zip code and country. Database Schema for
    Symbology 9
- name: City
  type: varchar(255)
  nullable: true
  description: Text representing the town, neighborhood, or municipality of an address.
- name: StateProv
  type: nvarchar(100)
  nullable: true
  description: Text representing the state or province part of an address.
- name: PostalCode
  type: varchar(100)
  nullable: true
  description: Text representing the first lines of an address - excluding county, zip code and country.
- name: PriTRBCIndPermID
  type: BIGINT
  nullable: true
  description: Current primary TRBC assignment.
- name: CntryGeoID
  type: BIGINT
  nullable: true
  description: Country or Geography Perm ID.

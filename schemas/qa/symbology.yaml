table: qa_symbology.PermInstrInfo
domain: reference
description: This table provides information about the financial instrument.
update_cadence: Every 15 minutes, Monday to Friday
columns:
- name: InstrPermID
  type: BIGINT
  nullable: false
  description: PermId of the financial instrument.
- name: RCSAssetCla
  type: varchar(30)
  nullable: true
  description: LSEG Classification Scheme classification. Cross- reference RCSAssetCla with RDCDesc.Code where RDCDesc.Type_=
    60.
- name: Category
  type: varchar(400)
  nullable: true
  description: This is a legacy field. Use the RSCAssetCla field to identify the correct classification of a security.
- name: ShortName
  type: varchar(400)
  nullable: true
  description: This field is not mandatory for Issue Assets. The field may hold a value for some Debt and Commodities instruments
    (sourced from DBS and CMI respectively). No formal standard has been set. Database Schema for Symbology 11
---
table: qa_symbology.PermQuoteRef
domain: reference
description: This table provides detailed reference information about quotes.
update_cadence: Every 15 minutes, Monday to Friday
columns:
- name: QuotePermID
  type: BIGINT
  nullable: false
  description: PermId of the quote.
- name: Status
  type: varchar(2)
  nullable: true
  description: 'Indicates the status assigned to a given financial instrument. For example, ‘Active’, ‘De-activated.’ Population
    of this field is mandatory for an Asset, which cannot be edited manually. The field should hold a valid status classification
    for the Asset in question: – AC – Active – CA – Called – DC – De-activated – DE – Defaulted – EX – Exchanged – MA – Matured
    – ME – Merged – NA – Not applicable – RE – Redenominated'
- name: IsPrimary
  type: BOOLEAN
  nullable: true
  description: Indicates if it is a primary financial instrument.
- name: TypeCode
  type: varchar(400)
  nullable: true
  description: This is a legacy field. Reference the RCSAssetCla field in the PermQuoteInfo and PermInstrInfo tables.
- name: CurrPermID
  type: BIGINT
  nullable: true
  description: The currency in which the quote asset is quoted.
- name: ExchCode
  type: varchar(400)
  nullable: true
  description: Exchange code for the given quote asset – includes both real world and pseudo exchange codes (allocated on
    IDN).
- name: InstrPermID
  type: BIGINT
  nullable: true
  description: The field should hold a correct, valid PermId representing the correct Issue Asset for the instrument in question.
    An Issue Asset can have zero or many Quote Assets. A Quote Asset can have zero or a maximum of one Issue Assets.
- name: Mic
  type: varchar(4)
  nullable: true
  description: Market Identifier Code. This is a four-character alpha code assigned by the London Stock Exchange that indicates
    the exchange or market where an instrument is traded. It is delivered in conjunction with the SEDOL and all RIC codes
    reporting a SEDOL should have a MIC code.
- name: Ticker
  type: varchar(25)
  nullable: true
  description: Tickers and Symbols will be stored in this property against Quotes. No other storage will be provided for Tickers
    and Symbols. Local exchange quote identifier.
- name: ComName
  type: varchar(400)
  nullable: true
  description: For instruments sourced from IDN, the Common Name in the DISPLAY NAME field on IDN (FID 3), as processed by
    the PEN feed. This value may be overwritten by Data Operations according to a detailed set of standards.
- name: PriEstPermID
  type: BIGINT
  nullable: true
  description: Primary Estimate ID.
- name: LotSize
  type: FLOAT
  nullable: true
  description: Lot Size. Database Schema for Symbology 12
---
table: qa_symbology.PermQuoteInfo
domain: reference
description: This table provides information about the quote.
update_cadence: Every 15 minutes, Monday to Friday
columns:
- name: QuotePermID
  type: BIGINT
  nullable: false
  description: PermId of the quote
- name: Category
  type: varchar(400)
  nullable: true
  description: This is a legacy field. Use the RSCAssetCla field to identify the correct classification of a security.
- name: RCSAssetCla
  type: varchar(400)
  nullable: true
  description: LSEG Classification Scheme classification. Cross- reference RCSAssetCla with RDCDesc.Code where RDCDesc.Type_=
    60.
- name: Opol
  type: varchar(4)
  nullable: true
  description: Official Place of Listing. This is the same as the MIC code and is assigned to the financial instrument decreed
    by the LSE to be the Official Place of Listing in a particular country. For countries with one exchange, users will see
    SEDOL, MIC, and OPOL but for countries with regional exchanges (e.g. Japan, Germany, USA) DataScope users will see SEDOL
    and MIC for all RICs on an issue but only see an OPOL code attached to one RIC only.
- name: ShortName
  type: varchar(400)
  nullable: true
  description: 'This field is not mandatory. It is populated principally for Quote Asset records sourced from IDN and should
    hold the contents of the DISPLAY NAME field (FID 3). No formal standard has been set for this field other than: the name
    must be a maximum 20 characters (minimum 2); the name is normally upper case (but mixed case entries are acceptable);
    nonstandard, non-English and/or accented characters are not acceptable.'
- name: TrdWhenIssued
  type: BOOLEAN
  nullable: true
  description: 'Indicates whether a Security is traded when issued or not. This flag is for Equity Assets only. (Values: Y/NULL)
    for ‘active’ quote assets of type EQUITY.'
- name: Is144aReg
  type: BOOLEAN
  nullable: true
  description: '144A Registered Flag. 144a Registered securities are ‘controlled and restricted '' securities that are allowed
    to be sold for a particular length of time before Registration. (Values: Y/NULL) for ‘active’ quote assets of NDA asset
    sub-categories: CPR, UNT, EIW, ORD, DRC, PRF.'
- name: RetireDate
  type: TIMESTAMP(6)
  nullable: true
  description: Retire Date.
- name: DsQuoteNumber
  type: char(6)
  nullable: true
  description: Datastream Quote Number. Database Schema for Symbology 13
---

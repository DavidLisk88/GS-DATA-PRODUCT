table: qa_symbology.PermInstrRef
domain: reference
description: This table provides detailed reference information at the financial instrument level.
update_cadence: Every 15 minutes, Monday to Friday
columns:
- name: InstrPermID
  type: BIGINT
  nullable: false
  description: PermId of the financial instrument.
- name: IsPrimary
  type: BOOLEAN
  nullable: true
  description: Indicates if it is a primary instrument.
- name: Status
  type: varchar(400)
  nullable: true
  description: For non debt issues if an Issue Asset/Instrument has at least one Quote which is Active (Asset State = ‘AC’),
    then AssetState is Active 'AC', else, if all Quote Assets are Deactivated (Asset State = ‘DC’) then AssetState becomes
    Deactivated 'DC'. AssetState is derived for all Asset types except DEBT Issues which are maintained by the DBS forward
    feed. AssetState is 'NA' (Not Applicable) when no Quote Asset is found against the Issue/Instrument, in particular new
    Issues will get 'NA' status as so
- name: TypeCode
  type: varchar(400)
  nullable: true
  description: This is a legacy field. Reference the RCSAssetCla field in the PermQuoteInfo and PermInstrInfo tables.
- name: ComName
  type: varchar(400)
  nullable: true
  description: Population of this field is not mandatory. In most instances the field will not be populated, except for Equity
    Indices, and Warrants sourced from DBS. Database Schema for Symbology 10
- name: CurrPermID
  type: BIGINT
  nullable: true
  description: The Issue Currency ID.
- name: OrgPermID
  type: BIGINT
  nullable: true
  description: The id of the origination or body group to which an issuer relationship exists between the instrument and organization.
    bigint Yes This field identifies the quote for an instrument on the primary exchange it is traded on. This is applicable
    to multi-listed US-based companies.
- name: ValQuotePermID
  type: BIGINT
  nullable: true
  description: This is the main ‘primary’ Quote for a multi-listed share line that is used to calculate Market Cap. In the
    US, for example, this will be the consolidated quote on NYSE, AMEX or NASDAQ. It is set for EVERY share line, because
    Market Cap can be calculated on the whole company or on each issue. D varchar(12) Yes Worldscope Company ID.
- name: PriRptEntityCode
  type: varchar(5)
  nullable: true
  description: Primary Reporting Entity Code.
- name: PriEstPermID
  type: BIGINT
  nullable: true
  description: Primary Estimate ID.
- name: LipperID
  type: BIGINT
  nullable: true
  description: Lipper Identifier.
- name: EJVAssetID
  type: varchar(20)
  nullable: true
  description: Fixed Income EJV Asset ID.
- name: ADRRatio
  type: varchar(30)
  nullable: true
  description: ADR Ratio.

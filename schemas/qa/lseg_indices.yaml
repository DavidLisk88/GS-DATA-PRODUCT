table: qa_lseg_idx.IdxTRChg
domain: indices
description: Index Change History | This table contains the history related to changes in static values for a particular index.
update_cadence: Daily
columns:
- name: IdxCode
  type: INTEGER
  nullable: false
  description: IdxCode is a unique integer code that identifies an index. This code is defined in the Quantitative Data Warehouse
    (QDW) and is not received from the vendor. This code is generated based on the index RIC.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the date an index changes.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is one day prior to the StartDate of an index change.
- name: RIC
  type: varchar(64)
  nullable: true
  description: RIC is the LSEG identifier for an index.
- name: BrdgSym
  type: varchar(15)
  nullable: true
  description: BrdgSym is the bridge identifier.
- name: IdxName
  type: varchar(255)
  nullable: true
  description: IdxName is the short name for an index.
- name: CtryRegCode
  type: INTEGER
  nullable: true
  description: CtryRegCode is the country or region name for an index. IdxTRChg.CtryRegCode cross-references with IdxTRCode.Code
    where Type_ = 2. The two-letter country code descriptions cross-reference with IdxTRDesc.Code where Type_ = 1.
- name: RetTypeCode
  type: char(1)
  nullable: true
  description: 'RetTypeCode can be the following: – P = Price only – T = Total return IdxTRChg.RetTypeCode cross-references
    with IdxTRDesc.Code where Type_ = 2.'
- name: TRBCSectCode
  type: INTEGER
  nullable: true
  description: TRBCSectCode is the The Reference Business Classification (TRBC) sector group code.
- name: TRBCSectName
  type: varchar(255)
  nullable: true
  description: TRBCSectName is the The Reference Business Classification (TRBC) sector name.
- name: CapCode
  type: char(2)
  nullable: true
  description: 'CapCode is the capitalization group code for the index: – L = Large Cap – M = Mid Cap – S = Small Cap IdxTRChg.CapCode
    cross-references with IdxTRDesc.Code where Type_ = 4.'
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is the license flag that helps identify the entitlement requirements for permissioning LSEG Indices
    data. IdxTRChg.LicFlag cross-references with IdxTRCode.Code where Type_ = 3. LSEG Quantitative Analytics LSEG Indices
    7
join_hints:
- to: IdxTRDesc
  evidence: 'RetTypeCode char(1) Y RetTypeCode can be the following: – P = Price only – T = Total return IdxTRChg.RetTypeCode
    cross-references with IdxTRDesc.Code where Type_ = 2.'
  type: cross_reference
- to: IdxTRDesc
  evidence: 'CapCode char(2) Y CapCode is the capitalization group code for the index: – L = Large Cap – M = Mid Cap – S =
    Small Cap IdxTRChg.CapCode cross-references with IdxTRDesc.Code where Type_ = 4.'
  type: cross_reference
---
table: qa_lseg_idx.IdxTRCode
domain: indices
description: Numeric Codes | This table contains descriptions of numeric codes.
update_cadence: Daily
columns:
- name: Type_
  type: INTEGER
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: INTEGER
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(150)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code.

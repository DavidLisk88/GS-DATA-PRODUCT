table: qa_lseg_idx.IdxTRFxRate
domain: indices
description: Index Forex Rate | This table contains information about the foreign exchange rate (security currency rate in
  index currency).
update_cadence: Daily
columns:
- name: CrossRate
  type: INTEGER
  nullable: false
  description: CrossRate is the foreign exchange cross rate based on the Cur and IX_Cur fields from the ICW file. IdxTRFxRate.CrossRate
    cross-references with IdxTRCode.Code where Type_ = 1.
- name: CtryRegCode
  type: INTEGER
  nullable: false
  description: CtryRegCode is the country or region name for an index only. IdxTRFxRate.CtryRegCode cross-references with
    IdxTRCode.Code where Type_ = 2. The two-letter country code descriptions cross-reference with IdxTRDesc.Code where Type_
    = 1.
- name: Date_
  type: TIMESTAMP(6)
  nullable: false
  description: Date_ is the market date for which the data in the file is valid.
- name: FxRate
  type: FLOAT
  nullable: true
  description: FxRate is the security currency rate in index currency.

table: qa_catalog.QASchInfo
domain: reference
description: This table provides the information about the schemas available in the Quantitative Analytics database.
update_cadence: As needed
columns:
- name: SchemaId
  type: INTEGER
  nullable: false
  description: Unique Identifier for the Schema Record.
- name: Name
  type: varchar(100)
  nullable: true
  description: Title of the Schema Document.
- name: Description
  type: varchar(1200)
  nullable: true
  description: Description of the Schema.
- name: SchemaLink
  type: varchar(100)
  nullable: true
  description: URL for the Schema Document.
- name: IsProprietary
  type: BOOLEAN
  nullable: true
  description: Identifies if the schema is an LSEG offering.
- name: SourcedFrom
  type: varchar(60)
  nullable: true
  description: Product the data is being updated from.
- name: AvailableOn
  type: INTEGER
  nullable: true
  description: Platform(s) the offering is available on, cross-reference QASchCode where CodeType = 1.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date the Schema became available on Quantitative Analytics.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date the Schema became unavailable on Quantitative Analytics.
- name: AddDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date the Schema was added to the Quantitative Analytics Schema Catalog.
- name: LastModDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date the Schema Document was last modified.

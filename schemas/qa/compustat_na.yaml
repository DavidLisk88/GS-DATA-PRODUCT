table: qa_compustat_na.CSIdxDaily
domain: fundamentals
description: Index Daily Market Values | This table contains information for index daily market values.
update_cadence: Daily
columns:
- name: GVKEYX
  type: INTEGER
  nullable: false
  description: GVKEYX is a unique identifier and primary key for each index.
- name: DATADATE
  type: smalldatetime
  nullable: false
  description: DATADATE is the end date of the quarter for which the data was reported.
- name: NEWNUM
  type: INTEGER
  nullable: true
  description: NEWNUM is the new index number. NEWNUM represents the number of constituents in the index for the current trade
    date.
- name: OLDNUM
  type: INTEGER
  nullable: true
  description: OLDNUM is the old index number. OLDNUM represents the number of constituents in the index for the previous
    trade date.
- name: PRCCD
  type: FLOAT
  nullable: true
  description: PRCCD is the close price for a given day of a company or index. For bid/ask pricing with no current volume,
    the close price is the last trade close price with volume.
- name: PRCHD
  type: FLOAT
  nullable: true
  description: PRCHD is the highest trade price for the given date. For bid/ask pricing, high is the last asking price prior
    to market close, or the previous ask price when bid/ask is more than 50 percent of the latest ask price.
- name: PRCLD
  type: FLOAT
  nullable: true
  description: PRCLD is the lowest trade price for the given date. For bid/ask pricing, low is the last bid prior to market
    close, or the previous bid price when bid/ask is more than 50 percent of the latest ask price.
- name: DVPSXD
  type: FLOAT
  nullable: true
  description: DVPSXD is the amount of the cash or cash-equivalent dividend payment, or the ratio of a stock split or stock
    dividend.
- name: PRCCDDIV
  type: FLOAT
  nullable: true
  description: PRCCDDIV is the daily close price rate of return of an index. PRCCDDIV reflects price appreciation plus the
    reinvestment of daily dividends and the compounding effect of dividends paid on reinvested dividends.
---
table: qa_compustat_na.CSIdxMth
domain: fundamentals
description: Index Monthly Market Values | This table contains information for index monthly market values.
update_cadence: Daily
columns:
- name: GVKEYX
  type: INTEGER
  nullable: false
  description: GVKEYX is a unique identifier and primary key for each index.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the end date of the quarter for which the data was reported.
- name: DVPSXM
  type: FLOAT
  nullable: true
  description: DVPSXM is the index monthly cash dividend paid per share by ex date. DVPSXM is adjusted for all stock splits
    and stock dividends that occurred during the period. This value does not include payments in preferred stock in lieu of
    cash, spin-offs, and stock of other corporations.
- name: PRCCM
  type: FLOAT
  nullable: true
  description: PRCCM is the absolute close market price for each calendar month.
- name: PRCHM
  type: FLOAT
  nullable: true
  description: PRCHM is the absolute high market price for each calendar month.
- name: PRCLM
  type: FLOAT
  nullable: true
  description: PRCLM is the absolute low market price for each calendar month.
- name: AJEXM
  type: FLOAT
  nullable: true
  description: AJEXM is the monthly cumulative adjustment factor. This is the monthly price adjustment factor used to adjust
    the security's price for corporate events.
- name: BKVLPS
  type: FLOAT
  nullable: true
  description: BKVLPS is the book value per share, calculated annually from the calendar year- end index data.
- name: EPSX12
  type: FLOAT
  nullable: true
  description: EPSX12 is the basic earnings per share (12 Months Moving) before extraordinary items and discontinued operations.
    LSEG Quantitative Analytics Database Schema for Compustat North America Data 21
- name: CSHTRM
  type: FLOAT
  nullable: true
  description: CSHTRM is the monthly number of shares traded for companies listed on national stock exchanges and over-the-counter
    companies in the NASDAQ system.
- name: DVRATE
  type: FLOAT
  nullable: true
  description: DVRATE is the monthly indicated annual dividend rate.

  type: smalldatetime
  nullable: false
  description: Datadate is the fiscal quarter for which value_ is reporting.
- name: POINTDATE
  type: smalldatetime
  nullable: false
  description: Pointdate is the point in time restated date. Pointdate is insignificant for AFR and final restated valuetypes.

table: qa_compustat_na.CSBData
domain: fundamentals
description: Compustat Quarterly As First Reported Data | This table contains information for Compustat quarterly as first
  reported data.
update_cadence: Monthly (vendor releases first week of the month)
columns:
- name: CODE
  type: INTEGER
  nullable: false
  description: Code is the primary link across all CS* tables.
- name: ITEM
  type: SMALLINT
  nullable: false
  description: Item cross references with CSBItem_csbitem:_Compustat_AFR where Item = CSBItem.Number.
- name: DATE_
  type: smalldatetime
  nullable: false
  description: Date_ cross references with CSBPrD where Code = CSBPrD.Code and Date_ = CSBPrD.EndDate. Use CSBPrD to determine
    the fiscal year of the period end date.
- name: FLAG
  type: SMALLINT
  nullable: true
  description: 'Flag contains the following values: – 0 = No Value_/ValueR available – 1 = Quarterly number – 2 = Data supplied
    by Compustat contained an Annual Figure Code (@AF). Since the AFR database is stored adjusted, the original number was
    divided by 4 to conform to the Quarterly structure of the CSBData table. – 3 = Data supplied by Compustat contained a
    Semi-annual Figure Code (@SF). Since the AFR database is stored adjusted, the original number was divided by 2 to conform
    to the Quarterly structure of'
- name: FLAGR
  type: SMALLINT
  nullable: true
  description: See Flag for a description of FlagR.
- name: VALUE_
  type: FLOAT
  nullable: true
  description: Value_ is the raw value provided by Compustat.
- name: VALUER
  type: FLOAT
  nullable: true
  description: ValueR represents the originally reported value (subject to flags listed below).
join_hints:
- to: CSBPrD
  evidence: DATE_ smalldatetime N Date_ cross references with CSBPrD where Code = CSBPrD.Code and Date_ = CSBPrD.EndDate.
  type: cross_reference

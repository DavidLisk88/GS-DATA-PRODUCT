columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: GVKEY is a unique company key and is the primary link for all CS* tables.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the end date of the quarter for which the data was reported.
- name: CFFLAG
  type: char(1)
  nullable: false
  description: CFFLAG indicates whether the year-end price represents the company's fiscal year- end or year-end. The calendar
    year-end will always be on December 31 (12/31/YYYY).
- name: CURCD
  type: TINYINT
  nullable: false
  description: CURCD identifies the currency of the company’s financial data within the database. When CURCD is not the same
    as CURNCD, Compustat has translated the data from CURNCD to CURCD using the translation rate reported in CURRTR. Since
    CURCD is part of the primary key in this table, the value is stored as an integer for faster data retrieval. To return
    the string value (e.g. USD, CAD), join CURCD to CsKeyCode.Code.
- name: CLSM
  type: SMALLINT
  nullable: true
  description: CLSM is the month of the company's last close price.
- name: CSHTR
  type: FLOAT
  nullable: true
  description: CSHTR is the number of shares traded for companies listed on national stock exchanges and over-the-counter
    companies in the NASDAQ system on a fiscal, rather than calendar, basis.
- name: DVPSP
  type: FLOAT
  nullable: true
  description: DVPSP is the cash dividends per share for which the payable dates occurred during the reporting period, unadjusted
    for all stock splits and stock dividends that occurred during the period.
- name: DVPSX
  type: FLOAT
  nullable: true
  description: DVPSX is the cash dividends per share for which the ex-dividend dates occurred during the reporting period,
    adjusted for all stock splits and stock dividends that occurred during the period.
- name: PRCC
  type: FLOAT
  nullable: true
  description: PRCC is the absolute close transactions during the year for companies on national stock exchanges and bid prices
    for over-the-counter issues.
- name: PRCH
  type: FLOAT
  nullable: true
  description: PRCH is the absolute high transactions during the year for companies on national stock exchanges and bid prices
    for over-the-counter issues. LSEG Quantitative Analytics Database Schema for Compustat North America Data 113
- name: PRCL
  type: FLOAT
  nullable: true
  description: PRCL is the absolute low transactions during the year for companies on national stock exchanges and bid prices
    for over-the-counter issues.
- name: YEAR_
  type: SMALLINT
  nullable: true
  description: YEAR_ is the year of the data.

  type: TINYINT
  nullable: true
  description: UNITS is not currently used.
- name: DATATYPE
  type: TINYINT
  nullable: true
  description: DATATYPE describes the data type.
- name: REFTYPE
  type: TINYINT
  nullable: true
  description: REFTYPE is not currently used.
- name: SCALE
  type: FLOAT
  nullable: true
  description: SCALE is the transparency scale value.
- name: MONITEM
  type: TINYINT
  nullable: true
  description: MONITEM is not currently used.
- name: GNAME
  type: varchar(50)
  nullable: true
  description: GNAME is the description for Group_.
- name: FTPMNEMONIC
  type: varchar(20)
  nullable: true
  description: FTPMNEMONIC is the mnemonic from the FTP product, when available.
- name: RESTATED
  type: varchar(21)
  nullable: true
  description: RESTATED is the mnemonic for the corresponding restated item (for example, SALER for Sales).
- name: GROUPID
  type: SMALLINT
  nullable: true
  description: 'GROUPID identifies the group to which the item belongs. FREQ is the item frequency, and may be: FREQ Symbol
    Description 0 N/A Static 1 A Annual 2 Q Quarterly 3 M Monthly 4 S Semi annual 5 W Weekly 6 D Daily 7 C Scalar 8 Y Year
    to date 9 O 12 month moving LSEG Quantitative Analytics Database Schema for Compustat North America Data 18 4 Schema for
    Compustat XF'

description: Inactive Quarterly Industry Statistics Footnotes | This table contains information for inactive quarterly industry
  statistics footnotes.
update_cadence: 'Daily Adjusted: No'
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: GVKEY is a unique company key and is the primary link for all CS* tables.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the end date of the quarter for which the data was reported.
- name: INDFMT
  type: TINYINT
  nullable: false
  description: INDFMT is the industry format. This describes whether a company reports in a financial services or industrial
    format. INDFMT is translated in CSKeyCode where FIELDNAME = INDFMT.
- name: CONSOL
  type: TINYINT
  nullable: false
  description: CONSOL is the level of consolidation of the company’s financial statements in a company record. CONSOL is translated
    by CSKeyCode where FIELDNAME = CONSOL.
- name: FYR
  type: SMALLINT
  nullable: false
  description: FYR designates the month-end for a company's accounting year.
- name: DATAFMT
  type: TINYINT
  nullable: false
  description: DATAFMT describes how data is collected and presented. DATAFMT is translated by CSKeyCode where FIELDNAME =
    DATAFMT.
- name: ITEM
  type: SMALLINT
  nullable: false
  description: Item is the Compustat item; it cross-references CSNAItem where CSNAItem.Number = CSIACoIndFntQ.Item and Group_
    = 253.
- name: VALUE_
  type: varchar(9)
  nullable: true
  description: Value_ is the raw value provided by Compustat.

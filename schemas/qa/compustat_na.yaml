table: qa_compustat_na.CSICoADesInd
domain: fundamentals
description: Inactive Annual Descriptor | This table contains inactive annual descriptor information.
update_cadence: Daily
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: GVKEY is a unique company key and is the primary link for all CS* tables.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the end date of the quarter for which the data was reported.
- name: INDFMT
  type: TINYINT
  nullable: false
  description: INDFMT is the industry format. This describes whether a company reports in a financial services or industrial
    format. INDFMT is translated in CSKeyCode where FIELDNAME = INDFMT.
- name: DATAFMT
  type: TINYINT
  nullable: false
  description: DATAFMT describes how data is collected and presented. DATAFMT is translated by CSKeyCode where FIELDNAME =
    DATAFMT.
- name: CONSOL
  type: TINYINT
  nullable: false
  description: CONSOL is the level of consolidation of the company’s financial statements in a company record. CONSOL is translated
    by CSKeyCode where FIELDNAME = CONSOL. LSEG Quantitative Analytics Database Schema for Compustat North America Data 108
- name: ACCTSTD
  type: varchar(9)
  nullable: true
  description: ACCTSTD identifies the accounting standard a company uses when preparing its financial statements. If a company
    does not reference a specific standard, a domestic standard is assumed. ACCTSTD is translated by CSRAccStd where CSRAccStd.ACCTSTDCD
    = CSICoADesInd.ACCTSTD.
- name: ACQMETH
  type: varchar(3)
  nullable: true
  description: ACQMETH is the code that identifies the method a company uses to account for acquisitions. ACQMETH is translated
    by CSRAcqMeth where CSRAcqMeth.ACQMETHCD = CSICoADesInd.ACQMETH.
- name: ADRR
  type: FLOAT
  nullable: true
  description: ADRR is the ADR (American Depository Receipt) Ratio. This indicates the number of a foreign company’s common
    or ordinary shares that are equivalent to one ADR or one ADS (American Depository Share). This ratio is usually a whole
    number, and is available only for foreign companies that trade ADR or ADS in the U.S. ADRR is on an annual basis.
- name: AJEX
  type: FLOAT
  nullable: true
  description: AJEX is the adjustment factor you use to adjust per-share data (such as price, earnings per share, and dividends
    per share) and share data (such as shares outstanding and shares traded) for all stock splits and stock dividends occurring
    subsequent to the end of a given period. The ex-dividend date is used to determine the adjustment of per-share data. The
    cumulative adjustment factor changes whenever a stock split or stock dividend occurs. AJEX is on an annual basis.
- name: AJP
  type: FLOAT
  nullable: true
  description: AJP is the adjustment factor you use to adjust dividends per share for all stock dividends occurring subsequent
    to the end of a given period. The payable date is used to determine the adjustment of per-share data. The cumulative adjustment
    factor changes whenever a stock dividend occurs. AJP is on an annual basis.
- name: APDEDATE
  type: TIMESTAMP(6)
  nullable: true
  description: APDEDATE is the actual date the company closes their accounting period, which may be different from the last
    day of the month in the period. APDEDATE is in the form YYYY-MM-DD.
- name: BSPR
  type: varchar(9)
  nullable: true
  description: BSPR is the balance sheet presentation method. BSPR is translated by CSRBalPres where CSRBalPres.BSPRCD = CSICoADesInd.BSPR.
- name: COMPST
  type: varchar(9)
  nullable: true
  description: COMPST is the comparability status which describes conditions under which data in one period may not be comparable
    to data in another period. COMPST is translated by CSRCompStat where CSRCompStat.COMPSTCD = CSICoADesInd.COMPST.
- name: CURCD
  type: varchar(4)
  nullable: true
  description: CURCD identifies the currency of the company’s financial data within the database. When CURCD is not the same
    as CURNCD, Compustat has translated the data from CURNCD to CURCD using the translation rate reported in CURRTR.
- name: CURNCD
  type: varchar(4)
  nullable: true
  description: CURNCD is the native currency code and identifies the currency in which the company reports its financial data.
    When CURNCD is not the same as CURCD, Compustat has translated the data from CURNCD to CURCD using the translation rate
    reported in CURRTR.
- name: CURRTR
  type: FLOAT
  nullable: true
  description: CURRTR is the currency translation rate. This is the rate of exchange used to translate international currency
    into U.S. dollars. The rate used is the rate in effect as of the date of the company’s balance sheet. If an international
    company reports in U.S. dollars, the translation rate is 1.000.
- name: CURUSCN
  type: FLOAT
  nullable: true
  description: CURUSCN is the rate of exchange used to translate Canadian currency amounts into U.S. dollar amounts. This
    is available only when a company reports in both U.S. and Canadian accounting standards.
- name: FDATE
  type: TIMESTAMP(6)
  nullable: true
  description: FDATE is the date the data was finalized for that year or quarter.
- name: FYEAR
  type: SMALLINT
  nullable: true
  description: FYEAR represents the fiscal year of the current fiscal year-end month.
- name: FYR
  type: SMALLINT
  nullable: true
  description: FYR designates the month-end for a company's accounting year.
- name: ISMOD
  type: SMALLINT
  nullable: true
  description: ISMOD is the income statement model number.
- name: OGM
  type: varchar(9)
  nullable: true
  description: OGM is the method of reporting revenue used by the Oil & Gas company.
- name: PDATE
  type: TIMESTAMP(6)
  nullable: true
  description: PDATE is the date the data for the company is updated on a preliminary basis for that year or quarter.
- name: PDDUR
  type: SMALLINT
  nullable: true
  description: PDDUR is a unique integer code that identifies the source of the data. PDDUR is defined in TDW and is not received
    from the vendor. The vendor provides a two- character numeric code and is represented in the feed files as PDDUR.
- name: SCF
  type: SMALLINT
  nullable: true
  description: SCF contains the numeric code that identifies the format of a company's flow of funds statement, statement
    of changes, or statement of cash flow. LSEG Quantitative Analytics Database Schema for Compustat North America Data 109
- name: SRC
  type: SMALLINT
  nullable: false
  description: SRC contains code that indicates the most recent source from which S&P obtained data for each fiscal period.
- name: STALT
  type: varchar(3)
  nullable: true
  description: STALT is a unique integer code that identifies the source of the data. STALT is defined in TDW and is not received
    from the vendor. The vendor provides a two- character numeric code and is represented in the feed files as STALT.
- name: UDPL
  type: varchar(9)
  nullable: true
  description: UDPL designates the method used by the utility company to account for Liberalized Depreciation.
- name: UPD
  type: SMALLINT
  nullable: true
  description: UPD contains the code that identifies the updated status of the data for the period. UPD consists of a one-character
    numeric code.

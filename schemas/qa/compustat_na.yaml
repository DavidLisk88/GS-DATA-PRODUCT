table: qa_compustat_na.CSCurrency
domain: fundamentals
description: Xpressfeed Currencies | This table contains information for Xpressfeed currencies.
update_cadence: Daily
columns:
- name: ISOCURCD
  type: varchar(4)
  nullable: false
  description: ISOCURCD represents the ISO names of countries and their respective currencies.
- name: ISOCURBD
  type: TIMESTAMP(6)
  nullable: true
  description: ISOCURBD is the ISO currency birth date. It identifies the date that a particular currency was first used within
    a particular country.
- name: ISOCURDD
  type: TIMESTAMP(6)
  nullable: true
  description: ISOCURDD is the ISO currency death date. It identifies the date that a particular currency was last used within
    a particular country.
- name: ISOCURLNK
  type: SMALLINT
  nullable: true
  description: ISOCURLNK is the ISO currency link code. It associates two or more currencies that have been used in the same
    country at different times.
- name: ISOCURNM
  type: varchar(101)
  nullable: true
  description: ISOCURNM is the ISO currency code name. It is the name of the currency in which daily or monthly prices are
    reported.
- name: ISOCURTR
  type: TINYINT
  nullable: true
  description: ISOCURTR is the ISO currency tier number. Currencies are classified as Tier 1 or Tier 2. Tier 1 currencies
    can be translated directly into other currencies. Tier 2 currencies are first translated into one of four primary currencies,
    then translated from the primary currency into the target currency. The four primary currencies are U.S. Dollar, British
    Pound Sterling, Japanese Yen, and Swiss Francs.

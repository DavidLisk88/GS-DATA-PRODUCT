table: qa_compustat_na.CSPITDFnd
domain: fundamentals
description: Compustat PIT As First Reported and Fully Restated | This table contains information for Compustat PIT as first
  reported and fully restated data.
update_cadence: Monthly
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: GvKey is a unique company key and is the primary link for all CS* tables.
- name: DATADATE
  type: smalldatetime
  nullable: false
  description: Datadate is the end date of the quarter for which the data was reported.
- name: POINTDATE
  type: smalldatetime
  nullable: false
  description: Pointdate is not significant in this table.
- name: ITEM
  type: INTEGER
  nullable: false
  description: Item cross references CSPITItem where item = CSPITItem.number.
- name: DATACODE
  type: SMALLINT
  nullable: true
  description: Datacode is described in the Datacode section on page 165.
- name: VALUETYPE
  type: SMALLINT
  nullable: false
  description: 'Valuetype can be one of the following values: – 0 = Final restated – 1 = AFR'
- name: VALUE_
  type: FLOAT
  nullable: true
  description: 'Value_ is unadjusted. Reference CSPITAdj for adjustment factor where DataDate = CSPITAdj Datadate. The full
    history of restatements between AFR and fully restated, inclusive, is the combination of CSPITDFnd and CSPITDHstFnd. Datacode
    is the data code for the item. Possible values include: – 0 = OK; normal. Data in corresponding field is normal. – 1 =
    NA; not applicable. Data in corresponding field is normal. – 2 = SF; semi-annual figure. Data in corresponding field is
    a semi-annual (6 month) val'
---

table: qa_compustat_na.CSBkCoIMkt
domain: fundamentals
description: Interim Market Group Historical | This table contains historical interim market group information.
update_cadence: Daily
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: GVKEY is a unique company key and is the primary link for all CS* tables.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the end date of the quarter for which the data was reported.
- name: CFFLAG
  type: char(1)
  nullable: false
  description: CFFLAG indicates whether the year-end price represents the company's fiscal year-end or the calendar year-end.
    The calendar year-end will always be on December 31 (12/31/YYYY).
- name: CURCD
  type: TINYINT
  nullable: false
  description: CURCD identifies the currency of the company’s financial data within the database. When CURCD is not the same
    as CURNCD, Compustat has translated the data from CURNCD to CURCD using the translation rate reported in CURRTR. Since
    CURCD is part of the primary key in this table, the value is stored as an integer for faster data retrieval. To return
    the string value (e.g. USD, CAD), join CURCD to CsKeyCode.Code.
- name: YEM
  type: SMALLINT
  nullable: false
  description: YEM works with CFFLAG to represent the month of the company's year-end price.
- name: CLSMQ
  type: SMALLINT
  nullable: true
  description: CLSMQ is the same as CLSM, but is on a quarterly basis.
- name: CSHTRQ
  type: FLOAT
  nullable: true
  description: CSHTRQ is the same as CSHTR, but is on a quarterly basis.
- name: DVPSPQ
  type: FLOAT
  nullable: true
  description: DVPSPQ is the same as DVPSP, but is on a quarterly basis.
- name: DVPSXQ
  type: FLOAT
  nullable: true
  description: DVPSXQ is the same as DVPSX, but is on a quarterly basis.
- name: PRCCQ
  type: FLOAT
  nullable: true
  description: PRCCQ is the same as PRCC, but is on a quarterly basis.
- name: PRCHQ
  type: FLOAT
  nullable: true
  description: PRCHQ is the same as PRCH, but is on a quarterly basis.
- name: PRCLQ
  type: FLOAT
  nullable: true
  description: PRCLQ is the same as PRCL, but is on a quarterly basis.
- name: YEAR_
  type: SMALLINT
  nullable: true
  description: YEAR_ is the year of the data.

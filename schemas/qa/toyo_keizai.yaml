table: qa_toyo.TK2Info
domain: fundamentals
description: Company Information | This table lists the companies covered by this implementation of the Toyo Keizai TREND3EPOT
  datafeed.
columns:
- name: SecurityID
  type: INTEGER
  nullable: false
  description: SecurityID is a unique ID number assigned by Toyo Keizai to each company covered. If a company has more than
    one listing of common stock, each has a unique ID.
- name: TKC
  type: INTEGER
  nullable: true
  description: TKC indicates the original Toyo Keizai company code.
- name: CmpNameEng
  type: varchar(80)
  nullable: true
  description: CmpNameEng is the company name in English.
- name: ISIN
  type: varchar(12)
  nullable: true
  description: ISIN is the company International Securities Identification Number (ISIN).
- name: EDINET
  type: varchar(8)
  nullable: true
  description: EDINET is the company identifier assigned by the Electronic Disclosure for Investors NETwork (EDINET).
- name: OrgTypeCode
  type: TINYINT
  nullable: true
  description: OrgTypeCode identifies the type of organization. TK2Info.OrgTypeCode cross-references with TK2Code.Code where
    Type_ = 1.
- name: OrgTypePosCode
  type: TINYINT
  nullable: true
  description: OrgTypePosCode identifies the position in the company name of the organization type. For example, if the company
    name is Sanyo Corporation, then this code indicates that Corporation comes after the company name, Sanyo. TK2Info.OrgTypePosCode
    cross-references with TK2Code.Code where Type_ = 2.
- name: SIC
  type: INTEGER
  nullable: true
  description: SIC stands for Securities Identification Code.
- name: SICSectorCode
  type: INTEGER
  nullable: true
  description: SICSectorCode is a three-digit code that indicates the company sector. TK2Info.SICSectorCode cross-references
    with TK2Code.Code where Type_ = 17.
- name: TKSectorCode
  type: INTEGER
  nullable: true
  description: TKSectorCode indicates the company’s fourth-level sector classification based on Toyo Keizai’s original sector
    hierarchy. LSEG Quantitative Analytics Toyo Keizai 9
- name: Zip
  type: varchar(10)
  nullable: true
  description: Zip is the company’s zip code.
- name: Phone
  type: varchar(12)
  nullable: true
  description: Phone is the company’s phone number.
- name: URL
  type: varchar(50)
  nullable: true
  description: URL is the company’s Web site address.
- name: EstDate
  type: TIMESTAMP(6)
  nullable: true
  description: EstDate is the date of establishment of the company.
---

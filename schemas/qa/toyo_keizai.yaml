table: qa_toyo.TK2AdjFactor
domain: fundamentals
description: Adjustment Factors | Use this table to retrieve historical adjustment factors for per share data items.
columns:
- name: SecurityID
  type: INTEGER
  nullable: false
  description: SecurityID is a unique ID number assigned by Toyo Keizai to each company covered. If a company has more than
    one listing of common stock, each has a unique ID.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the effective start date for the adjustment factor.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the effective end date for the adjustment factor.
- name: Factor
  type: FLOAT
  nullable: true
  description: Factor is the adjustment factor used for stock prices at the event. Events may be stock splits, paid share
    allotments, capital decreases, or reverse stock splits.
- name: ExDate
  type: TIMESTAMP(6)
  nullable: true
  description: ExDate is the ex-rights date of the capital action.
- name: RecDate
  type: TIMESTAMP(6)
  nullable: true
  description: RecDate is the record date of the capital action.
- name: PayDate
  type: TIMESTAMP(6)
  nullable: true
  description: PayDate is the payment date of the capital action.
- name: CumFactor
  type: FLOAT
  nullable: true
  description: 'CumFactor is the LSEG-calculated cumulative adjustment factor for historical per share data. CumFactor is
    derived by LSEG using the following formula: IF current record (that is, if EndDate is NULL), CumFactor = 1 ELSE, CumFactor
    = (Prev CumFactor / Prev Factor)'
---
table: qa_toyo.TK2CumAdjFactor
domain: fundamentals
description: Cumulative Adjustment Factors | Use this table to retrieve historical, cumulative adjustment factors for per
  share data items.
columns:
- name: SecurityID
  type: INTEGER
  nullable: false
  description: SecurityID is a unique ID number assigned by Toyo Keizai to each company covered. If a company has more than
    one listing of common stock, each has a unique ID.
- name: EvalStartDate
  type: TIMESTAMP(6)
  nullable: false
  description: The evaluation start date; it is a point-in-time representation of the adjustment factor. A single evaluation
    point can have multiple observation points.
- name: ObsStartDate
  type: TIMESTAMP(6)
  nullable: false
  description: The observation start date; the observation point falls between the observation start and end date. This represents
    the point in time in which the security is being observed; when backtesting historical observation points should be used.
- name: EvalEndDate
  type: TIMESTAMP(6)
  nullable: true
  description: The evaluation end date; it is a point-in-time representation of the adjustment factor. A single evaluation
    point can have multiple observation points.
- name: ObsEndDate
  type: TIMESTAMP(6)
  nullable: true
  description: The observation end date; the current observation period is represented by ObsEndDate = 1999-12-31.
- name: CumAdjFactor
  type: FLOAT
  nullable: true
  description: The cumulative adjustment factor.
---

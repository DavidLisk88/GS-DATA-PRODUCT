table: qa_us_insider.InsCode
domain: ownership
description: United States Insider Codes | This table provides descriptions for the coded fields in the US Insider tables.
  | This table is shared between the US Insider Filing and US Insider Trading Data tables.
update_cadence: Daily
columns:
- name: Type_
  type: SMALLINT
  nullable: false
  description: Type_ identifies the reference type. Types are defined where Type_ = 0 and Code identifies Type_.
- name: Code
  type: varchar(5)
  nullable: false
  description: Code is described by Desc_. Code is cross-referenced from other tables.
- name: StrCode
  type: varchar(10)
  nullable: true
  description: StrCode is the character code provided by the vendor, if applicable. If not available, StrCode is the same
    as Code.
- name: Desc_
  type: varchar(1000)
  nullable: true
  description: Desc_ is the description of code.
join_hints:
- to: other
  evidence: Code is cross-referenced from other tables.
  type: cross_reference
---
table: qa_us_insider.InsFData
domain: ownership
description: Insider Data Values | This table provides the data values for all Insider items.
update_cadence: Daily
columns:
- name: DCNCode
  type: INTEGER
  nullable: false
  description: DCNCode is the Document Control Number code. This is a LSEG generated code.
- name: SeqNum
  type: SMALLINT
  nullable: false
  description: SeqNum is an identifier for each of the individual transactions on a form, as a single filing may contain multiple
    transactions. You can use SeqNum in conjunction with the DCNCode to uniquely identify every record.
- name: Item
  type: SMALLINT
  nullable: false
  description: Item is the unique item number. Item cross-references with InsItem.
- name: FileCode
  type: SMALLINT
  nullable: false
  description: FileCode is a LSEG assigned number indicating the file type, such as, TableOne, TableTwo, Form144, and so on.
    Cross-reference FileCode with InsCode where FileCode = InsCode.Code and InsCode.Type_ = 14.
- name: SecurityID
  type: INTEGER
  nullable: true
  description: SecurityID is a LSEG internally assigned unique identifier for a security. This identifier enables you to link
    company data, regardless of changes in company name or ticker symbol.
- name: PersonID
  type: INTEGER
  nullable: true
  description: PersonID is a LSEG internally assigned unique identifier for an individual insider. This identifier ensures
    that an insider is not represented multiple times within his or her own company (for example as John Ronald Smith, John
    R. Smith, and so on). This unique identifier also enables you to accurately track an individual’s transactions over time.
- name: TransDate
  type: INTEGER
  nullable: true
  description: For Forms 3, 4, and 5, TransDate is either the date of the transaction or the date of the holdings report.
    For Form 144, this is the best estimate of the future sale date.
- name: AmendIndCode
  type: SMALLINT
  nullable: true
  description: AmendIndCode indicates whether a record represents an amendment made to an earlier filing. Amended filings
    are noted with an A. Otherwise, the field is blank.
- name: Value_
  type: FLOAT
  nullable: true
  description: Value_ is the item value.
- name: CreateDate
  type: INTEGER
  nullable: true
  description: CreateDate is the creation date of the record, in the format YYYYMMDD. LSEG Quantitative Analytics Database
    Schema for US Insider 8
join_hints:
- to: InsItem
  evidence: Item cross-references with InsItem.
  type: cross_reference
---
table: qa_us_insider.InsFDCNInfo
domain: ownership
description: Insiders Profile Identifier Changes | This table contains a history of identifier changes for the Insider profile,
  based on the document control number
update_cadence: Daily
columns:
- name: DCNCode
  type: INTEGER
  nullable: false
  description: DCNCode is the Document Control Number code. This is a LSEG generated code.
- name: DCN
  type: varchar(10)
  nullable: true
  description: DCN is the Document Control Number. This is a unique number assigned to each document that enables you to track
    the information back to the original source.
- name: SecurityID
  type: INTEGER
  nullable: true
  description: SecurityID is a LSEG internally assigned unique identifier for a security. This identifier enables you to link
    company data, regardless of changes in company name or ticker symbol.
- name: PersonID
  type: INTEGER
  nullable: true
  description: PersonID is a LSEG internally assigned unique identifier for an individual insider. This identifier ensures
    that an insider is not represented multiple times within his or her own company (for example as John Ronald Smith, John
    R. Smith, and so on). This unique identifier also enables you to accurately track an individual’s transactions over time.
- name: FileDate
  type: INTEGER
  nullable: true
  description: FileDate is the date the file was created, in the format YYYYMMDD.
- name: CreateDate
  type: INTEGER
  nullable: true
  description: CreateDate is the creation date of the record, in the format YYYYMMDD.
- name: FormType
  type: varchar(7)
  nullable: true
  description: FormType is the type of form the insider filed, with possible values of 3, 4, 5, or 144.
- name: FullName
  type: varchar(60)
  nullable: true
  description: FullName is the filing insider's complete name displayed as last name, first name, middle name, and suffix.
- name: StAddr1
  type: varchar(40)
  nullable: true
  description: StAddr1 is the insider's reported street address.
- name: StAddr2
  type: varchar(40)
  nullable: true
  description: StrAddr2 is the insider's reported suite or building number. A post office box number may also be included,
    if provided.
- name: City
  type: varchar(50)
  nullable: true
  description: City is the insider's reported city of residence.
- name: StateCode
  type: char(2)
  nullable: true
  description: StateCode is the two-character abbreviation for the insider's reported state of residence. This field applies
    only for domestic addresses. InsFDCNInfo.StateCode cross-references with InsCode.Code where Type_ = 7.
- name: PostalCode
  type: varchar(10)
  nullable: true
  description: PostalCode is the insider's reported US zip code or international postal code. CtryCode varchar(3) CtryCode
    identifies the insider's reported country of residence. InsFDCNInfo.CtryCode cross-references with InsCode.Code where
    Type_ = 8.
- name: Phone
  type: varchar(18)
  nullable: true
  description: Phone is the insider's phone number, if provided.
- name: RoleCode1
  type: char(3)
  nullable: true
  description: Role Codes 1-4 are the insider’s roles or positions within the company, as reported on the filing. InsFDCNInfo.RoleCode*
    cross-references with InsCode.Code where Type_ = 1. RoleCode2 char(3) Y RoleCode3 char(3) Y RoleCode4 char(3) Y
- name: SECReceiptDate
  type: INTEGER
  nullable: true
  description: SECReceiptDate is the date the filing was received by the Securities and Exchange Commission, in the format
    YYYYMMDD. This is the SEC Stamp Date.
- name: SigDate
  type: INTEGER
  nullable: true
  description: SigDate is the date that the filing was signed by the insider or by a person authorized to sign on behalf of
    the insider, in the format YYYYMMDD.
- name: LastMaintDate
  type: INTEGER
  nullable: true
  description: LastMaintDate is the last day that a record was modified, in the format YYYYMMDD. LSEG Quantitative Analytics
    Database Schema for US Insider 9

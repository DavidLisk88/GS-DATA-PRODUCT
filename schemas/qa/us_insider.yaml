table: qa_us_insider.InsFIndRet
domain: ownership
description: Insider Historical Transaction Returns | This table contains information on a stock’s historical performance
  following an insider's transactions. When
update_cadence: Daily
columns:
- name: PersonID
  type: INTEGER
  nullable: false
  description: PersonID is a LSEG internally assigned unique identifier that allows for consistent and accurate identification
    of individual insiders. This identifier ensures that an insider is not represented multiple times (for example, John Ronald
    Smith, John R. Smith, etc.) within his or her own company. This unique identifier also allows you to accurately track
    an individual’s transactions over time.
- name: SecurityID
  type: INTEGER
  nullable: false
  description: SecurityID is a LSEG internally assigned unique identifier for a security. This identifier enables you to link
    company data, regardless of changes in company name or ticker symbol.
- name: Avg3MthRtnBuys
  type: FLOAT
  nullable: true
  description: Avg3MthRtnBuys is the average three-month performance returns following a given insider’s purchase decisions.
- name: Avg3MthRtnSells
  type: FLOAT
  nullable: true
  description: Avg3MthRtnSells is the average three-month performance returns following a given insider’s sell decisions.
- name: Avg6MthRtnBuys
  type: FLOAT
  nullable: true
  description: Avg6MthRtnBuys is the average six-month performance returns following a given insider’s purchase decisions.
- name: Avg6MthRtnSells
  type: FLOAT
  nullable: true
  description: Avg6MthRtnSells is the average six-month performance returns following a given insider’s sell decisions.
- name: BuyCnt
  type: INTEGER
  nullable: true
  description: The number of historic buy decisions by the insider.
- name: SellCnt
  type: INTEGER
  nullable: true
  description: The number of historic sell decisions by the insider.

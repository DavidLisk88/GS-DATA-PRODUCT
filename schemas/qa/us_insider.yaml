table: qa_us_insider.InsInfo
domain: ownership
description: Security-level Identifying Information | This table contains security-level identifying information. | This table
  is shared between the US Insider Filing and US Insider Trading Data tables.
update_cadence: Daily
columns:
- name: SecurityID
  type: INTEGER
  nullable: false
  description: SecurityID is a LSEG internally assigned unique identifier for a security. This identifier enables you to link
    company data, regardless of changes in company name or ticker symbol.
- name: CmpNum
  type: varchar(10)
  nullable: true
  description: CmpNum is the internal company number.
- name: CmpName
  type: varchar(60)
  nullable: true
  description: CmpName is the name of the company or issuer at the time of the filing.
- name: Cusip
  type: varchar(8)
  nullable: true
  description: Cusip is the CUSIP number. It is a unique identifier for issuers and issues of securities and financial instruments.
    Issuer CUSIP refers to the company. Issue CUSIP refers to the security type, for example, common stock or preferred stock.
- name: CusipCheck
  type: char(1)
  nullable: true
  description: CusipCheck is the CUSIP check digit. This is the ninth digit of the CUSIP number and it provides a means of
    mathematically verifying the accuracy of the CUSIP issuer and issue numbers.
- name: Ticker
  type: varchar(6)
  nullable: true
  description: Ticker is the ticker symbol of the company with which the insider is affiliated at the time of the transaction.
    If the company is inactive at the time that the data is run, the ticker field is blank.
- name: SectIndCode
  type: varchar(4)
  nullable: true
  description: SectIndCode is the Sector/Industry code. This identifies the sector and industry in which the company primarily
    operates. Cross-reference SectIndCode with InsCode where SectIndCode = InsCode.Code and InsCode.Type_ = 6.
---

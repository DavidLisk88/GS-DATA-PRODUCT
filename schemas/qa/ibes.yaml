table: qa_ibes.IBESHist3
domain: estimates
description: I/B/E/S Security History | Use this table to retrieve CUSIP change chronology.
update_cadence: Monthly
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S North America tables. For information on the
    security, cross-reference Code with IBESInfo3.
- name: Date_
  type: smalldatetime
  nullable: false
  description: Date_ is the historical date.
- name: Cusip
  type: varchar(8)
  nullable: true
  description: Cusip is the CUSIP of the security.
- name: STicker
  type: varchar(8)
  nullable: true
  description: 'STicker is the security ticker. Note that tickers may change between I/B/E/S update cycles. For the current
    exchange ticker of a security, refer to these tables: • prc.PrcInfo (United States securities) • CPrcInfo (Canadian securities)
    • Gprcinfo2 (non-North American securities) See Also: Information on these tables is available in the IDC Pricing schemas
    available on the LSEG Quantitative Analytics product page at MyAccount. For more information, see I/B/E/S Schema Overview
    and Usage Notes on p'
- name: Name
  type: varchar(32)
  nullable: true
  description: Name is the name of the company that corresponds to the exchange ticker.
- name: Country
  type: varchar(2)
  nullable: true
  description: Country is the abbreviation for the company country of domicile.
- name: PD
  type: varchar(1)
  nullable: true
  description: PD indicates whether the value is primary (P) or diluted (D).
- name: CanCurr
  type: varchar(1)
  nullable: true
  description: 'CanCurr indicates whether the company is followed in Canadian dollars (C) or U.S. dollars [blank]. Note: This
    field is used differently in IBGSHist3.'
- name: OneTenth
  type: varchar(1)
  nullable: true
  description: OneTenth indicates whether the values for the company in the other Summary History files are one-tenth of the
    actual values.
- name: SecType
  type: varchar(1)
  nullable: true
  description: SecType is described in the section SecTypes on page 18.
- name: Sector
  type: INTEGER
  nullable: true
  description: This field is no longer updated by I/B/E/S and should not be used.
- name: Dilution
  type: FLOAT
  nullable: true
  description: Dilution is the dilution factor and represents a measure of the difference between basic and fully diluted
    earnings per share.
- name: ExchCtry
  type: varchar(2)
  nullable: true
  description: ExchCtry is the exchange country ID.
- name: Exchange
  type: varchar(6)
  nullable: true
  description: 'Exchange is the exchange ID. Database Schema for I/B/E/S 18 SecType indicates the security’s instrument type.
    SecType may be: Code Description A ADR Security B Fixed Income Research C Currency D Dual Listing E Economic Indicator
    F Foreign Listing G GDR Security I Index M Multi Share Issue O Commodity P Private S Security T TFR Type U Funds X Multi
    Share – Not In Mkt Cap'

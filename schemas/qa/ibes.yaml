table: qa_ibes.IBESPerCode
domain: estimates
description: 'I/B/E/S Period Code Descriptions | Use this table to retrieve descriptions of I/B/E/S period codes. | table
  and may be:'
update_cadence: N/A
columns:
- name: Flag
  type: char(1)
  nullable: false
  description: 'Flag indicates the data group of the cross-referencing table and may be: • Actuals tables (A) • Details tables
    (D) • Global aggregates (G) • QFS tables (Q) • Summary tables (S) • Surprise tables (U) See Also: Flag Code Cross-References
    on page 21.'
- name: PeriodType
  type: SMALLINT
  nullable: false
  description: PeriodType is the forecast period type. This field cross- references with the PeriodType field in the I/B/E/S
    QFS tables and the PerType field in the I/B/E/S History tables.
- name: Period
  type: SMALLINT
  nullable: false
  description: Period cross-references with Period fields in I/B/E/S QFS and History tables.
- name: ForecastCode
  type: varchar(4)
  nullable: true
  description: ForecastCode is the I/B/E/S Forecast Period Indicator as provided by I/B/E/S. ForecastCode cross-references
    with Forecast in I/B/E/S tables.
- name: ShortDesc
  type: varchar(7)
  nullable: true
  description: ShortDesc is the I/B/E/S abbreviation for Desc_.
- name: Desc_
  type: varchar(81)
  nullable: true
  description: 'Desc_ is the text description of PeriodType and Period. For example, a PeriodType of 1 and a Period of 1 is
    FY1, and a PeriodType of 2 and a Period of 1 is Q1. Note: When Period = 99, this indicates a QFS PeriodType. In this case,
    you should cross -reference Ibespercode.PeriodType with PeriodType in the I/B/E/S QFS tables. Database Schema for I/B/E/S
    21 Flag Code Cross-References IBESPerCode Flag codes may cross-reference with PerType/PeriodType, Period, or Forecast,
    or a combination of those fi'
join_hints:
- to: Period
  evidence: Period smallint N Period cross-references with Period fields in I/B/E/S QFS and History tables.
  type: cross_reference
- to: Forecast
  evidence: ForecastCode cross-references with Forecast in I/B/E/S tables.
  type: cross_reference

  type: FLOAT
  nullable: true
  description: PRC3MoCHG is the weighted three-month percent change in the price using a constant sample.
- name: PRC6MoCHG
  type: FLOAT
  nullable: true
  description: PRC6MoCHG is the weighted six-month percent change in the price using a constant sample.
- name: TwelveMTrMean
  type: FLOAT
  nullable: true
  description: 'TwelveMTrMean is the weighted average earnings per share, 12-months trailing. IGA*EstData: I/B/E/S Global

table: qa_ibes.IBESSurp
domain: estimates
description: I/B/E/S Surprise Data | Use this table to retrieve I/B/E/S surprise data. | Description United States Table Global
  Table
update_cadence: Monthly
columns:
- name: Code
  type: int(4)
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S North America tables. For information on the
    security, cross-reference Code with IBESInfo3.
- name: Measure
  type: SMALLINT
  nullable: false
  description: Measure is the I/B/E/S Measure code. Cross-reference Measure with IBESMsrCode where Measure = Ibesmsrcode.MeasureCode.
- name: PeriodType
  type: SMALLINT
  nullable: false
  description: 'PeriodType indicates the forecast period type. PeriodType cross-references with IBESPerCode where PeriodType
    = Ibespercode.PeriodType and Ibespercode.Flag = ‘U’. See Also: Flag Code Cross-References on page 21.'
- name: PeriodDate
  type: TIMESTAMP(6)
  nullable: false
  description: PeriodDate is the fiscal period end date.
- name: EntryDate
  type: TIMESTAMP(6)
  nullable: false
  description: EntryDate is the date that the data was recorded in the I/B/E/S database.
- name: PeriodMonth
  type: SMALLINT
  nullable: true
  description: PeriodMonth is the period month, or fiscal month, for which the measure/periodicity applies.
- name: PeriodYear
  type: SMALLINT
  nullable: true
  description: PeriodYear is the period year, or fiscal year, for which the measure/periodicity applies.
- name: ActualValue
  type: FLOAT
  nullable: true
  description: ActualValue is the actual earning per share value reported.
- name: SurpriseMean
  type: FLOAT
  nullable: true
  description: SurpriseMean represents the average of all current estimates recorded prior to the date/time the company reported
    the respective period’s actuals.
- name: SurpriseStdDev
  type: FLOAT
  nullable: true
  description: SurpriseStdDev is the surprise statistical measure of estimate dispersion.
- name: SueScore
  type: FLOAT
  nullable: true
  description: 'SueScore is the Standardized Unanticipated Earnings Score where SUE = (Actual EPS - SurpriseMean) / Standard
    Deviation. Database Schema for I/B/E/S 25 4. I/B/E/S Schema: Guidance Guidance provides a time series of guidance statements
    and the mean at the time of announcement. These tables are also part of the I/B/E/S Guidance license: Description United
    States Table Global Table Exchange Rates IBDfxr Split Adjustments IBQSpl IBGQSpl Split Adjustments IBESAdj IBGSAdj Company
    Info IBESInfo3 IBGSInf'
join_hints:
- to: IBESPerCode
  evidence: PeriodType cross-references with IBESPerCode where PeriodType = Ibespercode.PeriodType and Ibespercode.Flag =
    ‘U’.
  type: cross_reference

  description: 'Desc_ is the full name of Code. IB*QGuData: I/B/E/S Guidance Data These tables contain data definitions for
    Guidance items. This section describes both the global and the North American I/B/E/S Guidance data tables, which are:
    — IBQGuData: I/B/E/S North America Guidance Table and Data Element Dictionary — IBGQGuData: I/B/E/S Global Guidance Table
    and Data Element Dictionary Database Schema for I/B/E/S 26'

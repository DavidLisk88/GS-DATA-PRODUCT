table: qa_ibes.pkey_IbgqGuData
domain: estimates
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S tables. Cross-reference IbqGuData.Code with
    IBESInfo3 and IbgqGuData.Code with IBGSInfo3.
- name: PerType
  type: SMALLINT
  nullable: false
  description: 'PerType indicates the period type. PerType may be: • Annual (1) • Quarterly (2) • Semi-annual (3)'
- name: PerDate
  type: TIMESTAMP(6)
  nullable: false
  description: PerDate is the fiscal period end date.
- name: Measure
  type: SMALLINT
  nullable: false
  description: Measure is the I/B/E/S Measure code. Cross-reference Measure with IBESMsrCode where Measure = Ibesmsrcode.MeasureCode.
- name: ActivationDate
  type: TIMESTAMP(6)
  nullable: false
  description: ActivationDate is the date on which the data was recorded in the I/B/E/S database. In the case of error correction,
    the activation date may be earlier than the date the data was recorded.
- name: FY0EndMo
  type: SMALLINT
  nullable: true
  description: FY0EndMo is the fiscal year end month, indicated numerically where 12 = December, 11 = November, 10 = October,
    and so on.
- name: Value1
  type: FLOAT
  nullable: true
  description: 'Value1 is the Guidance value, or if there is a range of values, then Value1 is the beginning of the range
    of values with Value2 indicating the end of the range. See Also: Units and RangeCode, below.'
- name: Value2
  type: FLOAT
  nullable: true
  description: (See the definition for Value1, above).
- name: Currency_
  type: varchar(4)
  nullable: true
  description: Currency_ is the three digit currency code indicating the company-level currency.
- name: Units
  type: varchar(10)
  nullable: true
  description: Units defines how to interpret Value1 and Value2. Units may be P/S, % (percent), or millions.
- name: RangeCode
  type: SMALLINT
  nullable: true
  description: RangeCode indicates where the value or range provided by the company falls, for example more than, at least,
    and so on. Cross-reference RangeCode with IBESCode where RangeCode = IbesCode.Code and IbesCode.Type_ = 1.
- name: ActivationTime
  type: TIMESTAMP(6)
  nullable: false
  description: ActivationTime is the time the data is recorded in the I/B/E/S database.
- name: AnnDate
  type: TIMESTAMP(6)
  nullable: false
  description: AnnDate is the date the announcement was made.
- name: AnnTime
  type: TIMESTAMP(6)
  nullable: false
  description: AnnTime is the time the announcement was made. Database Schema for I/B/E/S 27
- name: DiffCode
  type: SMALLINT
  nullable: true
  description: DiffCode is the accounting difference code. This describes the accounting difference; for example the difference
    could be due to restructuring costs. Cross-reference DiffCode with IBESCode where DiffCode = IbesCode.Code and IbesCode.Type_
    = 3.
- name: AcctStdCode
  type: SMALLINT
  nullable: true
  description: AcctStdCode is the accounting standard code. This describes the accounting basis for the estimate mean. Cross-reference
    AcctStdCode with IBESCode where AcctStdCode = IbesCode.Code and IbesCode.Type_ = 4.
- name: MeanAtAnn
  type: FLOAT
  nullable: true
  description: MeanAtAnn is the mean at the time of the announcement (AnnDate and AnnTime).
- name: GuidanceCode
  type: SMALLINT
  nullable: true
  description: 'GuidanceCode is the derived LSEG value that represents whether the guidance is above, below, or in line with
    the estimates mean. Cross-reference GuidanceCode with IBESCode where GuidanceCode = IbesCode.Code and IbesCode.Type_ =
    2. IB*QGuExch: I/B/E/S Company Exchange Information These tables describe the company security exchange. This section
    describes both the global and the North American I/B/E/S Guidance exchange tables, which are: — IBQGuExch: North America
    Company Exchange Information — IB'
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S tables. Cross-reference IbqGuExch.Code with
    IBESInfo3 and IbgqGuExch.Code with IBGSInfo3.
- name: HomeMktTkr
  type: varchar(7)
  nullable: true
  description: HomeMktTkr is the local exchange ticker and market extension.
- name: ExchCountry
  type: varchar(3)
  nullable: true
  description: ExchCountry is the two letter country code for the exchange.
- name: ExchCode
  type: SMALLINT
  nullable: true
  description: ExchCode is the exchange code. Cross-reference ExchCode with IBESCode where ExchCode = IbesCode.Code and IbesCode.Type_
    = 5, and with IBESDesc where IbesCode.Desc_ = IbesDesc.Code. Database Schema for I/B/E/S 28

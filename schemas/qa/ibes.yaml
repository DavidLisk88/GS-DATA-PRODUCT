- name: Code
  type: INTEGER
  nullable: false
  description: Code is the index code and is the primary link across all IGA* tables. For information on the index, cross-reference
    this field with IGAInfo.Code.
- name: EstDate
  type: TIMESTAMP(6)
  nullable: false
  description: EstDate is the date the estimate was made. Database Schema for I/B/E/S 138
- name: Measure
  type: SMALLINT
  nullable: false

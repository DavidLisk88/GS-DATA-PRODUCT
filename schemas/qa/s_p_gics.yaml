  type: varchar(8)
  nullable: true
  description: Tpci is the security issue type. Tpci references Spgcode where Spgcode.Type_= 3 and Spgdsec.Tpci = Spgcode.Code.
- name: Exchg
  type: SMALLINT
  nullable: true
  description: Exchg is the security issue listing exchange. Exchg references Spgcode where Spgcode.Type_= 2 and Spgdsec.Exchg

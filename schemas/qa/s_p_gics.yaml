table: qa_gics.SPG2CmpInfo
domain: reference
description: S&P GICS Company Information | This table contains all company information, including active and inactive companies.
update_cadence: Daily
columns:
- name: GvKey
  type: INTEGER
  nullable: false
  description: GvKey is the S&P Global Vantage Key for the company. GvKey is also the primary link across SPG* tables.
- name: Name_
  type: varchar(255)
  nullable: true
  description: Name_ is the company name.
- name: IncISOCtryCode
  type: char(3)
  nullable: true
  description: IncISOCtryCode is the ISO country code of the country of incorporation.
- name: DomISOCtryCode
  type: char(3)
  nullable: true
  description: DomISOCtryCode is the ISO country code of the country of domicile.
- name: IsActive
  type: TINYINT
  nullable: true
  description: 'IsActive indicates if the company is currently active. It can be: – 0 = Inactive – 1 = Active'
---
table: qa_gics.SPG2Code
domain: reference
description: S&P GICS and Exchange Codes | This table contains GICS code values and the exchange code values and their descriptions.
update_cadence: Daily
columns:
- name: Type_
  type: TINYINT
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: INTEGER
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(240)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code.
---
table: qa_gics.SPG2Desc
domain: reference
description: S&P GICS Country and Issue Type Codes | This table contains country code values and issue type codes and their
  descriptions.
update_cadence: Daily
columns:
- name: Type_
  type: TINYINT
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: varchar(20)
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(240)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code. LSEG Quantitative Analytics
    S&P GICS 8

table: qa_esg.A4Item
domain: esg
description: 'Data Items | This table contains the data points that belong to all the files: Company Values, Company Controversies,
  | Company Negative Screening, Board Members, Non Board Members, and Industry Aggregates. This table | provides details for
  the type of value a particular item holds and the table where the value resides. | DataTypeCode tinyint Y DataTypeCode determines
  the table to which the item belongs. | TableCode tinyint Y TableCode is the data table in which the value pertaining to
  the item'
update_cadence: Once every two weeks for incremental files; once a year for history files.
columns:
- name: Item
  type: SMALLINT
  nullable: false
  description: Item is a unique code that identifies each data point in the feed.
- name: Mnemonic
  type: varchar(20)
  nullable: true
  description: Mnemonic is a short mnemonic code that describes the item.
- name: FileCode
  type: TINYINT
  nullable: true
  description: FileCode specifies the feed file to which the data point belongs. A4Item.FileCode cross-references with A4Code.Code
    where Type_ = 1.
- name: EnumValues
  type: varchar(120)
  nullable: true
  description: EnumValues represents all the possible values the indicator can have.
- name: Title
  type: varchar(100)
  nullable: true
  description: Title is the description pertaining to Item.
- name: DetailedDesc_
  type: varchar(1200)
  nullable: true
  description: DetailedDesc_ is the detailed description pertaining to Item.
- name: DataTypeCode
  type: TINYINT
  nullable: true
  description: DataTypeCode determines the table to which the item belongs. A4Item.DataTypeCode cross-references with A4Code.Code
    where Type_ = 3.
- name: VenDataTypeDesc
  type: varchar(70)
  nullable: true
  description: VenDataTypeDesc defines the data type and range for the values.
- name: TableCode
  type: TINYINT
  nullable: true
  description: TableCode is the data table in which the value pertaining to the item resides. A4Item.DataTypeCode cross-references
    with A4Code.Code where Type_ = 4.
- name: CatItem
  type: SMALLINT
  nullable: true
  description: CatItem is the code that indicates the data item's category. Descriptions for CatItem codes are contained in
    A4Item where Item = CatItem.
- name: PillarItem
  type: SMALLINT
  nullable: true
  description: PillarItem is the code that indicates the data item's pillar. Descriptions for PillarItem codes are contained
    in A4Item where Item = PillarItem.

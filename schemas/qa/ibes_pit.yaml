table: qa_ibes_pit.IBESPITAct
domain: estimates
description: This table contains actuals data.
update_cadence: Weekly
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S Point-In-Time.
- name: ActType
  type: TINYINT
  nullable: false
  description: ActType identifies if an actuals is Reported or Restated. Cross- reference IBESPITCode where CodeType = 5.
- name: Measure
  type: SMALLINT
  nullable: false
  description: The attribute or the financial statement item that the value is for. Cross-reference IBESPITCode where CodeType
    = 2.
- name: PerType
  type: TINYINT
  nullable: false
  description: PerType is the code for the Periodicity. Cross-reference IBESPITCode where CodeType = 1.
- name: PerEndDate
  type: date
  nullable: false
  description: PerEndDate is the day the period ends.
- name: ActivationDate
  type: TIMESTAMP(6)
  nullable: false
  description: ActivationDate is the time the record was added to the I/B/E/S database of record.
- name: PointDate
  type: date
  nullable: false
  description: PointDate is the point in time date of the record.
- name: Value
  type: FLOAT
  nullable: true
  description: Value is the amount.
- name: Currency
  type: varchar(3)
  nullable: true
  description: Currency is the currency the broker submitted the value in.
- name: AnnounceDate
  type: date
  nullable: true
  description: AnnounceDate is the date the record was announced by the source.
- name: AnnounceTime
  type: time
  nullable: true
  description: AnnounceTime is the time the record was announced by the source on the AnnounceDate.
- name: LicFlag
  type: TINYINT
  nullable: false
  description: LicFlag is the license flag.
---
table: qa_ibes_pit.IBESPITAncl
domain: estimates
description: This table contains ancillary company data.
update_cadence: Weekly
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S Point-In-Time.
- name: PointDate
  type: date
  nullable: false
  description: PointDate is the point in time date of the record.
- name: Shares
  type: FLOAT
  nullable: true
  description: Shares are the shares outstanding for the ticker.
- name: ActEPS4QTR
  type: FLOAT
  nullable: true
  description: ACTEPS4QTR is the sum of the last 4 quarterly EPS actual values.
- name: Stability
  type: FLOAT
  nullable: true
  description: Five-year earnings per share stability measures the consistency of earnings per share growth over the past
    five years. The lower the number, the more uniform growth has been. Combined with earnings growth data, the stability
    figure provides a multi- dimensional view of earnings growth over the past five years. Earnings stability is calculated
    as the mean absolute percentage LSEG Quantitative Analytics I/B/E/S PIT 7
- name: Growth
  type: FLOAT
  nullable: true
  description: The average annualized earnings per share growth for a company over the past five years. The average annualized
    growth in EPS for the past five years is calculated by measuring the slope of a least squares curve fit to the logarithm
    of the reported earnings (a log- linear curve) and is expressed as a percent. If quarterly data are available, the line
    is fit to the last 21 observations (minimum of 11 observations) of rolling four quarter EPS. The resultant slope is multiplied
    by four and exponent
- name: Dividend
  type: FLOAT
  nullable: true
  description: Dividend is the indicated annual dividend.
- name: DivExDt
  type: date
  nullable: true
  description: DivExDt is the Dividend ExDate for the last period included in the Dividend.
- name: CumSplitFactor
  type: FLOAT
  nullable: true
  description: CumSplitFactor is the cumulative split factor.
- name: LicFlag
  type: TINYINT
  nullable: false
  description: LicFlag is the license flag.
---

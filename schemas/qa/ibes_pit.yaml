- name: Code
  type: INTEGER
  nullable: false
  description: Code is the security code and is the primary link across I/B/E/S Point-In-Time.
- name: PointDate
  type: date
  nullable: false
  description: PointDate is the point in time date of the record.
- name: Mean
  type: FLOAT
  nullable: true
  description: Mean is the average of the values.
- name: RecCount
  type: TINYINT
  nullable: true
  description: RecCount is the number of rec estimates included in the mean.
- name: Up4Wk
  type: TINYINT
  nullable: true
  description: Up4Wk is the number of brokers who have raised their estimate in the last 4 weeks.
- name: Down4Wk
  type: TINYINT
  nullable: true
  description: Down4Wk is the number of brokers who have lowered their estimate in the last 4 weeks.

table: qa_short_int.ShortInt2Code
domain: short_interest
description: Numeric Codes | This table contains descriptions of numeric codes.
update_cadence: Once monthly on approximately the 20th day of each month.
columns:
- name: Type_
  type: INTEGER
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: INTEGER
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(50)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code.
---
table: qa_short_int.ShortInt2Data
domain: short_interest
description: Monthly Short Interest Data | Use this table to retrieve Short Interest data from the NYSE, NASDAQ, AMEX, ARCA,
  and/or OTC.
update_cadence: Twice a month.
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the equity identifier provided by the vendor. ShortInt2Data.Code joins directly to SecMstrX.SecCode.
- name: Exch
  type: INTEGER
  nullable: false
  description: 'Exch indicates the exchange and may be: NYSE (1), NASDAQ (2), AMEX (3), ARCA (4), or OTC (5).'
- name: Date_
  type: smalldatetime
  nullable: false
  description: Date_ is the settlement date.
- name: Shares
  type: FLOAT
  nullable: true
  description: Shares is the monthly short interest.
- name: Volume
  type: FLOAT
  nullable: true
  description: Volume is the number of shares traded on the specified date, or within the specified period.
- name: Ticker
  type: varchar(9)
  nullable: true
  description: Ticker represents BaseTicker + Group_ + Series, concatenated (blank spaces removed).
- name: LicFlag
  type: SMALLINT
  nullable: false
  description: 'LicFlag is the license flag that identifies to which entitlement package each data row belongs. LicFlag may
    be: NYSE (1), NASDAQ (2), AMEX (4), ARCA (8), or OTC (16). LSEG Quantitative Analytics Database Schema for Short Interest
    7'
---

table: qa_eu_taxonomy.EUTObjClassDet
domain: esg
description: This table has each organization's reported data tested against the EU Taxonomy technical screening criteria,
update_cadence: Monthly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Unique system generated Permanent Identifier (Perm ID) for an organisation (also known as Organisation Perm
    ID).
- name: FY
  type: INTEGER
  nullable: false
  description: A reporting period, fiscal year of the organization.
- name: IsRepOrDer
  type: boolean
  nullable: false
  description: A reporting style (As Reported or Derived).
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each EU Taxonomy objective classification metric.
- name: ObjTypeCode
  type: INTEGER
  nullable: false
  description: 'This code comprises of six environmental objectives as defined in EU taxonomy: 1) Climate change mitigation
    2) Climate change adaptation 3) The sustainable use and protection of water and marine resources 4) The transition to
    a circular economy 5) Pollution prevention and control 6) The protection and restoration of biodiversity and ecosystems"'
- name: SegCode
  type: INTEGER
  nullable: false
  description: 'Business segments that are classified according to GRCS (Green Revenue Classification System) and TRBC (The
    Refinitiv Business Classification). Refer to the links below for more information on GRCS and TRBC: LSEG Quantitative
    Analytics Database Schema for EU Taxonomy 8'
- name: DNSHPassFlg
  type: char(1)
  nullable: true
  description: Flag indicating whether every DNSH criteria tested for the given objective was passed.
- name: FndRevBDId
  type: varchar(100)
  nullable: true
  description: Reported revenues from financial statement line items, broken down by the specified ranking and weight, at
    the segment level.
- name: GeRevBDId
  type: varchar(100)
  nullable: true
  description: Reported amounts sourced from the Green Revenue system by company and financial period.
- name: ObjClassID
  type: varchar(100)
  nullable: true
  description: An identifier used to classify the six environmental objectives.
- name: ResultFlg
  type: char(1)
  nullable: true
  description: Flag indicating whether every DNSH and substantial contribution criteria tested for the given objective was
    passed.
- name: SrcSegID
  type: varchar(50)
  nullable: true
  description: System utilized identifier to allow simpler joining back to the source of the data, either Green Revenue or
    Fundamentals.
- name: SubsContPassFlg
  type: char(1)
  nullable: true
  description: Flag indicating whether every Substantial Contribution that the Activity was tested against passed.
- name: TotalActCrtCount
  type: INTEGER
  nullable: true
  description: Summarization of the number of Technical Screening Criteria tested against.
- name: Comment
  type: varchar(2000)
  nullable: true
  description: Reason for failed activity classification test.
- name: Value_
  type: FLOAT
  nullable: true
  description: Value corresponding to the Item.

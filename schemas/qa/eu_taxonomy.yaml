  type: char(1)
  nullable: true
  description: 'Describes the type of Technical Screening Criteria. Available values are: Substantial Contribution, DNSH (Do
    No Significant Harm), Minimum Social Safeguard.'
- name: TSCTypeCode
  type: varchar(20)
  nullable: true
  description: 'Measuring unit used in the Technical Screening Criteria. Examples: tCO2e per ton3tCO2e/tH2'
- name: TSCUnitMsrCode
  type: varchar(200)
  nullable: true
  description: 'Text specifying the arithmetic operator to compare ESG measure against the threshold. For example: equals
    to, greater than, or lesser than etc.'
- name: ThCmpOpText
  type: varchar(2000)
  nullable: true
  description: In substantial contributions, if the criteria is quantitative, the value being tested against is stored.
- name: ThValue
  type: FLOAT
  nullable: true
  description: Environmental, social and governance measures that are used for Technical screening criteria testing.

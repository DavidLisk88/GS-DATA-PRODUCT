  type: char(1)
  nullable: true
  description: Technical screening criteria passed flag.
- name: TSCID
  type: varchar(50)
  nullable: true
  description: Technical Screening Criteria specifies, for a given activity, thresholds which must be met based on certain
    measures reported. Technical Screening Criteria can be either Substantial Contribution, Do No Significant Harm Criteria,
    or Minimum Social Safeguard.
- name: CrtDesc
  type: varchar(1000)
  nullable: true
  description: In the cases where the Technical Screening Criteria(TSC) is a Substantial Contribution type, specifies whether
    it is a quantitative TSC.

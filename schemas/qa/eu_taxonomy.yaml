update_cadence: Monthly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Unique system generated Permanent Identifier (Perm ID) for an organisation (also known as Organisation Perm
    ID).
- name: FY
  type: INTEGER
  nullable: false
  description: A reporting period, fiscal year of the organization.
- name: IsRepOrDer
  type: boolean
  nullable: false
  description: A reporting style (As Reported or Derived).
- name: EUTActID
  type: INTEGER
  nullable: false
  description: Identifier of sustainable activities which meet the specifications set out by the European Commission, in order
    to provide companies with a standardized sustainable finance reporting mechanism.
- name: EUTActTSCID
  type: INTEGER
  nullable: false
  description: Object ID in Technical Screening to uniquely identify a technical screening criteria.
- name: SrcSegID
  type: SMALLINT
  nullable: false
  description: System utilized identifier to allow simpler joining back to the source of the data, either Green Revenue or
    Fundamentals.

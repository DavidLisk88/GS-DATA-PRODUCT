table: qa_esg_v2.ESGOrgIndCls
domain: esg
description: Organization Industry Classifications | This table contains organization industry classification information.
update_cadence: Weekly
columns:
- name: OrgPermId
  type: BIGINT
  nullable: false
  description: LSEG Organization Identifier.
- name: SICCode
  type: varchar(10)
  nullable: true
  description: The highest ranked/primary Standard Industrial Classification (SIC) code and related description for the company.
    Corresponding code is in the ESGDesc table. Cross-reference SICCode with ESGDesc.Code where Type_ = 2.
- name: NAICSCode
  type: varchar(10)
  nullable: true
  description: The highest ranked/primary North American Industry Classification System (NAICS) code and description for the
    company. Corresponding code description is in the ESGDesc table. Cross-reference NAICSCode with ESGDesc.Code where Type_
    = 1.
---
table: qa_esg_v2.ESGItem
domain: esg
description: Data Items | An itemized table for all the ESG metrics. This table stores the metadata of all ESG metrics and
  the table where | TableCode tinyint Yes The data table in which the value pertaining to the item resides.
update_cadence: Weekly
columns:
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each and every data point that is a part of the feed. Corresponding code
    description is in the ESGItem table. Cross- reference Item with ESGItem.Item.
- name: FeedFieldName
  type: varchar(100)
  nullable: true
  description: Internal LSEG source feed field name.
- name: Title
  type: varchar(100)
  nullable: true
  description: Description pertaining to the item.
- name: Description
  type: varchar(1000)
  nullable: true
  description: Detailed description pertaining to the item.
- name: DataTypeCode
  type: TINYINT
  nullable: true
  description: The data type the item is part of. Corresponding type code is in the ESGCode table. Cross-reference DataTypeCode
    with ESGCode.Code where Type_ = 2.
- name: FileCode
  type: TINYINT
  nullable: true
  description: This code specifies which feed file the datapoint belongs to. Corresponding type code is in the ESGCode table.
    Cross-reference FileCode with ESGCode.Code where Type_ = 1.
- name: TableCode
  type: TINYINT
  nullable: true
  description: The data table in which the value pertaining to the item resides. Corresponding type code is in the ESGCode
    table. Cross-reference TableCode with ESGCode.Code where Type_ = 3.
- name: HeirarchyCode
  type: TINYINT
  nullable: true
  description: 'This code identifies the hierarchy of the ESG data metric. Corresponding type code is in the ESGCode table.
    HeirarchyCode can take one of the following values: – 1: Data Point LSEG Quantitative Analytics ESG Version 2 8'
- name: Units
  type: varchar(100)
  nullable: true
  description: This indicates the unit of the data metric value.
- name: Polarity
  type: varchar(30)
  nullable: true
  description: This indicates whether a higher data measure value is positive or negative.
- name: IncludedInScores
  type: Varchar(50)
  nullable: true
  description: This defines the specific score(s) which the data measure is associated with.
- name: PillarItem
  type: SMALLINT
  nullable: true
  description: The code here defines the specific pillar which the datapoint is associated with. Cross-reference PillarItem
    with ESGCode.Code where Type_ = 5.
- name: CatItem
  type: SMALLINT
  nullable: true
  description: The code here defines the specific category which the datapoint is associated with. Corresponding category
    references back to the ESGItem table. Cross-reference CatItem with ESGItem.Item.
- name: RegLicFlag
  type: TINYINT
  nullable: true
  description: 'LicFlag value associated with a particular EU regulation. Corresponding type code is in the ESGCode table.
    RegLicFlag can take one of the following values: – 1: BMR – 2: SFDR – 3: Both BMR & SFDR Cross-reference RegLicFlag with
    ESGCode.Code where Type_ = 6. To translate ESGCode.Desc_, cross-reference ESGCode.Desc_ with ESGDesc.Code where ESGDesc.Type_
    = 7.'
- name: ValueScoreExists
  type: char(1)
  nullable: true
  description: 'This flag shows if normalized score is generated for the ESG data point. ValueScoreExists can take one of
    the following values: “Y” or “N”.'
- name: AsRepExists
  type: char(1)
  nullable: true
  description: 'This flag shows if as reported data is available for the ESG data point. AsRepExists can take one of the following
    values: “Y” or “N”.'
- name: SourceExists
  type: char(1)
  nullable: true
  description: 'This flag shows if source document(s) are available for the ESG data point. SourceExists can take one of the
    following values: “Y” or “N”.'
join_hints:
- to: ESGCode
  evidence: 'RegLicFlag can take one of the following values: – 1: BMR – 2: SFDR – 3: Both BMR & SFDR Cross-reference RegLicFlag
    with ESGCode.Code where Type_ = 6.'
  type: cross_reference
---

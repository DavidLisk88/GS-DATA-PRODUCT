- name: Value_
  type: varchar(500)
  nullable: true
  description: The value of the ESG metric being tracked.
- name: ValueScore
  type: FLOAT
  nullable: true
  description: ValueScore is a normalized score generated for each of the values. ValueScore is only delivered for the data
    measures that contribute towards the calculation of the ESG Score.

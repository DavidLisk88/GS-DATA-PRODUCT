- name: OrgPermId
  type: BIGINT
  nullable: false
  description: LSEG Organization Identifier.
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each and every data point that is a part of the feed. Corresponding code
    description is in the ESGItem table. Cross-reference Item with ESGItem.Item.
- name: FY
  type: SMALLINT
  nullable: false
  description: The particular fiscal year for which the data is defined.
- name: ValueRecDt
  type: TIMESTAMP(6)
  nullable: true
  description: The date when the ESG value was entered into the ESG data management system.
- name: ISOCurrCode
  type: char(3)
  nullable: true
  description: 3 character ISO currency code for the ESG value, where applicable. Corresponding code description is in the

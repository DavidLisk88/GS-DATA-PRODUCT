table: qa_esg_v2.ESGSourceData
domain: esg
description: Source Information | This table contains the source information.
update_cadence: Weekly
columns:
- name: SourceID
  type: BIGINT
  nullable: false
  description: The unique SourceId.
- name: Author
  type: nvarchar(250)
  nullable: true
  description: The author of the news article where the ESG value was detected.
- name: Date_
  type: TIMESTAMP(6)
  nullable: true
  description: The date of the source where the ESG value was detected.
- name: Page
  type: nvarchar(25)
  nullable: true
  description: The page number or a range of pages in the source where the ESG value was detected.
- name: Publisher
  type: nvarchar(140)
  nullable: true
  description: The publisher of the source where the ESG value was detected.
- name: Scope
  type: char(3)
  nullable: true
  description: 'The coverage scope in the source where the ESG value was detected. Scope can take one of the following values:
    – GBL: Global – REG: Regional – SEG: Segment'
- name: URL
  type: nvarchar(2500)
  nullable: true
  description: The external URL of the source used to collect the ESG value.
- name: TitleLangCode
  type: varchar(35)
  nullable: true
  description: BCP-47 language code used for the ESG source title. Corresponding code description is in the ESGDesc table.
    Cross- reference LangCode with ESGDesc.Code where Type_ = 4.
- name: CommentLangCode
  type: varchar(35)
  nullable: true
  description: BCP-47 language code used for the ESG source comment. Corresponding code description is in the ESGDesc table.
    Cross- reference LangCode with ESGDesc.Code where Type_ = 4.
- name: AbstractLangCode
  type: varchar(35)
  nullable: true
  description: BCP-47 language code used for the ESG source abstract. Corresponding code description is in the ESGDesc table.
    Cross- reference LangCode with ESGDesc.Code where Type_ = 4.
- name: Title
  type: nvarchar(250)
  nullable: true
  description: The source title from which the ESG value was collected.
- name: Comment
  type: nvarchar(max)
  nullable: true
  description: The comment written by the analyst who collected the ESG value.
- name: Abstract
  type: nvarchar(max)
  nullable: true
  description: The abstract from the source where the ESG value was detected.
---
table: qa_esg_v2.ESGScores
domain: esg
description: ESG Category, Pillar, and Summary Scores | This table contains the ESG category scores, pillar scores, and summary
  scores.
update_cadence: Weekly
columns:
- name: OrgPermId
  type: BIGINT
  nullable: false
  description: LSEG Organization Identifier. LSEG Quantitative Analytics ESG Version 2 14
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each and every data point that is a part of the feed. Corresponding code
    description is in the ESGItem table. Cross-reference Item with ESGItem.Item.
- name: FY
  type: SMALLINT
  nullable: false
  description: The particular fiscal year for which the data is defined.
- name: ValueCalcDt
  type: TIMESTAMP(6)
  nullable: true
  description: The date when the ESG value was calculated.
- name: Value_
  type: FLOAT
  nullable: true
  description: The raw ESG score value between 0 to 1.
- name: ValueGrade
  type: varchar(5)
  nullable: true
  description: The ESG score converted into a grade. Score Range Grade 0.0 <= score <= 0.083333 D - 0.083333 < score <= 0.166666
    D 0.166666 < score <= 0.250000 D+ 0.250000 < score <= 0.333333 C - 0.333333 < score <= 0.416666 C 0.416666 < score <=
    0.500000 C + 0.500000 < score <= 0.583333 B - 0.583333 < score <= 0.666666 B 0.666666 < score <= 0.750000 B + 0.750000
    < score <= 0.833333 A - 0.833333 < score <= 0.916666 A 0.916666 < score <= 1 A +
---

table: qa_esg_v2.ESGStmtDet
domain: esg
description: Financial Period | This table contains financial period details.
update_cadence: Weekly
columns:
- name: OrgPermId
  type: BIGINT
  nullable: false
  description: LSEG Organization Identifier.
- name: FY
  type: SMALLINT
  nullable: false
  description: The particular fiscal year for which the data is defined.
- name: PerEndDt
  type: TIMESTAMP(6)
  nullable: true
  description: The period end date of the ESG report.
- name: PerIsIncomplete
  type: char(1)
  nullable: true
  description: 'PerIsIncomplete can take one of the following values: “Y” or “N”. If the value is “Y” - not all ESG information
    has been collected for the whole financial period. LSEG publish ESG collected data as soon as it is published. Once all
    data has been collected for a period, this field will be marked as “N”.'

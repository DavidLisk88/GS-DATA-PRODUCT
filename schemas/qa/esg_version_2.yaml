  type: char(3)
  nullable: true
  description: ESG indicates a full coverage company. ATD indicates an organization for which there is a limited population
    of shareholders datapoints. Corresponding code description in the ESGDesc table. Cross-reference CoverageFlg with ESGDesc.Code

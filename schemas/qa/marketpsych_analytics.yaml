  type: FLOAT
  nullable: true
  description: 'Overall Positive References, Net Of Negative References (Range: - 1 to 1).'
- name: Optimism
  type: FLOAT
  nullable: true
  description: 'Optimism, Net Of References To Pessimism (Range: -1 to 1).'
- name: Joy
  type: FLOAT
  nullable: true
  description: 'Happiness And Affection (Range: 0 to 1*).'
- name: LoveHate
  type: FLOAT
  nullable: true
  description: 'Love, Net Of References To Hate (Range: -1 to 1).'

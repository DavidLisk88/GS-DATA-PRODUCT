table: qa_mktpsych.MPICmpInfo
domain: sentiment
description: This table contains company level information.
update_cadence: 'Daily Adjusted: N/A'
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Organizational PermID.
- name: OrgName
  type: varchar(100)
  nullable: true
  description: Company Name.
- name: DomISOCntryCode
  type: char(2)
  nullable: true
  description: Two-character ISO 3166-1 country code. Corresponding code description is in the MPIDesc table. Cross-reference
    DomISOCntryCode with MPIDesc.Code where Type_ = 3.
- name: TRBCEcoSector
  type: varchar(50)
  nullable: true
  description: The Reference Business Classification (TRBC) economic sector.
- name: TrackingStatus
  type: varchar(10)
  nullable: true
  description: “Active” if the PermID may be scored in a live feed, otherwise “Inactive”.
- name: RIC
  type: varchar(40)
  nullable: true
  description: Main RIC for the company.
- name: Ticker
  type: varchar(15)
  nullable: true
  description: Ticker for the company. Private companies shall have a MarketPsych-designated ticker beginning with “PVT-".
- name: MIC
  type: varchar(5)
  nullable: true
  description: ISO 10383 code for market or exchange identification. Value may differ from similar value maintained by London
    Stock Exchange.
- name: RegionCode
  type: TINYINT
  nullable: true
  description: 'Indicates the Company Domiciled Region. Corresponding type code in the MPICode table. Company Region can take
    one of the following values: – 1: AMER – 2: APAC – 3: EMEA Cross-reference RegionCode with MPIDesc.Code where Type_ =
    2.'
- name: AltOrgPermID
  type: bignint
  nullable: true
  description: AltOrgPermID is the new PermID assigned to the company after certain corporate events. This can be used for
    cross content reference.
---
table: qa_mktpsych.MPICmpGrpInfo
domain: sentiment
description: This table contains company groups' assets information.
update_cadence: 'Daily Adjusted: N/A'
columns:
- name: AstId
  type: INTEGER
  nullable: false
  description: DIS Generated Asset ID.
- name: AstCode
  type: varchar(20)
  nullable: true
  description: Represents the code used to denote the asset scored. MarketPsych-originated code.
- name: AstDesc
  type: varchar(200)
  nullable: true
  description: Description of the Asset.
- name: AstDomCls
  type: varchar(15)
  nullable: true
  description: Asset Domicile Classification.
- name: AstCat
  type: varchar(35)
  nullable: true
  description: Asset Categorization. LSEG Quantitative Analytics MarketPsych Analytics 9
---
table: qa_mktpsych.MPICurInfo
domain: sentiment
description: This table contains currencies' assets information.
update_cadence: Daily
columns:
- name: AstId
  type: INTEGER
  nullable: false
  description: DIS Generated Asset ID.
- name: AstCode
  type: char(3)
  nullable: true
  description: Represents the code used to denote the asset scored. Three- character ISO-4217 code.
- name: AstDesc
  type: nvarchar(50)
  nullable: true
  description: Description of the Asset
---
table: qa_mktpsych.MPICmdtyInfo
domain: sentiment
description: This table contains commodities' (agricultural and energy and material) assets information.
update_cadence: Daily
columns:
- name: AstId
  type: INTEGER
  nullable: false
  description: DIS Generated Asset ID.
- name: AstCode
  type: varchar(10)
  nullable: true
  description: Represents the code used to denote the asset scored. LSEG Topic Code.
- name: AstDesc
  type: varchar(30)
  nullable: true
  description: Description of the Asset.
- name: CmdtyType
  type: char(3)
  nullable: true
  description: 'Indicates the Commodity Type. Corresponding code description is in the MPIDesc table. Commodity Type can take
    one of the following values: – 1: AGR - Agricultural commodities – 2: EGR - Energy & material commodities Cross-reference
    CmdtyType with MPIDesc.Code where Type_ = 5.'
---
table: qa_mktpsych.MPICntryInfo
domain: sentiment
description: This table contains countries' assets information.
update_cadence: Daily
columns:
- name: AstId
  type: INTEGER
  nullable: false
  description: DIS Generated Asset ID
- name: AstCode
  type: varchar(3)
  nullable: true
  description: Represents the code used to denote the asset scored. LSEG topic code, referring to the home country. Also corresponds
    to ISO 3166- 1 code.
- name: AstDesc
  type: nvarchar(50)
  nullable: true
  description: Description of the Asset LSEG Quantitative Analytics MarketPsych Analytics 10
---

table: qa_mktpsych.MPICmpStatus
domain: sentiment
description: This table contains the changes to company tracking status.
update_cadence: Monthly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: LSEG organizational PermID.
- name: Date_
  type: TIMESTAMP(6)
  nullable: false
  description: Change Date.
- name: OrgName
  type: varchar(100)
  nullable: true
  description: Company Name.
- name: TrackingStatus
  type: varchar(10)
  nullable: true
  description: “Active” if the PermID may be scored in a live feed. Otherwise “Inactive”.

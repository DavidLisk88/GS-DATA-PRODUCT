  description: 'Trustworthiness, Net Of References Connoting Corruption (Range: -1 to 1).'
- name: Anger
  type: FLOAT
  nullable: true
  description: 'Anger And Disgust (Range: 0 to 1*).'
- name: Conflict
  type: FLOAT
  nullable: true
  description: 'Disagreement And Swearing Net Of Agreement And Conciliation (Range: -1 to 1)'
- name: Fear
  type: FLOAT
  nullable: true
  description: 'Fear And Anxiety (Range: 0 to 1*).'
- name: Gloom
  type: FLOAT
  nullable: true
  description: 'Gloom And Negative Future Outlook (Range: 0 to 1*).'
- name: Stress
  type: FLOAT
  nullable: true
  description: 'Arousal And Intensity, Weighted Towards Distress (Range: 0 to 1*).'
- name: Surprise
  type: FLOAT
  nullable: true
  description: 'Unexpected Events And Surprise (Range: 0 to 1*).'
- name: TimeUrgency
  type: FLOAT
  nullable: true
  description: 'Urgency And Timeliness, Net Of References To Tardiness And Delays (Range: -1 to 1).'
- name: Uncertainty
  type: FLOAT
  nullable: true
  description: 'Uncertainty And Confusion (Range: 0 to 1*).'
- name: Violence
  type: FLOAT
  nullable: true
  description: 'Violent Crime, Terrorism, And War (Range: 0 to 1*).'
- name: EmotionVsFact
  type: FLOAT
  nullable: true
  description: 'All Emotional Sentiments, Net Of All Factual And Topical References (Range: -1 to 1).'

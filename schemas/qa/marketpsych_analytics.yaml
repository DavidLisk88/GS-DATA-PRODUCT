  type: FLOAT
  nullable: true
  description: 'Positive Emotionality And Positive Expectations Net Of Negative Emotionality And Negative Expectations. Includes
    Factors From Social Media Found Characteristic Of Speculative Bubbles – Higher Values Indicate Greater Bubble Risk. Also
    Known As The “Bubbleometer.” (Range: -1 to 1).'
- name: LongShort
  type: FLOAT
  nullable: true
  description: 'Buying, Net Of References To Shorting Or Selling (Range: -1 to 1).'
- name: LongShortForecast
  type: FLOAT
  nullable: true
  description: 'Forecasts Of Buying, Net Of References To Forecasts Of Shorting Or Selling (Range: -1 to 1).'
- name: PrcDirection
  type: FLOAT
  nullable: true
  description: 'Price Increases, Net Of References To Price Decreases (Range: -1 to 1).'
- name: PrcForecast
  type: FLOAT
  nullable: true
  description: 'Forecasts Of Asset Price Rises, Net Of References To Forecasts Of Asset Price Drops (Range: -1 to 1).'
- name: Volatility
  type: FLOAT
  nullable: true
  description: 'Volatility In Market Prices Or Business Conditions (Range: 0 to 1*).'
- name: AnalystRating
  type: FLOAT
  nullable: true
  description: 'Upgrade Activity, Net Of References To Downgrade Activity (Range: -1 to 1).'
- name: CyberCrime
  type: FLOAT
  nullable: true
  description: 'Cyber Attacks And Data Breaches (Range: 0 to 1*).'
- name: DebtDefault
  type: FLOAT
  nullable: true
  description: 'Debt Defaults And Bankruptcies (Range: 0 to 1*).'
- name: Dividends
  type: FLOAT
  nullable: true
  description: 'Dividends Rising, Net Of References To Dividends Falling (Range: - 1 to 1).'
- name: Innovation
  type: FLOAT
  nullable: true
  description: 'Innovativeness (Range: 0 to 1*).'
- name: EarningsForecast
  type: FLOAT
  nullable: true
  description: 'Expectations About Improving Earnings, Less Those Of Worsening Earnings (Range: -1 to 1).'
- name: FndStrength
  type: FLOAT
  nullable: true
  description: 'Positivity About Accounting Fundamentals, Net Of References To Negativity About Accounting Fundamentals (Range:
    -1 to 1).'
- name: LaborDispute
  type: FLOAT
  nullable: true
  description: 'Labor Unrest And Work Stoppages (Range: 0 to 1*).'
- name: Layoffs
  type: FLOAT
  nullable: true
  description: 'Staff Reductions And Layoffs (Range: 0 to 1*).'
- name: Litigation
  type: FLOAT
  nullable: true
  description: 'Litigation And Legal Activity (Range: 0 to 1*).'
- name: MgmtChange
  type: FLOAT
  nullable: true
  description: 'Changes In A Company''S Management Team, Net Of References To Stability In The Management Team (Range: -1
    to 1). LSEG Quantitative Analytics MarketPsych Analytics 12'
- name: MgmtTrust
  type: FLOAT
  nullable: true
  description: 'Trust Expressed In A Company''S Management Team, Net Of References To Reports Of Unethical Behavior Amongst
    The Management Team (Range: -1 to 1).'
- name: Mergers
  type: FLOAT
  nullable: true
  description: 'Merger Or Acquisition Activity (Range: 0 to 1*).'
- name: SysVer
  type: INTEGER
  nullable: true
  description: System Version For Marketpysch Analytics. It’s Used For Version Control. *Unipolar indices – can range below
    0, although not below -1.
join_hints:
- to: MPICode
  evidence: 'DataType can take one of the following values: – “News” for news – “Social” for social media – “News_Social”
    for the combined content Cross-reference DataType with MPICode.Code where Type_ = 2.'
  type: cross_reference

table: qa_idc_na.CCFactor
domain: pricing
description: 'CCFactor real Y CCFactor is the currency conversion factor. Prices provided in this table are in | This table
  has been discontinued. It is documented for your convenience, but using the data in this table is not | This table contains
  earnings per share data. Use the information in this table to determine historical earnings per | This table contains pricing
  for the primary exchange of a given security. All data fields are stored in local currency. | Use this table to locate the
  primary exchange '
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all CPrc* tables.
- name: Date_
  type: smalldatetime
  nullable: false
  description: Date_ is the date for which the pricing applies.
- name: Open_
  type: FLOAT
  nullable: true
  description: Open_ is the first price at which a security traded on a given date.
- name: High
  type: FLOAT
  nullable: true
  description: High is the highest price at which a security traded on a given date.
- name: Low
  type: FLOAT
  nullable: true
  description: Low is the lowest price at which a security traded on a given date.
- name: Close_
  type: FLOAT
  nullable: true
  description: Close_ is the price at the close of the market. For stocks that do not trade on a given trading day, Close_
    is an average of Bid and Ask.
- name: Volume
  type: FLOAT
  nullable: true
  description: Volume is the number of shares traded on the specified date, or within the specified period.
- name: TotRet
  type: FLOAT
  nullable: true
  description: TotRet is the gross total return as a percent of the first close price. It is an index starting at 100 from
    the IPO date or, if the company history extends beyond the date the data has been stored, it is 100 from the point at
    which the data starts in the TRQA database (January 2, 1975). TotalRet takes into account price movement, dividends, spin-offs,
    and takeovers.
- name: CCFactor
  type: FLOAT
  nullable: true
  description: CCFactor is the currency conversion factor. Prices provided in this table are in CAD and to convert them to
    USD, multiply by the CCFactor.
- name: Flags

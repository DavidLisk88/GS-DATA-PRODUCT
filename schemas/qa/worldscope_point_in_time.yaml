table: qa_wscope_pit.WSPITCalPrd
domain: fundamentals
description: Worldscope PIT Calendar Information | This table contains calendar information about a fiscal period, such as
  the period end date and the corresponding
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all WSPIT* tables.
- name: PointDate
  type: TIMESTAMP(6)
  nullable: false
  description: PointDate is the date the record was created in the content database upstream of LSEG Quantitative Analytics.
    The record will then be picked up by RQA in the next daily update (6AM CT, M- F), assuming no processing delays. There
    is no time associated with the PointDate. All timestamps are 00:00:00.000.
- name: FreqCode
  type: TINYINT
  nullable: false
  description: 'FreqCode is the frequency: – 1 = Annual (A) – 2 = Restated – Annual (B) – 3 = Restated – Quarterly (C) – 4
    = Restated – Quarterly Cumulative (E) – 5 = Restated – Semi-Annual (F) – 6 = Restated – Trimester (K) – 7 = Restated –
    Trimester Cumulative (L) – 8 = Quarterly (Q) – 9 = Quarterly – Cumulative (R) – 10 = Semi-Annual (S) – 11 = Trimester
    (T) – 12 = Trimester – Cumulative (U) – 13 = Weekly (W) – 14 = Monthly (M) This field cross-references with WSPITCode.Code
    where Type_ = 11. Cross- referenc'
- name: FiscalPrd
  type: INTEGER
  nullable: false
  description: FiscalPrd is the fiscal period.
- name: CalFiscalPrd
  type: INTEGER
  nullable: true
  description: CalFiscalPrd is the calendar period value.
- name: PrdEndDate
  type: TIMESTAMP(6)
  nullable: true
  description: PrdEndDate is the fiscal period end date.
- name: CalPrdEndDate
  type: TIMESTAMP(6)
  nullable: true
  description: CalPrdEndDate is the fiscal period end month.
- name: UpdTypeCode
  type: SMALLINT
  nullable: true
  description: UpdTypeCode is the update type. WSPITCalPrd.UpdTypeCode cross-references with WSPITCode.Code where Type_ =
    13.
- name: SrcDate
  type: TIMESTAMP(6)
  nullable: true
  description: SrcDate is the document source date. LSEG Quantitative Analytics Worldscope Point in Time 7
join_hints:
- to: WSPITCode
  evidence: 'FreqCode tinyint N FreqCode is the frequency: – 1 = Annual (A) – 2 = Restated – Annual (B) – 3 = Restated – Quarterly
    (C) – 4 = Restated – Quarterly Cumulative (E) – 5 = Restated – Semi-Annual (F) – 6 = Restated – Trimester (K) – 7 = Restated
    – Trimester Cumulative (L) – 8 = Quarterly (Q) – 9 = Quar'
  type: cross_reference

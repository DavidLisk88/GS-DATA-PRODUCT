table: qa_wscope_pit.WSPITInfo
domain: fundamentals
description: Worldscope PIT Issue-Level Information | This table stores issue-level information, such as market identifiers,
  for concordance purposes. This table also
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all WSPIT* tables.
- name: WSID
  type: char(9)
  nullable: false
  description: WSID is the Worldscope unique identifier. This ID does not change. LSEG Quantitative Analytics Worldscope Point
    in Time 11
- name: CmpCode
  type: INTEGER
  nullable: true
  description: CmpCode maps every security (EntityTypeCode = S) to its corresponding company (EntityTypeCode = C).
- name: EntityTypeCode
  type: char(1)
  nullable: true
  description: 'EntityTypeCode indicates whether the Worldscope identifier represents an average, company, exchange rate,
    ADR, security, or a stock index. EntityTypeCode can be: – A = ADR/Foreign Filer – C = Company – E = Exchange Rate – F
    = Country Average – G = Industry Average – I = Index – S = Security'
- name: IsPrimary
  type: char(1)
  nullable: true
  description: IsPrimary is provided on the security level and is the identifier for the share type selected as the primary
    issue of the company. The prices and dividends for this share type are shown at the company level. An “X” is provided
    in this field on the security identifier selected as the primary issue.
- name: CmpInacDate
  type: TIMESTAMP(6)
  nullable: true
  description: CmpInacDate is the date on which the company ceases to exist.
- name: IssInacDate
  type: TIMESTAMP(6)
  nullable: true
  description: IssInacDate is the date on which the share of a company ceases to exist.
- name: NameShort
  type: varchar(20)
  nullable: true
  description: NameShort is an abbreviated company name no longer than twenty characters.
- name: NameLong
  type: varchar(64)
  nullable: true
  description: NameLong is the legal name of the company as reported in the 10-K for U.S. companies and the annual report
    for non-U.S. companies.
- name: ShareType
  type: varchar(25)
  nullable: true
  description: ShareType is the name of the security that has prices and dividends showing with the fundamental data of the
    company. This item is provided for all share types at the security level. The share names are generally shown in the language
    of the country in which the company is domiciled.
- name: Ticker
  type: varchar(20)
  nullable: true
  description: Ticker is a symbol used to identify the company on the stock exchanges where it is listed. Local Ticker symbols
    are used for non-U.S. corporations. Quick Code is used for Japanese companies.
- name: NationCode
  type: SMALLINT
  nullable: true
  description: NationCode represents the country under which the company is followed on Worldscope. The currency of analysis
    is the currency of the nation indicated by NationCode. WSPITInfo.NationCode cross-references with WSPITCode.Code where
    Type_ = 12.
- name: ISOCurrCode
  type: char(3)
  nullable: true
  description: ISOCurrCode is the currency code. WSPITInfo.ISOCurrCode cross-references with WSPITDesc.Code where Type_ =
    4.
---
table: qa_wscope_pit.WSPITItem
domain: fundamentals
description: Worldscope PIT Data Items | This table contains information about Worldscope PIT data items. | Code Table
update_cadence: Daily
columns:
- name: Item
  type: INTEGER
  nullable: false
  description: Item is a unique integer code that cross-references all the items in the data tables.
- name: Name_
  type: varchar(60)
  nullable: true
  description: Name_ is the name of the data item.
- name: DataType
  type: char(1)
  nullable: true
  description: 'DataType may be: – A = Alphanumeric – N = Numeric LSEG Quantitative Analytics Worldscope Point in Time 12'
- name: Length_
  type: SMALLINT
  nullable: true
  description: Length_ is the string length and is applicable for a DataType of A.
- name: SplitFlag
  type: char(1)
  nullable: true
  description: SplitFlag indicates whether the operation performed to adjust the data is multiplication or division. An asterisk
    character ( * ) indicates multiplication; a slash character ( / ) indicates division.
- name: TableCode
  type: char(2)
  nullable: true
  description: TableCode is described in the TableCode section on page 12.
- name: CodeNumb
  type: INTEGER
  nullable: true
  description: 'CodeNumb maps Item to type_code in either WSPITCode or WSPITDesc. TableCode associates the data item with
    a specific Worldscope data table. TableCode can be: Code Table A WSPITStmtIData B WSPITFinVal C WSPITSupp D WSPITRatios
    E WSPITSeg F WSPITPrcRetVol G WSPITCmpIssSData H WSPITCmpIssFData I WSPITLicMrktID K WSPITCmpIssIData L WSPITCmpIssDData
    M WSPITCmpIssFtNote N WSPITStmtDData O WSPITStmtSData P WSPITFinFtNote Q WSPITSegFtNote R WSPITPrcFtNote'

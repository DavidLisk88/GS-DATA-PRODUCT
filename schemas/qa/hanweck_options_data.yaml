table: qa_hanweck.OVSBasketInfo
domain: derivatives
description: Non-Standard Deliverable Items | This table contains non-standard deliverable items for option series with multiple
  deliverables. If the deliverables
update_cadence: Daily
columns:
- name: BasketCode
  type: INTEGER
  nullable: false
  description: BasketCode is basket identifier provided by the vendor.
- name: DelivTypeCode
  type: TINYINT
  nullable: false
  description: 'DelivTypeCode can be one of the following deliverable types: – 1 = Stock – 2 = Cash – 3 = Rights – 4 = Warrants
    OVSBasketInfo.DelivTypeCode cross-references with OVSCode.Code where Type_ = 7.'
- name: DelivCode
  type: INTEGER
  nullable: false
  description: DelivCode is the equity identifier of deliverable stock. If the deliverable is not stock, it is null in the
    feed. In such cases, a value of -1 is inserted into the table.
- name: OpraRootCode
  type: INTEGER
  nullable: false
  description: OpraRootCode is the root ticker symbol. OVSBasketInfo.OpraRootCode cross-references with OVSCode.Code where
    Type_ = 6.
- name: Units
  type: FLOAT
  nullable: true
  description: Units is the deliverable units.
- name: Ticker
  type: varchar(10)
  nullable: true
  description: Ticker is the ticker of deliverable stock (as of basket creation).
- name: ISOCurrCode
  type: char(3)
  nullable: true
  description: ISOCurrCode is the ISO currency code of deliverable cash. It is null when DelivTypeCode is Cash.
join_hints:
- to: OVSCode
  evidence: 'DelivTypeCode tinyint N DelivTypeCode can be one of the following deliverable types: – 1 = Stock – 2 = Cash –
    3 = Rights – 4 = Warrants OVSBasketInfo.DelivTypeCode cross-references with OVSCode.Code where Type_ = 7.'
  type: cross_reference

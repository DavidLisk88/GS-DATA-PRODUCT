  nullable: true
  description: High is the high price.
- name: Low
  type: FLOAT
  nullable: true
  description: Low is the low price.
- name: Open_
  type: FLOAT
  nullable: true
  description: Open_ is the open price.
- name: Volume
  type: BIGINT
  nullable: true
  description: Volume is the volume of the price.
- name: Bid
  type: FLOAT
  nullable: true
  description: Bid is the bid price.
- name: Ask
  type: FLOAT
  nullable: true
  description: Ask is the ask price.
- name: TotRtn
  type: FLOAT
  nullable: true
  description: TotRtn is the total return index for the issuer. LSEG Quantitative Analytics Database Schema for Hanweck Options

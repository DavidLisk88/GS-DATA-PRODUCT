table: qa_hanweck.OVSSecCorpAct
domain: derivatives
description: Pricing-related Corporate Actions | This table contains information for pricing-related corporate actions, including
  cash and stock dividends, and
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the equity identifier provided by the vendor.
- name: AnnSeq
  type: INTEGER
  nullable: false
  description: AnnSeq is the announcement sequence that uniquely identifies each announcement made by the company in question.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the starting effective date for the adjustment (January 1, 1998 or later).
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the ending effective date for the adjustment. The value 12/31/2078 (2078-12-31 00:00:00) in the
    feed is stored as Null in the LSEG database. A null indicates current data.
- name: ExDivDate
  type: TIMESTAMP(6)
  nullable: false
  description: ExDivDate is the ex-dividend date.
- name: RecDate
  type: TIMESTAMP(6)
  nullable: false
  description: RecDate is the record date.
- name: PayDate
  type: TIMESTAMP(6)
  nullable: true
  description: PayDate is the payment date.
- name: Rate
  type: FLOAT
  nullable: false
  description: Rate is the rate.
- name: EventTypeCode
  type: TINYINT
  nullable: false
  description: EventTypeCode describes the nature of the event. OVSSecCorpAct.EventTypeCode cross-references with OVSCode.Code
    where Type_ = 2.
- name: SuplPymtTypeCode
  type: TINYINT
  nullable: false
  description: SuplPymtTypeCode describes the nature of the payment. OVSSecCorpAct.SuplPymtTypeCode cross-references with
    OVSCode.Code where Type_ = 3.
- name: DivFreqCode
  type: char(3)
  nullable: true
  description: DivFreqCode is the indicated dividend frequency. OVSSecCorpAct.DivFreqCode cross-references with OVSDesc.Code
    where Type_ = 6. LSEG Quantitative Analytics Database Schema for Hanweck Options 15
- name: IAD
  type: FLOAT
  nullable: true
  description: IAD is the indicated annual dividend amount.
- name: IADMethodCode
  type: char(1)
  nullable: true
  description: IADMethodCode identifies the methodology that was used to calculate the indicated annual dividend (IAD). OVSSecCorpAct.IADMethodCode
    cross-references with OVSDesc.Code where Type_ = 1.
- name: Desc_
  type: varchar(80)
  nullable: true
  description: Desc_ provides additional details for the corporate action.
---
table: qa_hanweck.OVSSecHVol
domain: derivatives
description: Close-to-close Realized Volatility | This table contains close-to-close realized volatility. The VolType field
  shows how the historical volatility is
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the equity identifier provided by the vendor.
- name: VolTypeCode
  type: TINYINT
  nullable: false
  description: VolTypeCode describes how the volatility is calculated. OVSSecHVol.VolTypeCode cross-references with OVSCode.Code
    where Type_ = 1.
- name: Date_
  type: TIMESTAMP(6)
  nullable: false
  description: Date_ is the pricing date.
- name: Volatility
  type: FLOAT
  nullable: true
  description: Volatility is the realized volatility.
---
table: qa_hanweck.OVSSecInfo
domain: derivatives
description: Security Information | This table is the master table for all securities included in the OVS database. This table
  stores the latest values of | attributes, like the issue name and issuer name, for each security. This table also stores
  records from the | OVSSecChg table where the EndDate is null, the record is stored with the latest EndDate.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the equity identifier provided by the vendor.
- name: Issuer
  type: varchar(30)
  nullable: true
  description: Issuer is the issuer description.
- name: Issue
  type: varchar(20)
  nullable: true
  description: Issue is the issue description.
- name: Ticker
  type: varchar(12)
  nullable: true
  description: Ticker is the ticker. For all exchanges, tickers are represented using a dot delimiter between the root symbol
    and the suffixes. Multiple dot delimiters are used if multiple suffixes apply (for example, ABC.PR.A, ABCD.X).
---

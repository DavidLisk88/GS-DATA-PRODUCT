  type: TINYINT
  nullable: true
  description: Lock up Provision. Cross references the DLCode table where Type_ = 27.
- name: IPOListExchCode
  type: SMALLINT
  nullable: true
  description: Exchange Listing of IPO. Cross references the DLCode table where Type_ = 28.
- name: TotSharesFiled
  type: BIGINT
  nullable: true
  description: 'Sum of all Mkts: Number of global shares filed at original filing.'
- name: TotPriSharesPct
  type: FLOAT
  nullable: true
  description: 'Sum of all Mkts: global primary shares filed at original filing as a percentage of total global shares filed.'
- name: LicFlag
  type: TINYINT
  nullable: false
  description: LicFlag is the license flag based on Issue Type. Cross references the DLCode table where Type_ = 15.

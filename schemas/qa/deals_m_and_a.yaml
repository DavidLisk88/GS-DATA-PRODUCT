- name: EffDate
  type: INTEGER
  nullable: true
  description: EffDate is the date on which the deal became effective.
- name: WithdrawDate
  type: INTEGER
  nullable: true
  description: WithdrawDate is the date on which the deal was withdrawn.
- name: RankDate
  type: INTEGER
  nullable: true
  description: RankDate is the date on which rank was allocated.
- name: LicFlag
  type: INTEGER
  nullable: false
  description: LicFlag is a bit value that represents the license for this table. DLAdvisor.LicFlag cross-references with
    DLCode.Code where Type_ = 15.

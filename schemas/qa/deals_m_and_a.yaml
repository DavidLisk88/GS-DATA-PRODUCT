    and accountant. DLAdvisor.AdvRoleCode cross-references with DLCode.Code where Type_ = 3.
- name: UpdateDate
  type: INTEGER
  nullable: true
  description: UpdateDate is the date of the last significant revision.
- name: AnnDate

table: qa_deals.DLEqTransInfo
domain: corporate_actions
description: This table contains Equity transaction attributes that are available on a per deal basis. It will only include
  publicly | table where Type_ = 17. | references the DLCode table where Type_ = 18. | for the offering. Cross references
  the DLCode table where Type_ | references the DLCode table where Type_ = 20. | references the DLCode table where Type_ =
  29. | issued. Cross references the DLCode table where Type_ = 21. | Cross references the DLCode table where Type_ = 22.
  | BearerOrRegis tinyint Y Be
update_cadence: Daily

  type: BIGINT
  nullable: false
  description: PrimOrgCIDGen is the CIDGEN of the primary player of a deal.
- name: AdvOrgCIDGen
  type: BIGINT
  nullable: false
  description: AdvOrgCIDGen is the CIDGEN of the auxiliary players of the deal.

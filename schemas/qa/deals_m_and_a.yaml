  type: TIMESTAMP(6)
  nullable: true
  description: First date on which the holder has the right to put the security to the issuer, if applicable.
- name: OfferPrc
  type: FLOAT
  nullable: true
  description: Price per share or bond at which the security is offered to the public.
- name: ConvPremium
  type: FLOAT
  nullable: true
  description: Conversion Premium (%).
- name: ExchRatio
  type: FLOAT
  nullable: true
  description: Exchange Conversion Ratio.
- name: ConvRatio
  type: FLOAT
  nullable: true
  description: Conversion Ratio.
- name: DomNationCode
  type: SMALLINT
  nullable: true
  description: 'Rank Domicile Nation for all equity and syndicated loans transactions is defined as the Issuer/Borrower’s
    nation of headquarters. Cross references the following tables: DLCode where Type_ = 16 DLDesc where Type_ = 14'
- name: IssuerMacroIndCode
  type: SMALLINT
  nullable: true
  description: 'Issuer/Borrower Macro Industry (Code). Cross references the following tables: DLCode where Type_ = 24 DLDesc
    where Type_ = 24.'

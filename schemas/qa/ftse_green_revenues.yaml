table: qa_ftse_green.GRItem
domain: esg
description: Green Revenue Metadata | This table contains the metadata of all Green Revenue metrics and Green Revenue Sector
  hierarchical level.
update_cadence: Monthly
columns:
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each GR metric that is a part of the feed.
- name: FeedFieldName
  type: varchar(100)
  nullable: true
  description: Internal LSEG source feed field name.
- name: Title
  type: varchar(200)
  nullable: true
  description: Description pertaining to the Item.
- name: Description
  type: varchar(1000)
  nullable: true
  description: Detailed description pertaining to the Item.
- name: DataType
  type: varchar(20)
  nullable: true
  description: This indicates the datatype of the GR metric.
- name: Units
  type: varchar(100)
  nullable: true
  description: This indicates the unit of the data metric value.
- name: Hierarchy
  type: varchar(20)
  nullable: true
  description: This identifies the hierarchy of the GR metric.
- name: Polarity
  type: varchar(30)
  nullable: true
  description: This indicates whether a higher data measure value is positive or negative.
- name: SecType
  type: varchar(50)
  nullable: true
  description: 'This code identifies the hierarchical level of the Sector Codes within the Green Revenue Classification Schema.
    Schema has 3 levels: at the top level of the Schema there are 10 Sectors followed by 64 Sub Sectors and then, at the most
    granular level, there are 133 Micro Sectors.'
- name: ParentSecCode
  type: varchar(30)
  nullable: true
  description: This code indicates the Parent Node of the Sector. When Sector is top level that is Green Revenue Sector, then
    Parent Code would be NULL.
- name: Tier
  type: TINYINT
  nullable: true
  description: 'Tiering identifies the overall environmental impact associated with the green activity: – Tier 1 covers activities
    with significant and clear environmental – Tier 2 covers activities with more limited but net positive environmental –
    Tier 3 covers activities (micro sectors) which have some environmental benefits but are overall net neutral or negative.
    LSEG Quantitative Analytics Database Schema for FTSE Green Revenues Copyright © 2025 London Stock Exchange Group plc and
    its group of companies ('

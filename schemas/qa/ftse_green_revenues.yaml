table: qa_ftse_green.GRFinPerDet
domain: esg
description: Financial Period Details | This table contains financial period details.
update_cadence: Monthly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Organization ID represents the permanent identifier (Perm ID) of an organization assigned to each unique entity.
    The Perm ID is unique for an entity and remains unchanged.
- name: PerID
  type: BIGINT
  nullable: false
  description: Period ID is associated with the period end date used to report the financial data of the business at the end
    of the financial period for annual and interims. Period end date differs for each company, however, most of the financial
    periods are based on the tax period of the country in order to easily track corporate tax filing.
- name: FY
  type: INTEGER
  nullable: true
  description: Fiscal Year is associated with the financial year based on the annual period end of the company. Period end
    date differs for each company, however, most of the financial periods are based on the tax period of the country in order
    to easily track corporate tax filing. Fiscal Year is collected in the format YYYY and generally it is associated with
    the year of the period end date. For example, if the period end is 03/31/2020, then the fiscal year is 2020. However,
    the annual cut-off date is 15th Ja
- name: PerStrtDt
  type: date
  nullable: true
  description: Period Start Date is the start date of the associated financial period.
- name: PerEndDt
  type: date
  nullable: true
  description: Period End Date is the end date of the financial period that a company selects to close the financial accounts
    of its business. The period end date differs for each company, however, most of the financial periods are based on the
    tax period of the country in order to easily track corporate tax filing.
---
table: qa_ftse_green.GRSummDet
domain: esg
description: Company Summary Data | This table contains company's summary data.
update_cadence: Monthly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: Organization ID represents the permanent identifier (Perm ID) of an organization assigned to each unique entity.
    The Perm ID is unique for an entity and remains unchanged.
- name: PerID
  type: BIGINT
  nullable: false
  description: Period ID is associated with the period end date used to report the financial data of the business at the end
    of the financial period for annual and interims. LSEG Quantitative Analytics Database Schema for FTSE Green Revenues 7
- name: CrtdDt
  type: TIMESTAMP(6)
  nullable: true
  description: This indicates the datetime when the green revenue numbers where first distributed for the period.
- name: EstEUTaxEligRvnPct
  type: double
  nullable: true
  description: Estimated green revenue percentage eligibility with European Union taxonomy.
- name: EstTypCode
  type: varchar(50)
  nullable: true
  description: Estimation Type Code indicates if the sector revenues were disclosed by the company or derived by the analyst
    using the estimation methodology.
- name: GRPct
  type: double
  nullable: true
  description: Reported or estimated green revenue as a proportion of total revenue.
- name: LstModDt
  type: TIMESTAMP(6)
  nullable: true
  description: This indicates the datetime when the green revenues were last modified for the fiscal year.
- name: MaxGRExNclrPct
  type: double
  nullable: true
  description: Estimated maximum green revenue percentage for ex nuclear.
- name: MaxGRPct
  type: double
  nullable: true
  description: Estimated maximum green revenue percentage.
- name: MinGRExNclrPct
  type: double
  nullable: true
  description: Estimated minimum green revenue percentage for ex nuclear.
- name: MinGRPct
  type: double
  nullable: true
  description: Estimated minimum green revenue percentage.
- name: RepRevAmt
  type: double
  nullable: true
  description: Reported Revenue Amount is the value reported by the company for a given financial year.
- name: RepRevISOCurrCode
  type: char(3)
  nullable: true
  description: Reported Revenue ISO Currency Code.
- name: Tier1and2GRPct
  type: double
  nullable: true
  description: Reported or estimated tier 1 and 2 green revenue as a proportion of total revenue.
- name: Tier1GRPct
  type: double
  nullable: true
  description: Reported or estimated tier 1 green revenue as a proportion of total revenue.
- name: Tier2GRPct
  type: double
  nullable: true
  description: Reported or estimated tier 2 green revenue as a proportion of total revenue.
- name: Tier3GRPct
  type: double
  nullable: true
  description: Reported or estimated tier 3 green revenue as a proportion of total revenue.
- name: CorpCommFlg
  type: nvarchar(150)
  nullable: true
  description: This is a placeholder for a new element to be added to the summary file later in Q3.
---

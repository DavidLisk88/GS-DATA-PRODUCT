table: qa_compustat_global.CsgCau
domain: fundamentals
description: Compustat Global Company Auditor Record | Use this table to retrieve annual company statement auditor information,
  including auditor opinion.
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: 'GVKEY is the Global Company Key. It is a primary key for all companies in all Csg* tables. Use GVKEY with
    CsgCmp to obtain company-level information, or CsgSec to obtain security-level information. For example, for security
    mapping, to link to GSecMapX: GSecMapX.vencode = CsgCmp.gvkey where GSecMapX.ventype = 3'
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the company’s fiscal period end date. For security-level data, it is the trade date for high, low,
    or close prices. This item is a key field.
- name: INDFMT
  type: TINYINT
  nullable: false
  description: 'INDFMT denotes whether a company reports in a Financial Services or Industrial format. INDFMT cross-references
    with CSKEYCODE. INDFMT integer values are: – 5 (INDL Industrial, including manufacturing, retail, construction and other
    commercial non-financial services.) – 9 (FS Financial Services, including banks, insurance companies, broker or dealers,
    real estate, and other financial services.) – 16 (ISSUE Issue-level fundamentals.) This item is a key field.'
- name: DATAFMT
  type: TINYINT
  nullable: false
  description: 'DATAFMT describes the method of data reporting and collection. DATAFMT values for Compustat Global are: –
    13 (HIST_STD Standardized data collected from the company''s original filing.) – 15 (RST_STD Standardized restated data
    collected from the company''s subsequent filings.) This item is a key field.'
- name: CONSOL
  type: TINYINT
  nullable: false
  description: 'CONSOL describes the level of consolidation in the company’s financial statements. Levels of consolidation
    are: – 6 (C Consolidated – parent and subsidiary combined) – 7 (P Pre-FASB) – 8 (R Pro-forma) – 10 (D Pre-divestiture)
    – 14 (N Non-consolidated) This item is a key field. CONSOL cross-references with CSKEYCODE where CONSOL = CSKEYCODE.Code.'
- name: RANK
  type: INTEGER
  nullable: false
  description: RANK identifies hierarchy of auditors or of inventory valuation methods. For companies with more than one auditor,
    auditor hierarchy is ranked from 1 to 6, where 1 indicates the primary auditor. For companies using more than one inventory
    valuation method, 1 indicates the valuation method used most often.
- name: AU
  type: SMALLINT
  nullable: true
  description: AU is the auditor. Cross-reference AU with CsgRef where CsgCau.au = CsgRef.refcd1 and CsgRef.reftype = 4.
- name: AUOP
  type: SMALLINT
  nullable: true
  description: AUOP is the auditor opinion. It cross-references with CsgRef where CsgCau.auop = CsgRef.refcd1 and CsgRef.reftype
    = 22.
- name: AUOPIC
  type: char(1)
  nullable: true
  description: AUOPIC is the auditor’s opinion regarding whether the company's internal control over financial reporting is
    effective. Section 404 of the Sarbanes-Oxley Act of 2002 requires companies to report this opinion beginning with fiscal
    years ending after November 15, 2004.
- name: CEOSO
  type: char(1)
  nullable: true
  description: CEOSO is the chief executive officer SOX certification. CEOSO indicates whether the company has filed documents
    certifying the CEO has reviewed the relevant LSEG Quantitative Analytics Database Schema for Compustat Global Data 13
- name: CFOSO
  type: char(1)
  nullable: true
  description: CFOSO is the chief financial officer SOX certification. CFOSO indicates whether the company has filed documents
    certifying the CFO has reviewed the relevant report and that the information is reported fairly, as required by Section
    302 of the Sarbanes-Oxley Act of 2002.
join_hints:
- to: CSKEYCODE
  evidence: INDFMT cross-references with CSKEYCODE.
  type: cross_reference
- to: CSKEYCODE
  evidence: CONSOL cross-references with CSKEYCODE where CONSOL = CSKEYCODE.Code.
  type: cross_reference

table: qa_compustat_global.CsgCad
domain: fundamentals
description: Compustat Global Annual Period Description | Use this table to retrieve period description data on an annual
  basis. This data includes adjustment factors,
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: 'GVKEY is the Global Company Key. It is a primary key for all companies in all Csg* tables. Use GVKEY with
    CsgCmp to obtain company-level information, or CsgSec to obtain security-level information. For example, for security
    mapping, to link to GSecMapX: GSecMapX.vencode = CsgCmp.gvkey where GSecMapX.ventype = 3'
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the company’s fiscal period end date, or for security-level data it is the trade date for high,
    low, or close prices. This item is a key field.
- name: INDFMT
  type: TINYINT
  nullable: false
  description: 'INDFMT denotes whether a company reports in a Financial Services or Industrial format. INDFMT cross-references
    with CSKEYCODE. INDFMT integer values are: – 5 (INDL Industrial, including manufacturing, retail, construction and other
    commercial non-financial services.) – 9 (FS Financial Services, including banks, insurance companies, broker or dealers,
    real estate, and other financial services.) – 16 (ISSUE Issue-level fundamentals.) This item is a key field.'
- name: DATAFMT
  type: TINYINT
  nullable: false
  description: 'DATAFMT describes the method of data reporting and collection. DATAFMT values for Compustat Global are: –
    13 (HIST_STD Standardized data collected from the company''s original filing.) – 15 (RST_STD Standardized restated data
    collected from the company''s subsequent filings.) This item is a key field.'
- name: CONSOL
  type: TINYINT
  nullable: false
  description: 'CONSOL describes the level of consolidation in the company’s financial statements. Levels of consolidation
    are: – 6 (C Consolidated – parent and subsidiary combined) – 7 (P Pre-FASB) – 8 (R Pro-forma) – 10 (D Pre-divestiture)
    LSEG Quantitative Analytics Database Schema for Compustat Global Data 8'
- name: ACCTSTD
  type: varchar(9)
  nullable: true
  description: ACCTSTD is the accounting standard. ACCTSTD cross-references with CsgRef where CsgCad.acctstd = CsgRef.refcd1
    and CsgRef.reftype = 2.
- name: ACQMETH
  type: varchar(3)
  nullable: true
  description: ACQMETH is the acquisition method. It cross-references with CsgRef where CsgCad.acqmeth = CsgRef.refcd1 and
    CsgRef.reftype = 3.
- name: ADRR
  type: FLOAT
  nullable: true
  description: ADRR is the company reported unweighted average of total demand deposits for the year, restated up to five
    years. If no average is reported, then this is the actual figure.
- name: AJEX
  type: FLOAT
  nullable: true
  description: AJEX is the annual company adjustment factor; it is cumulative by ex-date.
- name: AJP
  type: FLOAT
  nullable: true
  description: AJP is the annual company adjustment factor, as applied to the dividends per share by payable date; it is cumulative
    by payable date.
- name: APDEDATE
  type: TIMESTAMP(6)
  nullable: true
  description: APDEDATE is the actual date the company closes accounting for the period.
- name: BSPR
  type: varchar(8)
  nullable: true
  description: BSPR is the balance sheet presentation. BSPR cross-references with CsgRef where CsgCad.bspr = CsgRef.refcd1
    and CsgRef.reftype = 5.
- name: COMPST
  type: varchar(8)
  nullable: true
  description: COMPST is the comparability status. It cross-references with CsgRef where CsgCad.compst = CsgRef.refcd1 and
    CsgRef.reftype = 7.
- name: CURCD
  type: varchar(4)
  nullable: true
  description: CURCD is company ISO currency code. Cross-reference CURCD with CsgRef where CsgCad.compst = CsgRef.refcd1 and
    CsgRef.reftype = 36.
- name: CURNCD
  type: varchar(4)
  nullable: true
  description: CURNCD is the native currency in which the company reports its financial data.
- name: CURRTR
  type: FLOAT
  nullable: true
  description: CURRTR is the exchange rate used to translate non-U.S. currency amounts into U.S. Dollars. The conversion rate
    is the rate as of the date of the company's balance sheet. When an international company reports in U.S. Dollars, the
    translation rate is 1.000.
- name: CURUSCN
  type: FLOAT
  nullable: true
  description: CURUSCN is the exchange rate used to translate Canadian currency into U.S. Dollars, as published in the Federal
    Reserve period rates. This item is available only when a company reports in both U.S. and Canadian accounting standards.
- name: FDATE
  type: TIMESTAMP(6)
  nullable: true
  description: FDATE is the date the data is finalized for the year.
- name: FINAL
  type: varchar(3)
  nullable: true
  description: FINAL indicates that all annual fundamental items are available and have been delivered.
- name: FYEAR
  type: SMALLINT
  nullable: true
  description: FYEAR is the fiscal year of the current fiscal year-end month. If the current fiscal year-end month falls in
    January through May, this item is the current calendar year minus 1 year. If the current fiscal year-end month falls in
    June through December, this item is the current calendar year.
- name: FYR
  type: TINYINT
  nullable: true
  description: FYR is the fiscal year-end month. This item is a key field.
- name: ISMOD
  type: SMALLINT
  nullable: true
  description: ISMOD is the income statement model number. It cross-references with CsgRef where CsgCad.compst = CsgRef.refcd1
    and CsgRef.reftype = 17.
- name: OGM
  type: varchar(9)
  nullable: true
  description: OGM is the Oil and Gas Method. OGM refers to the method of revenue reporting used by the oil and gas company.
- name: PDATE
  type: TIMESTAMP(6)
  nullable: true
  description: PDATE is the preliminary date the data for the company is updated for that year.
- name: PDDUR
  type: TINYINT
  nullable: true
  description: PDDUR is the period duration (number of months) covered by the company’s annual report income statement. This
    figure may not be available for all companies.
- name: SCF
  type: SMALLINT
  nullable: true
  description: SCF is the cash flow format. Cross-reference with CsgRef where CsgCad.scf = CsgRef.refcd1 and CsgRef = 6.
- name: SRC
  type: SMALLINT
  nullable: true
  description: SRC is the source document. Cross-reference SRC with CsgRef where CsgCad.compst = CsgRef.refcd1 and CsgRef.reftype
    = 10.
- name: STALT
  type: varchar(3)
  nullable: true
  description: STALT is the status alert. Cross-reference with CsgRef where CsgCad.compst = CsgRef.refcd1 and CsgRef.reftype
    = 30.
- name: UDPL
  type: varchar(9)
  nullable: true
  description: UDPL is the liberalized depreciation code used by a utility company. This item identifies the method used to
    account for liberalized depreciation. If 51% of its liberalized depreciation is deferred, it is categorized as Normal.
    If 51% of its liberalized depreciation is flowed through, it is categorized as Flowed Through. LSEG Quantitative Analytics
    Database Schema for Compustat Global Data 9
- name: UPD
  type: SMALLINT
  nullable: true
  description: UPD is the update code. Cross-reference with CsgRef where CsgCad.compst = CsgRef.refcd1 and CsgRef.reftype
    = 33.
join_hints:
- to: CSKEYCODE
  evidence: INDFMT cross-references with CSKEYCODE.
  type: cross_reference
- to: CsgRef
  evidence: ACCTSTD cross-references with CsgRef where CsgCad.acctstd = CsgRef.refcd1 and CsgRef.reftype = 2.
  type: cross_reference
- to: CsgRef
  evidence: BSPR cross-references with CsgRef where CsgCad.bspr = CsgRef.refcd1 and CsgRef.reftype = 5.
  type: cross_reference
---

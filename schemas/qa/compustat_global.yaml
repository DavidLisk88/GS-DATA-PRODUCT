  type: varchar(11)
  nullable: true
  description: EIN is the Employer Identification Number issued by the IRS.
- name: FAX
  type: varchar(21)
  nullable: true
  description: FAX is the fax number.
- name: FIC
  type: varchar(4)
  nullable: true
  description: FIC is the ISO3 code of the country of incorporation. Cross-reference with CsgRef where CsgCin.fic = CsgRef.refcd1
    and CsgRef.reftype = 8. LSEG Quantitative Analytics Database Schema for Compustat Global Data 14
- name: FYRC
  type: TINYINT
  nullable: true
  description: FYRC is the fiscal year end month.
- name: GGROUP
  type: INTEGER
  nullable: true
  description: GGROUP is the GICS group code. Cross-reference GGROUP with – CsgRef where CsgCin.ggroup = CsgRef.refcd2, and
    CsgRef.reftype = 34, and CsgRef.refcd1 = ‘GGROUP’, or – CsgRef where CsgCin.ggroup = CsgRef.refcd1, and CsgRef.reftype
    = 15
- name: GIND
  type: INTEGER
  nullable: true
  description: GIND is the GICS industry code. Cross-reference it with either – CsgRef where CsgCin.gind = CsgRef.refcd2,
    and CsgRef.reftype = 34, and CsgRef.refcd1 = ‘GIND’, or – CsgRef where CsgCin.gind = CsgRef.refcd1, and CsgRef.reftype
    = 15
- name: GSECTOR
  type: INTEGER
  nullable: true
  description: GSECTOR is the GICS sector code. Cross-reference GSECTOR with – CsgRef where CsgCin.gind = CsgRef.refcd2, and
    CsgRef.reftype = 34, and CsgRef.refcd1 = ‘GSECTOR’, or – CsgRef where CsgCin.gsectir = CsgRef.refcd1, and CsgRef.reftype
    = 15
- name: GSUBIND
  type: INTEGER
  nullable: true
  description: GSUBIND is the GICS subindustry code. Cross-reference GSUBLND with either – CsgRef where CsgCin.gsubind = CsgRef.refcd2,
    and CsgRef.reftype = 34, and CsgRef.refcd1 = ‘GSUBIND’, or – CsgRef where CsgCin.gsubind = CsgRef.refcd1, and CsgRef.reftype
    = 15
- name: IDBFLAG
  type: char(1)
  nullable: true
  description: IDBFLAG indicates whether the company is international (I), domestic (D), or both (B).
- name: INCORP
  type: varchar(9)
  nullable: true
  description: INCORP is the state or province of incorporation. Cross-reference INCORP with CsgRef where CsgCin.incorp =
    CsgRef.refcd1 and CsgRef.reftype = 31.
- name: IPODATE
  type: TIMESTAMP(6)

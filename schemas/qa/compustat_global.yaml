  and status. This table does not contain historical
columns:
- name: GVKEY
  type: INTEGER
  nullable: false
  description: 'GVKEY is the Global Company Key. It is a primary key for all companies in all Csg* tables. Use GVKEY with
    CsgCmp to obtain company-level information, or CsgSec to obtain security-level information. For example, for security
    mapping, to link to GSecMapX: GSecMapX.vencode = CsgCmp.gvkey where GSecMapX.ventype = 3'
- name: ADD1
  type: varchar(66)
  nullable: true
  description: ADD1 contains the company headquarters mailing address
- name: ADD2
  type: varchar(66)
  nullable: true
  description: ADD2 contains the company headquarters mailing address
- name: ADD3
  type: varchar(66)
  nullable: true
  description: ADD3 contain the company headquarters mailing address
- name: ADD4
  type: varchar(66)
  nullable: true
  description: ADD4 contains the company headquarters mailing address
- name: ADDZIP
  type: varchar(21)
  nullable: true
  description: ADDZIP contains the company zip or postal code.
- name: CIK
  type: varchar(11)
  nullable: true
  description: CIK is the Central Index Key; it is used by the SEC to identify who has filed disclosures with the SEC.
- name: CITY
  type: varchar(101)
  nullable: true
  description: CITY is the city of the company’s headquarters.
- name: CONML
  type: varchar(101)
  nullable: true

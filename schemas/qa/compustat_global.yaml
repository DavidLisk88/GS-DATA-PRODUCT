table: qa_compustat_global.CSGSSPLIT
domain: fundamentals
description: Compustat Global Security Stock Split Data | This table contains information on security stock splits.
columns:
- name: SECID
  type: INTEGER
  nullable: false
  description: SECID is synonymous to IID. SECID is the primary key across all CsgS* tables.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the company’s fiscal period end date. For security-level data, it is the trade date for high, low,
    or close prices. This item is a key field.
- name: SPLIT
  type: FLOAT
  nullable: true
  description: SPLIT is the split ratio of the stock.
---
table: qa_compustat_global.CsgXrd
domain: fundamentals
description: Compustat Global Currency Daily Exchange Rate Data | Use this table to retrieve daily exchange rate data.
columns:
- name: TOCURD
  type: varchar(4)
  nullable: false
  description: TOCURD is the currency into which the daily translation rate translates. For example, in the translation from
    Euros into U.S. Dollars, the code for U.S. Dollars is the TOCURD. Use TOCURD in conjunction with FROMCURD. Cross-reference
    TOCURD with CsgRef, where CsgXrd.tocurd = CsgRef.refcd1 and CsgRef.reftype = 36.
- name: DATADATE
  type: TIMESTAMP(6)
  nullable: false
  description: DATADATE is the company’s fiscal period end date. For security-level data, it is the trade date for high, low,
    or close prices. This item is a key field.
- name: EXRATD
  type: FLOAT
  nullable: true
  description: EXRATD is the daily exchange rate.
- name: EXRATTPD
  type: varchar(3)
  nullable: true
  description: EXRATTPD is the daily exchange rate report type. EXRATTPD cross- references with CsgRef where CsgXrd.exrattpd
    = CsgRef.refcd1 and CsgRef.reftype = 12.
- name: FROMCURD
  type: varchar(4)
  nullable: true
  description: FROMCURD is the ISO currency code for the starting currency in a daily currency translation. For example, in
    the translation from Euros into U.S. Dollars, the code for Euros is the FROMCURD. Cross-reference FROMCURD with CsgRef,
    where CsgXrd.fromcurd = CsgRef.refcd1 and CsgRef.reftype = 36. LSEG Quantitative Analytics Database Schema for Compustat
    Global Data 40

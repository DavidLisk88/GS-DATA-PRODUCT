  type: TINYINT
  nullable: false
  description: 'CONSOL describes the level of consolidation in the company’s financial statements. Levels of consolidation
    are: – 6 (C Consolidated – parent and subsidiary combined) – 7 (P Pre-FASB) – 8 (R Pro-forma) – 10 (D Pre-divestiture)
    – 14 (N Non-consolidated) This item is a key field. CONSOL cross-references with CSKEYCODE where CONSOL = CSKEYCODE.Code.'
- name: FYR
  type: TINYINT
  nullable: false
  description: FYR is the fiscal year-end month. This item is a key field.
- name: DATAFMT
  type: TINYINT
  nullable: false
  description: 'DATAFMT describes the method of data reporting and collection. DATAFMT values for Compustat Global are: –
    13 (HIST_STD Standardized data collected from the company''s original filing.) – 15 (RST_STD Standardized restated data
    collected from the company''s subsequent filings.) This item is a key field.'
- name: ACCTSTDQ
  type: varchar(9)
  nullable: true
  description: ACCTSTDQ is the accounting standard for the quarter. ACCTSTD cross- references with CsgRef where CsgNtrmCoIDesc.acctstd
    = CsgRef.refcd1 and CsgRef.reftype = 2.
- name: ADRRQ
  type: FLOAT
  nullable: true
  description: ADRRQ is the company reported unweighted average of total demand deposits for the quarter. If no average is
    reported, then this is the actual figure.
- name: AJEXQ
  type: FLOAT
  nullable: true
  description: AJEXQ is the quarterly company adjustment factor; it is cumulative by ex- date.
- name: AJPQ
  type: FLOAT
  nullable: true
  description: AJPQ is the quarterly company adjustment factor, as applied to the dividends per share by payable date; it
    is cumulative by payable date. LSEG Quantitative Analytics Database Schema for Compustat Global Data 28
- name: APDEDATEQ
  type: TIMESTAMP(6)
  nullable: true
  description: APDEDATEQ is the actual date the company closes accounting for the period.
- name: BSPRQ
  type: varchar(9)
  nullable: true
  description: BSPRQ is the balance sheet presentation. BSPR cross-references with CsgRef where CsgNtrmCoIDesc.bspr = CsgRef.refcd1
    and CsgRef.reftype = 5.
- name: COMPSTQ
  type: varchar(9)
  nullable: true
  description: COMPSTQ is the comparability status. It cross-references with CsgRef where CsgNtrmCoIDesc.compst = CsgRef.refcd1
    and CsgRef.reftype = 7.
- name: CURCDQ
  type: varchar(4)
  nullable: true
  description: CURCDQ is company ISO currency code. Cross-reference CURCDQ with CsgRef where CsgNtrmCoIDesc.compst = CsgRef.refcd1
    and CsgRef.reftype = 36.
- name: CURNCDQ
  type: varchar(4)
  nullable: true
  description: CURNCDQ is the native currency in which the company reports its financial data.
- name: CURRTRQ
  type: FLOAT
  nullable: true
  description: CURRTRQ is the exchange rate used to translate non-U.S. currency amounts into U.S. Dollars. The conversion
    rate is the rate as of the date of the company's balance sheet. When an international company reports in U.S. Dollars,
    the translation rate is 1.000.
- name: CURUSCNQ
  type: FLOAT
  nullable: true
  description: CURUSCNQ is the exchange rate used to translate Canadian currency into U.S. Dollars, as published in the Federal
    Reserve period rates. This item is available only when a company reports in both U.S. and Canadian accounting standards.
- name: DATACQTR
  type: varchar(7)
  nullable: true
  description: 'DATACQTR shows the calendar year and quarter as YYYYQQ, with the four calendar quarters defined as: – Q1 (February
    – April) – Q2 (May – July) – Q3 (August – October) – Q4 (November – January)'
- name: DATAFQTR
  type: varchar(7)
  nullable: true
  description: DATAFQTR shows the fiscal year and quarter as YYYYQQ, where 2007Q1 would represent the fiscal quarter July-September
    2006 for a company whose fiscal year ends in June 2007.
- name: FDATEQ
  type: TIMESTAMP(6)
  nullable: true
  description: FDATEQ is the date the data is finalized for the quarter.
- name: FINALQ
  type: varchar(3)
  nullable: true
  description: FINALQ indicates that all quarterly fundamental items are available and have been delivered.
- name: FQTR
  type: TINYINT
  nullable: true
  description: FQTR is the fiscal quarter of the company, depending upon the quartile of the fiscal year in which the data
    falls.
- name: FYEARQ
  type: SMALLINT
  nullable: true
  description: FYEARQ is the fiscal year of the current fiscal end-of-quarter month.
- name: OGMQ
  type: varchar(9)
  nullable: true
  description: OGMQ is the Quarterly Oil and Gas Method. OGM refers to the method of revenue reporting used by the oil and
    gas company.
- name: PDATEQ
  type: TIMESTAMP(6)
  nullable: true
  description: PDATEQ is the preliminary date the data for the company is updated for that quarter.
- name: PDQ
  type: TINYINT
  nullable: true
  description: PDQ indicates the number of months in the quarter for the reporting period.
- name: PDSA
  type: TINYINT
  nullable: true
  description: PDSA indicates the number of months in the semi-annual reporting period.
- name: PDYTD
  type: TINYINT
  nullable: true
  description: PDYTD indicates the number of months in the year-to-date reporting period.
- name: RDQ
  type: TIMESTAMP(6)
  nullable: true
  description: RDQ is the first public reporting date of the quarterly earnings per share.
- name: RP
  type: varchar(3)
  nullable: true
  description: RP is the interim reporting periodicity of a company for a specific year. The reporting period will be either
    Q (quarterly) or (SA) semiannual.
- name: SCFQ
  type: INTEGER
  nullable: true
  description: SCFQ is the cash flow format for the quarter.
- name: SRCQ
  type: INTEGER
  nullable: true
  description: SRCQ is the source document for the quarter.
- name: STALTQ
  type: varchar(3)
  nullable: true
  description: STALTQ is the status alert.
- name: UPDQ
  type: SMALLINT
  nullable: true
  description: UPDQ is the update code. LSEG Quantitative Analytics Database Schema for Compustat Global Data 29

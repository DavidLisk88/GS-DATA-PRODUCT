  type: SMALLINT
  nullable: true
  description: 'DATACODE indicates non-normal values. DATACODE values are: – 0 (Normal) – 1 (Not available) – 2 (Semi-annual
    figure) – 3 (Annual figure) – 4 (Combined figure) LSEG Quantitative Analytics Database Schema for Compustat Global Data
    10'

table: qa_own_v2.Own2InstrFnd
domain: ownership
description: Ownership Instrument Fundamentals | This table contains the underlying ratios and other fundamentals used in
  weighted calculations (e.g., portfolio
update_cadence: 30 minutes
columns:
- name: InstrId
  type: BIGINT
  nullable: false
  description: Instrument Fundamentals Instrument Id
- name: EPS3YrAnnGR
  type: FLOAT
  nullable: true
  description: ((Current Year's Earnings Per Share/ Earnings Per Share four years ago, reduced to a compound annual rate)
    – 1) * 1.
- name: Sales3YrAnnGR
  type: FLOAT
  nullable: true
  description: ((Current Year's Net Sales or Revenues / Net Sales or Revenues four years ago, reduced to a compound annual
    rate) – 1) * 1.
- name: EPS5YrProjGR
  type: FLOAT
  nullable: true
  description: The projected EPS Growth over the next five years as represented by the Long Term Growth Estimate.
- name: GrossPrftMrgn
  type: FLOAT
  nullable: true
  description: Gross Income / Net Sales or Revenues * 1.
- name: LTermD2E
  type: FLOAT
  nullable: true
  description: 'All Industries: Long Term Debt / Common Equity * 1 Insurance Companies: If Common Equity is not available,
    Policyholders Equity is substituted Underlying fundamental used in weighted calculations.'
- name: LTermD2TotCap
  type: FLOAT
  nullable: true
  description: Long Term Debt / Total Capital * 1.
- name: NetInc
  type: FLOAT
  nullable: true
  description: NET INCOME - BOTTOM LINE represents income after all operating and non-operating income and expense, reserves,
    income taxes, minority interest and extraordinary items. Transformation applied - converted to USD. Underlying fundamental
    used in weighted calculations.
- name: NetMrgn
  type: FLOAT
  nullable: true
  description: Net Income before Preferred Dividends / Net Sales or Revenues * 1.
- name: OpPrftMrgn
  type: FLOAT
  nullable: true
  description: Operating Income / Net Sales or Revenues * 1 Underlying fundamental used in weighted calculations.
- name: PE12mFwd
  type: FLOAT
  nullable: true
  description: Forward price to earnings - The price/earnings ratio for the company based on most recent closing price in
    the Thomson Financial database and the Thomson Financial annual mean expected earnings for the fiscal period selected(12
    months in this case). For example, a company’s FY1 P/E ratio would be calculated by dividing the latest closing price
    by the mean FY1 EPS forecast. Underlying fundamental used in weighted calculations.
- name: PE12mTrl
  type: FLOAT
  nullable: true
  description: Market Price-Current / Earnings Per Share-Last 12 Months
- name: DivPORatioPS
  type: FLOAT
  nullable: true
  description: Dividends Per Share / Earnings Per Share * 1 Underlying fundamental used in weighted calculations.
- name: PE2GR
  type: FLOAT
  nullable: true
  description: 'PEG - The price/earnings to growth ratio for the company for the fiscal period selected. The numerator in
    the equation is the P/E ratio for the fiscal period selected (see P/E Ratio – Estimate). The denominator is the appropriate
    growth rate for the fiscal period (as described below). FY1 PEG: (FY1 P/E) / (FY1/FY Growth) FY2 PEG: (FY2 P/E) / (FY2/FY1
    Growth) FY3 PEG: (FY3 P/E) / (FY3/FY2 Growth) 12-Month-Forward PEG: (12-Month-Forward P/E) / (Long Term Growth Median)
    12-Month-Forward PEG*: (12-M'
- name: P2B
  type: FLOAT
  nullable: true
  description: Market Price-Current / Book Value Per Share-Current
- name: P2SalesPS
  type: FLOAT
  nullable: true
  description: Market Price–Year End / Sales Per Share Underlying fundamental used in weighted calculations.
- name: Rev
  type: FLOAT
  nullable: true
  description: NET SALES OR REVENUES represent gross sales and other operating revenue less discounts, returns and allowances.
    Transformation applied - converted to USD. Underlying fundamental used in weighted calculations.
- name: ROA
  type: FLOAT
  nullable: true
  description: 'Industrial Companies: Annual Time Series: (Net Income before Preferred Dividends + ((Interest Expense on Debt-
    Interest Capitalized) * (1-Tax Rate))) / Average of Last Year''s and Current Year’s Total Assets * 100 Banks: Net Income
    before Preferred Dividends + ((Interest Expense on Debt- Interest Capitalized) * (1-Tax Rate))) / Average of Last Year''s
    (Total Assets - Customer Liabilities on Acceptances) and Current Year’s (Total Assets - Customer Liabilities on Acceptances)
    * 100. Customer Liabili'
- name: ROE
  type: FLOAT
  nullable: true
  description: 'All Industries: (Net Income before Preferred Dividends - Preferred Dividend Requirement) / Average of Last
    Year''s and Current Year’s Common Equity * 100 For Insurance companies, Policyholders’ Surplus is substituted where Net
    Income before Preferred Dividends is not available and Policyholders’ Equity where Common Equity is not available. Exceptions:
    Finland (95 and prior years) and Norway (93 and prior years): All Industries: LSEG Quantitative Analytics Database Schema
    for Ownership Version 2 1'
- name: DivYld
  type: FLOAT
  nullable: true
  description: 'All Industries: Dividends Per Share-Last 12 Months / Market Price-Current * 100 Exceptions: U.S. and Canadian
    Companies: Indicated Dividend Rate / Market Price-Current * 100 This item is also available at the security level. Underlying
    fundamental used in weighted calculations. LSEG Quantitative Analytics Database Schema for Ownership Version 2 16'

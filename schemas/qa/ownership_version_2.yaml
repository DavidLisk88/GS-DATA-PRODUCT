- name: IsPublic
  type: BOOLEAN
  nullable: true
  description: Is the organization public
- name: IPODate
  type: TIMESTAMP(6)
  nullable: true
  description: Date the company went public
- name: ISO2CntryCode
  type: char
  nullable: true
  description: Organization Country Iso31661 Alpha Code
- name: LegalName
  type: nvarchar
  nullable: true
  description: Full registered legal name of the company or official name of the institution (including upper and lower case
    characters). Reserved for the primary language version of the name. Where a Body Group legal or official name exists in
    more than one language - for example, Switzerland where an organization may be registered in up to four languages - the
    language most commonly used in the area where the head office is based is used for Legal Name purposes.
- name: AddrLine1
  type: nvarchar
  nullable: true
  description: Text representing the first lines of an address - excluding county, zip code and country.
- name: AddrLine2
  type: nvarchar
  nullable: true
  description: Text representing the first lines of an address - excluding county, zip code and country.
- name: City
  type: varchar
  nullable: true
  description: Text representing the city part of an address.
- name: StateProv
  type: varchar
  nullable: true
  description: Text representing the state or province part of an address.
- name: PostalCode
  type: varchar
  nullable: true
  description: Text representing the first lines of an address - excluding county, zip code and country.
- name: PriTRBCIndPermID
  type: BIGINT
  nullable: true
  description: Current primary TRBC assignment.
- name: CntryGeoID
  type: BIGINT
  nullable: true
  description: Country or Geography Perm ID.
- name: CalcBasisCode
  type: TINYINT
  nullable: false
  description: 'Indicates the period basis for calculations. Cross references table Own2Code where Type_ = 17. The options
    are: – 1 (M) = Monthly – 2 (Q) = Quarterly'
- name: CalcBasisDesc
  type: varchar
  nullable: true
  description: Calc basis code description.
- name: EffectFromDate
  type: smalldatetime
  nullable: false
  description: The date starting which the data is effective
- name: EffectToDate
  type: smalldatetime
  nullable: true
  description: The date till which the data is effective
- name: FreeFlt
  type: BIGINT
  nullable: true
  description: Company-level free float, representing all of its public equity
- name: FreeFltPct
  type: FLOAT
  nullable: true
  description: Company-level free float as a percent of total shares outstanding of all public equity instruments
- name: ShsHldStgInv
  type: BIGINT
  nullable: true
  description: Represents the number of shares held by strategic investors (Corporations, Holding Companies, Individuals and
    Government Agencies) for all publicly-traded share classes.
- name: FreeFltAdjRestShs
  type: FLOAT
  nullable: true
  description: Number of shares in Free Float, taking into account any restricted shares. (Issuer-level)
- name: FreeFltPctAdjRestShs
  type: FLOAT
  nullable: true
  description: Free Float Percent, taking into account any restricted shares. (Issuer-level)
- name: NoOfRestShs
  type: FLOAT
  nullable: true
  description: Number of restricted shares for the period in question (as defined by the Start and End Dates). (Issuer-level)
- name: RestPeriodStDate
  type: TIMESTAMP(6)
  nullable: true
  description: Start Date of the period for which the shares are restricted. (Issuer- level.)
- name: RestPeriodEndDate
  type: TIMESTAMP(6)
  nullable: true
  description: End Date of the period for which the shares are restricted. (Issuer- level.)
- name: NoOfUnRestShs
  type: FLOAT
  nullable: true
  description: Number of unrestricted shares for the period in question (as defined by the Start and End Dates). (Issuer-level)
- name: RestUnrestShsDate
  type: TIMESTAMP(6)
  nullable: true
  description: Date when Issuer reported the restricted and unrestricted shares
- name: PctShsHldByStgInv
  type: FLOAT
  nullable: true
  description: 'Percent of shares outstanding held by strategic entities (e.g., individual investors, corporations, etc.)
    (Issuer-level.) LSEG Quantitative Analytics Database Schema for Ownership Version 2 74 Example Use Case: -- This query
    returns the free float information about Vicor Corp. select aa.*, dd.* from vw_SecurityMasterX aa join vw_PermInstrMappingX
    bb on bb.SecCode = aa.seccode and bb.Typ = aa.typ join PermInstrRef cc on cc.InstrPermID = bb.EntPermID join vw_Own2PermIssuer
    dd on dd.OrgPermID = cc.'

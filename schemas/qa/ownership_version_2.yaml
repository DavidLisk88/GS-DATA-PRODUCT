table: qa_own_v2.vw_Own2RDCIssuer
domain: ownership
description: CalcBasisCode tinyint no Indicates the period basis for calculations. Cross references table
columns:
- name: OrgId
  type: INTEGER
  nullable: false
  description: OrgID is the permanent identifier of the organization. LSEG Quantitative Analytics Database Schema for Ownership
    Version 2 71
- name: ComName
  type: varchar
  nullable: true
  description: ComName is the name of the organization in mixed case, manually limited to 80 characters to meet OptionX requirements.
    The organization’s legal name is used to populate this field when the legal name does not exceed 80 characters.
- name: LegalName
  type: varchar
  nullable: true
  description: LegalName is the fully registered legal name of the company, or the official name of the institution.
- name: ShortName
  type: varchar
  nullable: true
  description: ShortName is the short name of the organization in mixed case (unless it is a recognized acronym entered in
    uppercase, such as IBM for International Business Machines Corp), manually limited to a maximum of 16 characters.
- name: OrgStatus
  type: char
  nullable: true
  description: 'OrgStatus is the role-to-issue status of the organization. It can have the following values: – AC = Active
    – DC = Inactive Values are to be populated automatically, according to the type of organization. Values are never populated
    or maintained manually.'
- name: ContriCode
  type: varchar
  nullable: true
  description: ContriCode is the code used to identify organizations contributing data (usually quotes) to the real-time Integrated
    Data Network. (IDN). RDCOrgInfo.ContriCode cross-references with RDCDesc.Code where Type_ = 27035.
- name: ContriTypeCode
  type: char
  nullable: true
  description: ContriTypeCode is the classifier of the contributing organization. ContriTypeCode can be bank or broker. RDCOrgInfo.ContriTypeCode
    cross-references with RDCDesc.Code where Type_ = 110661.
- name: ClSiteLocCode
  type: varchar
  nullable: true
  description: ClSiteLocCode uniquely identifies the contributor. The code is comprised of the country code, followed by a
    generated sequence number of the contributor in that country. RDCOrgInfo.ClSiteLocCode cross-references with RDCDesc.Code
    where Type_ = 114785.
- name: CntryHQISOCode
  type: char
  nullable: true
  description: CntryHQISOCode is the geographical headquarters of the organization. RDCOrgInfo.CntryHQISOCode cross-references
    with RDCDesc.Code where Type_ = 27165.
- name: CntryOfIncCode
  type: char
  nullable: true
  description: CntryOfIncCode is the country in which the party received its charter, allowing it to operate as a corporation.
    If the country of incorporation is not disclosed, or if the company is not a corporation, then this would be populated
    the same as the current country or where the company was formed. RDCOrgInfo.CntryOfIncCode cross-references with RDCDesc.Code
    where Type_ = 30986.
- name: ISOCurrCode
  type: char
  nullable: true
  description: ISOCurrCode is the currency of record of the fund entity. RDCOrgInfo.ISOCurrCode cross-references with RDCDesc.Code
    where Type_ = 80867.
- name: OrgTypeCode
  type: varchar
  nullable: true
  description: OrgTypeCode is described in the OrgTypeCode section on page 11.
- name: DFlag
  type: INTEGER
  nullable: true
  description: DFlag stores a bitmasked combination for the IsContributor, IsExch, and IsFundSupCmp data items.
- name: NDAOrgID
  type: BIGINT
  nullable: true
  description: NDAOrgID
- name: TMTPermID
  type: varchar
  nullable: true
  description: TMTPermID
- name: GEMPermID
  type: BIGINT
  nullable: true
  description: GEMPermID
- name: CalcBasisCode
  type: TINYINT
  nullable: false
  description: 'Indicates the period basis for calculations. Cross references table Own2Code where Type_ = 17. The options
    are: – 1 (M) = Monthly – 2 (Q) = Quarterly'
- name: CalcBasisDesc
  type: varchar
  nullable: true
  description: Calc basis code description. LSEG Quantitative Analytics Database Schema for Ownership Version 2 72
- name: EffectFromDate
  type: smalldatetime
  nullable: false
  description: The date starting which the data is effective
- name: EffectToDate
  type: smalldatetime
  nullable: true
  description: The date till which the data is effective
- name: FreeFlt
  type: BIGINT
  nullable: true
  description: Company-level free float, representing all of its public equity
- name: FreeFltPct
  type: FLOAT
  nullable: true
  description: Company-level free float as a percent of total shares outstanding of all public equity instruments
- name: ShsHldStgInv
  type: BIGINT
  nullable: true
  description: Represents the number of shares held by strategic investors (Corporations, Holding Companies, Individuals and
    Government Agencies) for all publicly-traded share classes.
- name: FreeFltAdjRestShs
  type: FLOAT
  nullable: true
  description: Number of shares in Free Float, taking into account any restricted shares. (Issuer-level)
- name: FreeFltPctAdjRestShs
  type: FLOAT
  nullable: true
  description: Free Float Percent, taking into account any restricted shares. (Issuer-level)
- name: NoOfRestShs
  type: FLOAT
  nullable: true
  description: Number of restricted shares for the period in question (as defined by the Start and End Dates). (Issuer-level)
- name: RestPeriodStDate
  type: TIMESTAMP(6)
  nullable: true
  description: Start Date of the period for which the shares are restricted. (Issuer-level.)
- name: RestPeriodEndDate
  type: TIMESTAMP(6)
  nullable: true
  description: End Date of the period for which the shares are restricted. (Issuer-level.)
- name: NoOfUnRestShs
  type: FLOAT
  nullable: true
  description: Number of unrestricted shares for the period in question (as defined by the Start and End Dates). (Issuer-level)
- name: RestUnrestShsDate
  type: TIMESTAMP(6)
  nullable: true
  description: Date when Issuer reported the restricted and unrestricted shares
- name: PctShsHldByStgInv
  type: FLOAT
  nullable: true
  description: 'Percent of shares outstanding held by strategic entities (e.g., individual investors, corporations, etc.)
    (Issuer-level.) Example Use Case: --This query returns the free float information about Vicor Corp. select aa.*, cc.*
    from vw_SecurityMasterX aa join vw_RDCOrgMappingX bb on bb.SecCode = aa.seccode and bb.Typ = aa.typ join vw_Own2RDCIssuer
    cc on cc.OrgId = bb.VenCode where aa.id = ''VICR'' order by cc.CalcBasisCode, cc.EffectFromDate'

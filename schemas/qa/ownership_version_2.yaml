    then AssetState is Active 'AC', else, if all Quote Assets are Deactivated (Asset State = ‘DC’) then AssetState becomes
    Deactivated 'DC'. AssetState is derived for all Asset types except DEBT Issues which are maintained by the DBS forward
    feed. AssetState is 'NA' (Not Applicable) when no Quote Asset is found against the Issue/Instrument, in particular new
    Issues will get 'NA' status as so

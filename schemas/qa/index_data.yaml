table: qa_index.IdxRlClsCode
domain: indices
description: Russell Daily Index Classification Codes | referenced the PrcCode2 table in the IDC Equities Pricing schema.
  In those implementations it was not possible | to track industry or sector changes over time. This table overcomes that
  obstacle by providing a way to track | The start date for the data in this table is 29 June 2009.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is cross-referenced from other Russell tables. It is equivalent to Industry, Sector1, or Sector2.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: 'If no change in the industry or sector description has taken place, StartDate is the date the of the original
    classification. If the industry or sector description has changed, this is the date the new classification began. Note:
    Because Russell reclassified all records for reconstitution in this table, the initial StartDate for all records is 29
    June 2009, unless the classification changed after 29 June 2009.'
- name: CodeDesc
  type: varchar(256)
  nullable: true
  description: For the records with start dates from 29 June 2009 to 20 September 2020, CodeDesc represents the description
    of the industry or sector (RGS codes). For the records with start dates from 21 September 2020, this field represents
    the description of industry, sector, subsector or supersector (ICB codes).
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the date a classification changed. If no EndDate is present, then the shown classification is current.
    EndDate is given as the StartDate for the new classification, minus one day.
---

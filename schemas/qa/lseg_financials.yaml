table: qa_lseg_fin.RKDFndSplitHist
domain: fundamentals
description: This table contains the history of stock splits associated with the company.
update_cadence: Daily
columns:
- name: IssueCode
  type: INTEGER
  nullable: false
  description: IssueCode is an integer code generated for every unique combination of Code and IssueID. This field cross-references
    with RKDFndCmpRefIssue.IssueCode. Refer to that table's description for details.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the start date of the split. By default, this field is set to 1/1/1900. When split information
    is provided, this field contains the split date.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the end date of the split. If split history is provided, EndDate is the split date – 1. If no split
    history is provided, this field is set to Null.
- name: Factor
  type: FLOAT
  nullable: true
  description: Factor is the split factor. For example, a 2-for-1 stock split has Factor = 2. Database Schema for LSEG Financials
    78
- name: CumAdjFactor
  type: FLOAT
  nullable: true
  description: CumAdjFactor is the cumulative adjustment factor. This field is set to 1 for the most recent split, and the
    split history is built backwards. So, for the first instance of the split, CumAdjFactor = 1/Factor. For the second instance
    of the split, CumAdjFactor = (CumAdjFactor for first instance)/(Factor of first instance).
- name: LicFlag
  type: TINYINT
  nullable: true
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. LicFlag cross-references
    with RKDFndCode.Code where Type_ = 69. • 1 = North America (NA) • 2 = Asia Pacific (AP) • 4 = Europe (EU)

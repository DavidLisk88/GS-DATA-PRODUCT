  nullable: true
  description: DirStartDt is the date the Director status began. The date is formatted as YYYYMMDD.
- name: DirEndDt
  type: TIMESTAMP(6)
  nullable: true
  description: DirEndDt is the date the Director status ended. The date is formatted as YYYYMMDD.
- name: LicFlag
  type: INTEGER
  nullable: false
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. LicFlag cross-references
    with RKDFndCode.Code where Type_ = 69. • 1 = North America (NA) • 2 = Asia Pacific (AP) • 4 = Europe (EU)

table: qa_lseg_fin.RKDFndCmpIssDet
domain: fundamentals
description: Company Issue Details | Use this table to retrieve issue-level details such as type, currency, par value, number
  of outstanding shares, and so | on. This table may contain multiple issue details for a given company.
update_cadence: Daily
columns:
- name: IssueID
  type: INTEGER
  nullable: false
  description: IssueID uniquely identifies each issue from an issuer. This identifier is specific to LSEG, does not change
    over time, and is never re-used. Database Schema for LSEG Financials 13
- name: IssueTypeCode
  type: INTEGER
  nullable: true
  description: IssueTypeCode indicates whether the issue is Common stock (1) or Preferred (2).
- name: IssueOrder
  type: INTEGER
  nullable: true
  description: If a company has multiple issues, IssueOrder indicates the order of the issue. Primary issue is assigned order
    number 1 for each IssueTypeCode. Factors considered in determining the primary issue include whether the issue trades,
    the number of shares outstanding, float, trading volumes, voting power, and so on.
- name: ISOParCurrCode
  type: char(3)
  nullable: true
  description: ISOParCurrCode describes the currency of the par value. Cross- reference ISOParCurrCode with RKDFndDesc where
    ISOParCurrCode = RKDFndDesc.Code and RKDFndDesc.Type_ = 58.
- name: ParValue
  type: FLOAT
  nullable: true
  description: ParValue indicates the par value of the issue.
- name: ShAuth
  type: FLOAT
  nullable: true
  description: ShAuth indicates the number of shares authorized for the issue.
- name: ShOut
  type: FLOAT
  nullable: true
  description: ShOut indicates the number of shares outstanding for the issue.
- name: ShOutDt
  type: TIMESTAMP(6)
  nullable: true
  description: ShOutDt is the date ShOut was last updated by LSEG. The date is formatted as YYYYMMDD.
- name: IssueFloat
  type: FLOAT
  nullable: true
  description: IssueFloat is the current total number of shares publicly owned and available for trading.
- name: Votes
  type: FLOAT
  nullable: true
  description: Votes indicates the number of votes attributable to each share of this issue.
- name: ConvFactor
  type: FLOAT
  nullable: true
  description: ConvFactor is the conversion factor from each issue into primary issue.
- name: ShAuthDt
  type: TIMESTAMP(6)
  nullable: true
  description: ShAuthDt is the date on which the number of authorized shares for the issue was last updated.
- name: FloatDt
  type: TIMESTAMP(6)
  nullable: true
  description: FloatDt is the date on which the float value of the issue was updated.
- name: ShIssued
  type: FLOAT
  nullable: true
  description: ShIssued is the number of shares the company has issued.
- name: ShIssuedDt
  type: TIMESTAMP(6)
  nullable: true
  description: ShIssuedDt is the date that the ShIssued value was last updated.
- name: TreasurySh
  type: FLOAT
  nullable: true
  description: TreasurySh is the number of shares the company holds as treasury stock for that share issue.
- name: TreasuryShDt
  type: TIMESTAMP(6)
  nullable: true
  description: TreasuryShDt is the date that the TreasurySh value was last updated.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. LicFlag cross-references
    with RKDFndCode.Code where Type_ = 69. • 1 = North America (NA) • 2 = Asia Pacific (AP) • 4 = Europe (EU) Database Schema
    for LSEG Financials 14
join_hints:
- to: RKDFndCode
  evidence: LicFlag cross-references with RKDFndCode.Code where Type_ = 69. • 1 = North America (NA) • 2 = Asia Pacific (AP)
    • 4 = Europe (EU)
  type: cross_reference
---
table: qa_lseg_fin.RKDFndCmpOfficer

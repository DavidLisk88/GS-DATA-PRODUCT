  nullable: true
  description: IssueStatus indicates whether the issue is active (1) or inactive (0).
- name: IssueOrder
  type: INTEGER
  nullable: true
  description: If a company has multiple issues, IssueOrder indicates the order of the issue. Primary issue is assigned order
    number 1 for each IssueTypeCode. Factors considered in determining the primary issue include whether the issue trades,

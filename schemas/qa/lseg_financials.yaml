table: qa_lseg_fin.RKDFndStdItem
domain: fundamentals
description: Standardized COA Codes | Use this table to retrieve the standardized description of the COA Codes. This table
  is shared between the LSEG | Table_ varchar(20) Y Table_ identifies the table where the corresponding value for | represents
  a table and values are populated in each table listed.
update_cadence: Daily
columns:
- name: Item
  type: INTEGER
  nullable: false
  description: Item is the integer code for the COA Mnemonic. This field is cross-referenced from other tables.
- name: COA
  type: varchar(20)
  nullable: true
  description: COA is the LSEG COA code. COA is described by Desc_.
- name: StmtTypeCode
  type: TINYINT
  nullable: true
  description: 'StmtTypeCode indicates the type of statement containing the associated item. StmtTypeCode may be: • 1 = INC
    (Income Statement) • 2 = CAS (Cash Flow) • 3 = BAL (Balance Sheet) For other codes, cross-reference StmtTypeCode with
    RKDFndCode where StmtTypeCode = RKDFndCode.Code and RKDFndCode.Type_ = 45. To translate RKDFndCode.Desc_, cross-reference
    RKDFndCode.Desc_ with RKDFndDesc.Code where RKDFndDesc.Type_ = 45.'
- name: LineID
  type: INTEGER
  nullable: true
  description: LineID is a code assigned to each COA code. It remains constant over time and can be used to order the values
    for display purposes.
- name: Level_
  type: varchar(10)
  nullable: true
  description: 'Use Level_ to create a summary standardized financials display. Level_ may be: det: Indicates detailed COA
    codes. These items are appropriate for a detailed view of financial statements and directly map to the line items reported
    by the companies. sum: Indicates summarized COA codes, and should be used for a summary view of financial statements.
    both: Reflects items that may be reported by the companies or calculated by LSEG. Most displays of LSEG standardized data
    reflect only the line items at'
- name: Agg
  type: INTEGER
  nullable: true
  description: Agg indicates the aggregation level and can be used to format the standardized display. A value of 1 is left-most
    and 3 is the most indented from the left.
- name: ItemPrecision
  type: INTEGER
  nullable: true
  description: 'ItemPrecision indicates the type of data and can be used to format data items. ItemPrecision may be: • 0 =
    values such as employee number/number of • 1 = financial values such as net sales or current assets • 2 = share amounts
    such as total shares outstanding • 3 = per share values such as dividends per share • 4 = ratios'
- name: Display
  type: varchar(40)
  nullable: true
  description: Display describes the type of display for the item. Database Schema for LSEG Financials 30
- name: Desc_
  type: varchar(1500)
  nullable: true
  description: Desc_ describes the COA mnemonic.
- name: Table_
  type: varchar(20)
  nullable: true
  description: Table_ identifies the table where the corresponding value for this item is located. Table_ cross-references
    with RKDFndDesc Table_ = RKDFndDesc.Code and RKDFndDesc.Type_ = 80. Where Table_ contains more than one letter code, each
    letter represents a table and values are populated in each table listed.
- name: DataType
  type: varchar(20)
  nullable: true
  description: DataType describes the item data type.
- name: IsCurrency
  type: TINYINT
  nullable: true
  description: IsCurrency indicates whether the item is a currency item. A value of 1 indicates it is currency; a value of
    0 indicates it is not.
- name: Adjust
  type: TINYINT
  nullable: true
  description: 'Adjust indicates the adjustment method. Adjust may be: • 0 = No adjustment • 1 = To adjust values, multiply
    by the adjustment factor • 2 = To adjust values, divide by adjustment factor'
join_hints:
- to: RKDFndCode
  evidence: 'StmtTypeCode may be: • 1 = INC (Income Statement) • 2 = CAS (Cash Flow) • 3 = BAL (Balance Sheet) For other codes,
    cross-reference StmtTypeCode with RKDFndCode where StmtTypeCode = RKDFndCode.Code and RKDFndCode.Type_ = 45.'
  type: cross_reference
- to: RKDFndDesc
  evidence: Table_ cross-references with RKDFndDesc where Table_ = RKDFndDesc.Code and RKDFndDesc.Type_ = 80.
  type: cross_reference

table: qa_lseg_fin.RKDFndCmpDet
domain: fundamentals
description: Company Details | This table contains information such as company name, contact information, number of employees,
  and incorporation
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all RKD* tables. Code is defined in RKDFndInfo.
- name: PrimaryName
  type: varchar(80)
  nullable: true
  description: PrimaryName is the company name.
- name: ConstOfGSPC
  type: varchar(50)
  nullable: true
  description: ConstOfGSPC indicates whether the company is a part of the S&P 500 Index.
- name: ConstOfNDX
  type: varchar(50)
  nullable: true
  description: ConstOfNDX indicates whether the company is part of the Nasdaq 100 Index
- name: ProductionDt
  type: varchar(20)
  nullable: true
  description: ProductionDt is the production date and indicates the date the file was last generated. The date is formatted
    as YYYYMMDD.
- name: Employees
  type: INTEGER
  nullable: true
  description: Employees indicates the number of people the company employs.
- name: EmpLastUpdDt
  type: TIMESTAMP(6)
  nullable: true
  description: EmpLastUpdDt is the date Employees was last updated by LSEG. The date is formatted as YYYYMMDD.
- name: TotShOut
  type: FLOAT
  nullable: true
  description: TotShOut indicates the total number of shares outstanding for the issue.
- name: TotShOutDt
  type: TIMESTAMP(6)
  nullable: true
  description: TotShOutDt is the date TotShOut was last updated by LSEG. The date is formatted as YYYYMMDD.
- name: TotFloat
  type: FLOAT
  nullable: true
  description: TotFloat indicates the current total number of shares publicly owned and available for trading.
- name: ComShHldr
  type: INTEGER
  nullable: true
  description: ComShHldr is the number of holders of common shares.
- name: ComShHldrDt
  type: TIMESTAMP(6)
  nullable: true
  description: ComShHldrDt is the date ComShHldr was last updated by LSEG. The date is formatted as YYYYMMDD.
- name: IncIn
  type: char(5)
  nullable: true
  description: IncIn is the United States state of incorporation. States are defined using U. S. state postal code abbreviations
    and include PR, indicating Puerto Rico, and DC, indicating the District of Columbia.
- name: IncInDt
  type: INTEGER
  nullable: true
  description: IncInDt is the date of incorporation. The date is formatted as YYYYMMDD.
- name: IncInCtryCode
  type: varchar(3)
  nullable: true
  description: IncInCtryCode indicates the country of incorporation. Cross- reference IncInCtryCode with RKDFndDesc where
    IncInCtryCode = RKDFndDesc.Code and RKDFndDesc.Type_ = 3. Database Schema for LSEG Financials 11
- name: AuditorCode
  type: varchar(4)
  nullable: true
  description: AuditorCode is the auditor code. Cross-reference AuditorCode with RKDFndDesc where AuditorCode = RKDFndDesc.Code
    and RKDFndDesc.Type_ = 30.
- name: StAdd1
  type: varchar(60)
  nullable: true
  description: StAdd1 is the first line of the company’s street address.
- name: StAdd2
  type: varchar(60)
  nullable: true
  description: StAdd2 is the second line of the company’s street address.
- name: StAdd3
  type: varchar(60)
  nullable: true
  description: StAdd3 is the third line of the company’s street address.
- name: City
  type: varchar(60)
  nullable: true
  description: City is the city of the company’s street address.
- name: StateOrReg
  type: varchar(60)
  nullable: true
  description: StateOrReg indicates the state or region of the company’s address.
- name: Post
  type: varchar(20)
  nullable: true
  description: Post is the company address postal code or zip code.
- name: ISOCntryCode
  type: char(3)
  nullable: true
  description: ISOCntryCode is the ISO country code indicating the company’s address country. Cross-reference ISOCntryCode
    with RKDFndDesc where ISOCntryCode = RKDFndDesc.Code and RKDFndDesc.Type_ = 3.
- name: CntPerName
  type: varchar(60)
  nullable: true
  description: CntPerName is the name of the company contact, if available.
- name: CntPerTitle
  type: varchar(60)
  nullable: true
  description: CntPerTitle is the title of the person listed in CntPerName, or if CntPerName is null, it is the title of the
    company contact.
- name: Email
  type: varchar(120)
  nullable: true
  description: Email is the e-mail address of the company contact.
- name: PublicSince
  type: TIMESTAMP(6)
  nullable: true
  description: PublicSince is the date the company went public.
- name: TxAgentCode
  type: INTEGER
  nullable: true
  description: TxAgentCode is a numeric code that indicates the transfer agent.
- name: TxAgentPh
  type: varchar(20)
  nullable: true
  description: TxAgentPh is the contact number for the transfer agent.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. LicFlag cross-references
    with RKDFndCode.Code where Type_ = 69. • 1 = North America (NA) • 2 = Asia Pacific (AP) • 4 = Europe (EU)
join_hints:
- to: RKDFndCode
  evidence: 'LicFlag cross-references with RKDFndCode.Code where Type_ = 69. • 1 = North America (NA) • 2 = Asia Pacific (AP)
    • 4 = Europe (EU) RKDFndCmpFiling: Company Filing Source Information Use this table to extract company filing source information.'
  type: cross_reference
---

table: qa_northfield.NFCmFactors
domain: risk_models
description: Common Risk Factors Information | This table contains risk factors information.
update_cadence: Monthly
columns:
- name: FactorCode
  type: SMALLINT
  nullable: false
  description: FactorCode is a unique integer code that identifies a factor. This integer code is defined in TRDW and is not
    received from the vendor.
- name: FactorID
  type: varchar(30)
  nullable: false
  description: FactorID is the risk factor identifier.
- name: Name_
  type: varchar(25)
  nullable: false
  description: Name_ is the risk factor name.
- name: LongName
  type: varchar(100)
  nullable: false
  description: LongName is the risk factor long name.
- name: ModelType
  type: SMALLINT
  nullable: false
  description: 'ModelType specifies the type of model to which the risk factor belongs. There are five types of risk models
    in Northfield Risk Factors: – Domestic – Global – Regional – Single Country – Everything Everywhere NFCmFactors.ModelType
    cross-references NFCmCode.Code where Type_ = 7. Use the following query: select C.Desc_ from NFCmFactors F join NFCmCode
    C on F.ModelType=C.Code and C.Type_=7 where F.FactorCode=73'
---
table: qa_northfield.NFCmIndustry
domain: risk_models
description: Common Industry Information | This table contains industry information.
update_cadence: Monthly
columns:
- name: IndustryCode
  type: SMALLINT
  nullable: false
  description: IndustryCode is a unique integer code that identifies an industry. This integer code is defined in TRDW and
    is not received from the vendor.
- name: SectorType
  type: SMALLINT
  nullable: true
  description: 'SectorType distinguishes between three different types of industry data available in Northfield Risk Models.
    – 1 = Northfield US Fundamental Sector (domestic industry data): FND/APT Industry mnemonics are integer values. – 2 =
    Northfield US Real Estate Sector (US real estate industry data): REIT model industry mnemonics are integer values. – 3
    = Northfield Global Sector (global industry data): In global industry data, industry Mnemonics are in Sx-Cy format. For
    example, in s3-c23, s3 means secto'
- name: Mnemonic
  type: varchar(10)
  nullable: true
  description: Mnemonic is the industry identifier. Each sector type has a separate naming convention for the industry mnemonic.
- name: Name_
  type: varchar(100)
  nullable: true
  description: Name_ is the industry name.
- name: SectorCode
  type: SMALLINT
  nullable: true
  description: SectorCode is the sector code to which the industry belongs. NFCmIndustry.SectorCode cross-references with
    NFCmCode.Code where Type_ = 10. LSEG Quantitative Analytics Database Schema for Northfield Risk Factors 8
---
table: qa_northfield.NFCmInfo
domain: risk_models
description: Common Entity Information | This table contains a single entry for each entity encountered, including the latest
  value of entity identifiers.
update_cadence: Monthly
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is a unique integer code that identifies a security. This integer code is defined in TDW and is not received
    from the vendor.
- name: Name_
  type: varchar(150)
  nullable: true
  description: Name_ is the security name.
- name: NFNIS
  type: varchar(12)
  nullable: true
  description: NFNIS is the Northfield unique security identifier. The vendor files contain Northfield unique identifiers
    for equity data only. Most of the securities in the EE model are without unique identifiers.
- name: NFTicker
  type: varchar(12)
  nullable: true
  description: 'NFTicker can be either a security identifier or a Northfield custom identifier. The value of the NFIdType
    field determines what NFTicker represents: – NFIdType = 1 for a security identifier – NFIdType = 2 for a Northfield custom
    identifier'
- name: Cusip
  type: varchar(9)
  nullable: true
  description: Cusip is the security’s CUSIP identifier.
- name: Sedol
  type: varchar(7)
  nullable: true
  description: Sedol is the security’s SEDOL identifier.
- name: Isin
  type: varchar(12)
  nullable: true
  description: Isin is the security’s ISIN identifier.
- name: UpdateDate
  type: TIMESTAMP(6)
  nullable: true
  description: UpdateDate is the most recent date the record was updated.
- name: NFIdType
  type: SMALLINT
  nullable: true
  description: NFIdType is used to distinguish between custom IDs and security ticker IDs in the NFTicker field.
- name: AssetType
  type: SMALLINT
  nullable: true
  description: AssetType is not populated from the vendor file.
---
table: qa_northfield.NFCmModel

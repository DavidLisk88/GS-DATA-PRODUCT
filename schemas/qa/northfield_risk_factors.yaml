table: qa_northfield.NFCmSecIdent
domain: risk_models
description: Common Security Identifier Change History | This table contains security identifier change history information.
update_cadence: Monthly
columns:
- name: Ident
  type: varchar(12)
  nullable: false
  description: Ident contains the change history of the NFTicker, CUSIP, SEDOL, ISIN, and NFId of a security.
- name: IdentType
  type: SMALLINT
  nullable: false
  description: 'IdentType describes what type of security identifier is present in the Ident field. IdentType can be: – 1
    = CUSIP – 2 = SEDOL – 3 = FI_Index – 4 = Ticker – 5 = ISIN – 6 = NFId'
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the date on which the data in the file is valid. The date is in the format YYYYMMDD.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is populated when a security is changed or discontinued. The date is in the format YYYYMMDD.
- name: Code
  type: INTEGER
  nullable: true
  description: Code is the unique value assigned to a security in the NFCmInfo table.

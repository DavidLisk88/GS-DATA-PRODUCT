  nullable: false
  description: ModelCode is a unique integer code that identifies a risk model.
- name: Mnemonic
  type: varchar(8)
  nullable: false
  description: Mnemonic is the risk model mnemonic.
- name: Name_
  type: varchar(25)
  nullable: false
  description: Name_ is the risk model name.
- name: ModelType
  type: SMALLINT
  nullable: false
  description: 'ModelType specifies the type of model to which the risk factor belongs. There are three types of risk models
    in Northfield Risk Factors: – 1 = Domestic – 2 = Global – 3= Regional – 4 = Single Country – 5 = Everything Everywhere
    NFCmModel.ModelType cross-references with NFCmCode.Code where Type_ = 7. LSEG Quantitative Analytics Database Schema for
    Northfield Risk Factors 9'

table: qa_northfield.NFModCor
domain: risk_models
description: Model Factor Correlations | This table contains correlations between two factors by model.
update_cadence: Monthly
columns:
- name: Date_
  type: TIMESTAMP(6)
  nullable: false
  description: Date_ is the date on which the data in the file is valid. The date is in the format YYYYMMDD.
- name: ModelCode
  type: SMALLINT
  nullable: false
  description: ModelCode is an integer code that identifies the Northfield Risk Model. NFModCor.ModelCode cross-references
    with NFCmCode.Code where Type_ = 6.
- name: CurrCode
  type: SMALLINT
  nullable: false
  description: CurrCode is an integer code that identifies the currency. NFModCor.CurrCode cross-references with NFCmCode.Code
    where Type_ = 8.
- name: FactorCode1
  type: SMALLINT
  nullable: false
  description: FactorCode1 is the integer code assigned to factor1; it is the first factor with respect to which correlation
    is stored. This is a foreign key from the NFCmFactors table.
- name: FactorCode2
  type: SMALLINT
  nullable: false
  description: FactorCode2 is the integer code assigned to factor2; it is the second factor with respect to which correlation
    is stored. This is a foreign key from the NFCmFactors table.
- name: Corr
  type: FLOAT
  nullable: false
  description: Corr is the correlation value between FactorCode1 and FactorCode2.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a bit value that represents the license for this table. NFModCor.LicFlag cross-references with NFCmCode.Code
    where Type_ = 12. LSEG Quantitative Analytics Database Schema for Northfield Risk Factors 10
---

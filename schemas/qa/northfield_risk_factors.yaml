table: qa_northfield.NFCmCode
domain: risk_models
description: Common Integer Coded Values | This table contains integer coded values.
update_cadence: Monthly
columns:
- name: Type_
  type: SMALLINT
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: INTEGER
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(127)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code.
---

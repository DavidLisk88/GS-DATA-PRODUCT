    description is in the ESG2Item table. Cross-reference Item with ESG2Item.Item. Value scores are calculated for 186 data
    points and indicators that contribute towards the ESG scoring calculations. These fields can be identified in column 'IncludedInScores'
    of the ESG2Item table, tagged with the value ‘TRESG’.
- name: FY
  type: INTEGER
  nullable: false
  description: The particular fiscal year for which the data is defined.
- name: ValueId
  type: BIGINT
  nullable: false
  description: A unique ValueId enables identification of each as reported measure. One data measure can map to many as reported
    measures. This ValueId maps to the As Reported data in the ESG2AsRepData table.

table: qa_lseg_esg.ESG2StmtDet
domain: esg
description: Financial Period | This table contains financial period details.
update_cadence: Weekly
columns:
- name: OrgPermID
  type: BIGINT
  nullable: false
  description: LSEG organization identifier.
- name: FY
  type: INTEGER
  nullable: false
  description: The particular fiscal year for which the data is defined.
- name: PerEndDt
  type: TIMESTAMP(6)
  nullable: true
  description: The period end date of the ESG report.
- name: PerIsIncomplete
  type: char(1)
  nullable: true
  description: 'PerIsIncomplete can take one of the following values: “Y” or “N”. If “Y”, not all ESG information has been
    collected for the whole Financial Period. LSEG publish ESG collected data as soon as it is published. Once all data has
    been collected for a period, this field will be marked as “N”.'
- name: PerTypeCode
  type: TINYINT
  nullable: true
  description: This is the type of the financial period of the ESG Value. LSEG ESG data is collected annually. Corresponding
    code description in the ESG2Code table. Cross-reference OrgCovCode with ESG2Code.Code where Type_ = 9.
- name: OrgCovCode
  type: TINYINT
  nullable: true
  description: ESG indicates a full coverage company. ATD indicates an organization for which there is a limited population
    of shareholders datapoints. 'Limited' indicates a privately owned organization. Scores and indicators will not be calculated
    for private organizations. Corresponding code description in the ESG2Code table. Cross-reference OrgCovCode with ESG2Code.Code
    where Type_ = 10.
---
table: qa_lseg_esg.ESG2Item
domain: esg
description: Data Items | An itemized table for all the ESG metrics. This table stores the metadata of all ESG metrics and
  the table where | DataTypeCode tinyint Yes The data type determines which table the item will be a part of. | TableCode
  tinyint Yes The data table in which the value pertaining to the item resides.
update_cadence: Weekly
columns:
- name: Item
  type: SMALLINT
  nullable: false
  description: An item code to uniquely identify each ESG metric that is a part of the feed. Corresponding code description
    is in the ESG2Item table. Cross- reference Item with ESG2Item.Item
- name: FeedFieldName
  type: varchar(100)
  nullable: true
  description: Internal LSEG source feed field name.
- name: Title
  type: varchar(200)
  nullable: true
  description: Description pertaining to the Item.
- name: Description
  type: varchar(2000)
  nullable: true
  description: Detailed description pertaining to the item.
- name: DataTypeCode
  type: TINYINT
  nullable: true
  description: The data type determines which table the item will be a part of. Corresponding type code in the ESG2Code table.
    Cross-reference DataTypeCode with ESG2Code.Code where Type_ = 2.
- name: TableCode
  type: TINYINT
  nullable: true
  description: The data table in which the value pertaining to the item resides. Corresponding type code in the ESG2Code table.
    Cross-reference TableCode with ESG2Code.Code where Type_ = 3. LSEG Quantitative Analytics Database Schema for LSEG ESG
    Data 6
- name: HierarchyCode
  type: TINYINT
  nullable: true
  description: 'This code identifies the hierarchy of the ESG data metric. Corresponding type code in the ESG2Code table.
    HeirarchyCode can take one of the following values: 1: Data Point 2: Indicator 3: Category Score 4: Score Cross-reference
    HeirarchyCode with ESG2Code.Code where Type_ = 4.'
- name: Units
  type: varchar(100)
  nullable: true
  description: This indicates the unit of the data metric value.
- name: Polarity
  type: varchar(30)
  nullable: true
  description: This indicates whether a higher data measure value is positive or negative.
- name: IncludedInScores
  type: Varchar(50)
  nullable: true
  description: The data type along with the range for the values is defined.
- name: PillarItem
  type: SMALLINT
  nullable: true
  description: The code that defines the specific pillar which the datapoint is associated.. Corresponding type code in the
    ESG2Code table. Cross- reference PillarItem with ESG2Code.Code where Type_ = 5
- name: CatItem
  type: SMALLINT
  nullable: true
  description: The code that defines the specific category which the datapoint is associated.. Corresponding type code in
    the ESG2Code table. Cross- reference CatItem with ESG2Code.Code where Type_ = 6
- name: RegLicFlag
  type: TINYINT
  nullable: true
  description: This is for future use.
- name: ValueScoreExists
  type: char(1)
  nullable: true
  description: 'This flag shows if normalized score is generated for the ESG data point. ValueScoreExists can take one of
    the following values: “Y” or “N”.'
- name: AsRepExists
  type: char(1)
  nullable: true
  description: 'This flag shows if as reported data is available for the ESG data point. AsRepExists can take one of the following
    values: “Y” or “N”.'
- name: SourceExists
  type: char(1)
  nullable: true
  description: 'This flag shows if source document(s) are available for the ESG data point. SourceExists can take one of the
    following values: “Y” or “N”.'
---

  type: varchar(13)
  nullable: true
  description: QtPermID is the permanent quote-level ID. (Reserved for future development).
- name: LicFlag
  type: SMALLINT
  nullable: true
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. Cross-reference
    LicFlag with Ds2Xref.Code where Type_ = 1002.

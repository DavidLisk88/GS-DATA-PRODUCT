  type: INTEGER
  nullable: true
  description: FreqCode is the frequency code, indicating the series frequency. (This field is not currently populated.)
- name: Name_
  type: varchar(150)
  nullable: true
  description: Name_ is the expanded name of the commodity.
- name: DSName
  type: varchar(40)
  nullable: true
  description: DSName is the Datastream name of the commodity.
- name: FreightCond
  type: varchar(255)
  nullable: true
  description: FreightCond indicates the freight condition defined in the commodity contract for the delivery of the commodity.
    (This field is not currently populated.)
- name: StartDate
  type: INTEGER
  nullable: true
  description: StartDate indicates the start date for a series.
- name: SeriesType
  type: char(1)
  nullable: true
  description: SeriesType indicates whether the series is a Spot commodity (S), or a commodity Index (I). This field cross-references
    DSCmDesc.Code where Type_ = 6. LSEG Quantitative Analytics Database Schema for Datastream 45
- name: LicFlag
  type: INTEGER
  nullable: false
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. Cross-reference
    LicFlag with DSCmLicFlagCode.

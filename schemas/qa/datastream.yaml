table: qa_datastream.DS2ExchQtInfo
domain: pricing
description: Datastream Exchange Quote Information | This is the information table for exchange-level quotes.
columns:
- name: InfoCode
  type: INTEGER
  nullable: false
  description: InfoCode is the Quantitative Analytics internal code for Datastream tables. InfoCode is the primary mapping
    code for country-level identifiers. InfoCode cross-references with DS2CtryQtInfo.
- name: ExchIntCode
  type: SMALLINT
  nullable: false
  description: ExchIntCode is the integer code for the exchange. Cross-reference ExchIntCode with Ds2Exchange.
- name: ISOCurrCode
  type: char(3)
  nullable: true
  description: ISOCurrCode is the code for the currency of the country of origin of the security. Cross- reference ISOCurrCode

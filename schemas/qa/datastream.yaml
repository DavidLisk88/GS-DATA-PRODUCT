table: qa_datastream.Ds2Adj
domain: pricing
description: Adjustment Factors | This table contains the adjustment factors for splits and spinoffs. Datastream data is stored
  unadjusted, but
columns:
- name: InfoCode
  type: INTEGER
  nullable: false
  description: InfoCode is the Quantitative Analytics internal code for Datastream tables. InfoCode is the primary mapping
    code for country-level identifiers. InfoCode cross-references with DS2CtryQtInfo.
- name: AdjType
  type: TINYINT
  nullable: false
  description: AdjType identifies the type of adjustment factor where 1 indicates that the adjustment includes splits only,
    and 2 indicates that it includes everything.
- name: AdjDate
  type: TIMESTAMP(6)
  nullable: false
  description: AdjDate is the date of adjustment.
- name: EndAdjDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndAdjDate is the date the adjustment period ended.
- name: AdjFactor
  type: FLOAT
  nullable: true
  description: AdjFactor is the actual factor used for adjustment. It provides a time series of the discrete adjustment factors
    applied for each capital event in the stock history. The factors are not accumulated.
- name: CumAdjFactor
  type: FLOAT
  nullable: true
  description: 'CumAdjFactor is a time series of accumulated adjustment factors. The latest value is always 1, and historic
    adjustment factors are accumulated in reverse chronological order. As a result, the most recent AdjFactor = 1 and the
    oldest AdjFactor = 1 multiplied by the product of all adjustment factors. Example: If BASEDATE 30/06/90 EVENT 1 30/06/95
    AdjFactor = 0.5 LSEG Quantitative Analytics Database Schema for Datastream 19'
- name: LicFlag
  type: SMALLINT
  nullable: true
  description: LicFlag is the bitmap license flag. This indicates the license to which the record belongs. Cross-reference
    LicFlag with Ds2Xref.Code where Type_ = 1002.
join_hints:
- to: DS2CtryQtInfo
  evidence: InfoCode cross-references with DS2CtryQtInfo.
  type: cross_reference
---

table: qa_datastream.InfoCode
domain: pricing
description: Underlying Table Index Fields
columns:
- name: InfoCode
  type: INTEGER
  nullable: false
  description: InfoCode is the Quantitative Analytics internal code for Datastream tables. InfoCode is the primary mapping
    code for country-level identifiers.
- name: DsSecCode
  type: INTEGER
  nullable: true
  description: DsSecCode is the Datastream Security-level code.
- name: DsQtName
  type: varchar
  nullable: true
  description: DsQtName contains the name of the name of country-level quote.
- name: IsPrimQt
  type: TINYINT
  nullable: true
  description: IsPrimQt flags whether this is the primary country-level quote. This field can have a value of 1 (yes) or 0
    (no).
- name: PrimExchIntCode
  type: SMALLINT
  nullable: true
  description: PrimExchIntCode is the integer code for the primary exchange.
- name: PrimaryExchange
  type: varchar
  nullable: true
  description: PrimaryExchange is the exchange name of the primary exchange.
- name: CountryTradingIn
  type: varchar
  nullable: true
  description: CountryTradingIn is the country code indicating where the security is traded on its primary exchange.
- name: CountryTradingInName
  type: varchar
  nullable: true
  description: CountryTradingInName is the country name where the security is traded on its primary exchange.
- name: StatusCode
  type: char
  nullable: true
  description: – A (Active) – D (Dead) – S (Suspended)
- name: StatusDescription
  type: varchar
  nullable: true
  description: StatusDescription is the description of the StatusCode item.
- name: EquityTypeCode
  type: varchar
  nullable: true
  description: EquityTypeCode is the code indicating the type of equity.
- name: EquityTypeDescription
  type: varchar
  nullable: true
  description: 'EquityTypeDescription is the description of the type of equity. Example Use Case: Retrieving basic information
    for a single security select * from vw_Ds2secinfo where InfoCode = 66353 --Thomson Reuters (NYS) This view returns pricing
    data for all exchanges associated with a DS InfoCode. Pricing and volume values are adjusted (or unadjusted) according
    to the adjustment type (AdjType) column. Underlying Table Index Fields InfoCode, AdjType, MarketDate, ExchIntCode, IsPrimExchQt,
    DsCode Unique Key '
- name: InfoCode
  type: INTEGER
  nullable: false
  description: InfoCode is the Quantitative Analytics internal code for Datastream tables. InfoCode is the primary mapping
    code for country-level identifiers.
- name: DsCode
  type: varchar
  nullable: true
  description: DsCode is the Datastream code. LSEG Quantitative Analytics Database Schema for Datastream 53
- name: MarketDate
  type: TIMESTAMP(6)
  nullable: false
  description: MarketDate is the date of the price.
- name: ExchIntCode
  type: SMALLINT
  nullable: true
  description: ExchIntCode is the integer code for the exchange.
- name: IsPrimExchQt
  type: char
  nullable: true
  description: IsPrimExchQt indicates whether the quote is a primary exchange- level quote (Y), or is not (N).
- name: ExchName
  type: varchar
  nullable: true
  description: ExchName is the exchange name
- name: AdjType
  type: INTEGER
  nullable: false
  description: AdjType identifies the type of adjustment factor where 1 indicates that the adjustment includes splits only,
    and 2 indicates that it includes everything. 0 Indicates that the pricing is unadjusted.
- name: CumAdjFactor
  type: FLOAT
  nullable: true
  description: 'CumAdjFactor is a time series of accumulated adjustment factors. The latest value is always 1, and historic
    adjustment factors are accumulated in reverse chronological order. As a result, the most recent AdjFactor = 1 and the
    oldest AdjFactor = 1 multiplied by the product of all adjustment factors. Example: If BASEDATE 30/06/90 EVENT 1 30/06/95
    AdjFactor = 0.5 EVENT 2 30/06/00 AdjFactor = 0.8 EVENT 3 30/06/05 AdjFactor = 1.1 Then CumAdjFactor 30/06/90 – 29/06/95
    = 1 * 0.5 * 0.8 * 1.1 30/06/95 – '
- name: PriceUnitAdjustment
  type: varchar
  nullable: true
  description: PriceUnitAdjustment number of units in the underlying pricing table. A value of E+00 represents a 1:1 unit
    basis. A value of E-02 means the currency is in hundredths. The view automatically performs the currency normalization
    for all prices, e.g. dividing pence by 100 to convert into pounds.
- name: Open_
  type: FLOAT
  nullable: true
  description: Open_ is the opening price for a security on a given date.
- name: High
  type: FLOAT
  nullable: true
  description: High is the high price for the security on a given date or date range.
- name: Low
  type: FLOAT
  nullable: true
  description: Low is the low price for the security on a given date or date range.
- name: Close_
  type: FLOAT
  nullable: true
  description: Close_ is the closing price of the security on the given date.
- name: Bid
  type: FLOAT
  nullable: true
  description: Bid is the bid price for the security on the given date quoted at close of market.
- name: Ask
  type: FLOAT
  nullable: true
  description: Ask is the ask price for the security on the given date quoted at close of market.
- name: VWAP
  type: FLOAT
  nullable: true
  description: VWAP is the volume-weighted average price
- name: Volume
  type: FLOAT
  nullable: true
  description: Volume is the trade volume in shares.
- name: ConsolVol
  type: FLOAT
  nullable: true
  description: ConsolVol is the consolidated volume in shares of the security.
- name: Currency
  type: char(3)
  nullable: true
  description: 'Currency is the ISO Currency Code for the currency upon which the series is calculated. Example Use Case:
    Retrieving the adjusted primary-exchange price history for a security. Example automatically applies price unit adjustment
    of .01 for Pounds/Pence. select InfoCode, DsCode, exchintcode, MarketDate, AdjType, ExchName, Close_, PriceUnitAdjustment
    from vw_Ds2Pricing LSEG Quantitative Analytics Database Schema for Datastream 54 where InfoCode = 48535 -- VODAFONE and
    AdjType = 2 -- split & spinof'

  nullable: true
  description: ClsType1 is the first classification level for a given economic series. Cross-reference ClsType1 with EcoClsCode.ClsID.
- name: ClsType2
  type: INTEGER
  nullable: true
  description: ClsType2 is the economic sub-category of the series. Cross- reference ClsType2 with EcoClsCode.ClsID.
- name: EcoClsLvl1
  type: INTEGER
  nullable: true
  description: EcoClsLvl1 is the HYDRA classification level-1 value. (This field is not currently populated.)
- name: EcoClsLvl2
  type: INTEGER
  nullable: true
  description: EcoClsLvl2is the HYDRA classification level-2value. (This field is not currently populated.)
- name: Desc_English
  type: varchar(1001)
  nullable: true
  description: 'Desc_English is the English language description of the series. NOTE: See also EcoLanguageDesc: Economics
    European Language Series Descriptions on page 50.'

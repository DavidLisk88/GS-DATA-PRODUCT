    oldest AdjFactor = 1 multiplied by the product of all adjustment factors. Example: If BASEDATE 30/06/90 EVENT 1 30/06/95
    AdjFactor = 0.5 EVENT 2 30/06/00 AdjFactor = 0.8 EVENT 3 30/06/05 AdjFactor = 1.1 Then CumAdjFactor 30/06/90 – 29/06/95
    = 1 * 0.5 * 0.8 * 1.1 30/06/95 – '

- name: DsQtName
  type: varchar(91)
  nullable: true
  description: DsQtName is the name of country-level quote identifier.
- name: IsPrimExchQt
  type: char(1)
  nullable: true
  description: IsPrimExchQt indicates whether the quote is a primary exchange-level quote (Y), or is not (N).

  nullable: true
  description: PreDSNumber indicates the previous Datastream number. This
- name: field
  type: is
  nullable: true
  description: unless a series been discontinued, then re-started by a new series. If a new series exists, then this field
    contains the previous series number.
- name: IsForecast
  type: TINYINT
  nullable: true
  description: IsForecast indicates whether the series is a Forecast series (1) or a Historical series (0).
- name: IsKeyIndicator
  type: TINYINT
  nullable: true
  description: IsKeyIndicator indicates whether the series is a Key Indicator (1), or not (0).
- name: MktCode
  type: varchar(3)
  nullable: true
  description: MktCode is the market code. MktCode indicates the geographic location of the economic series. Cross-reference
    MktCode with EcoCode.Code where Type_ = 5.
- name: CurrCode
  type: varchar(3)
  nullable: true
  description: CurrCode is the currency code. CurrCode indicates the currency of the given series. Cross-reference CurrCode
    with EcoCode.Code where Type_ = 3.
- name: AdjCode
  type: char(1)
  nullable: true
  description: AdjCode is the seasonal adjustment indicator. Cross-reference AdjCode with EcoCode.Code where Type_ = 1.
- name: StatCode
  type: varchar(51)
  nullable: true
  description: StatCode indicates the status of the series. Status may be Active, Discontinued, or Deleted. Cross-reference
    StatCode with EcoCode.Code where Type_ = 9.
- name: ScaleCode
  type: varchar(51)
  nullable: true
  description: ScaleCode indicates the unit of scale for the series. Cross- reference ScaleCode with EcoCode.Code where Type_
    = 6.
- name: IsDataSetNational
  type: TINYINT
  nullable: true
  description: IsDataSetNational indicates whether the dataset is from national sources (1), or international sources (0).
- name: SeriesTypeCode
  type: varchar(51)
  nullable: true
  description: SeriesTypeCode indicates if the series is an actual series (ACT) or if the series has been derived (DER). Cross-reference
    SeriesTypeCode with EcoCode.Code where Type_ = 7.
- name: UnitCode
  type: varchar(51)
  nullable: true
  description: UnitCode indicates the unit of a series. For example, UnitCode may indicate that the series is an index, that
    the series is reported as a native currency, or that the series is reported in a unit of measure such as meters, liters,
    or megawatts. Cross- reference UnitCode with EcoCode.Code where Type_ = 10.
- name: FreqCode
  type: varchar(51)
  nullable: true
  description: FreqCode is the frequency code, indicating how often the series is updated. Cross-reference FreqCode with EcoCode.Code
    where Type_ = 4.
- name: SrcCode
  type: varchar(51)
  nullable: true
  description: SrcCode indicates the source of a particular series. Cross- reference SrcCode with EcoCode.Code where Type_
    = 8.
- name: DSLDBCode
  type: varchar(51)
  nullable: true
  description: DSLDBCode is an internal Datastream licensing code. Cross- reference this DSLDBCode with EcoCode.Code where

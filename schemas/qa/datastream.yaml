table: qa_datastream.Ds2Company
domain: pricing
description: Company-level Information | This is an information table for company-level data.
columns:
- name: DsCmpyCode
  type: INTEGER
  nullable: false
  description: DsCmpyCode is the LSEG Quantitative Analytics internal company code.
- name: DsCompCode
  type: varchar(13)
  nullable: true
  description: DsCompCode is the Datastream company code.
- name: DsCmpyName
  type: varchar(91)
  nullable: true
  description: DsCmpyName is the company name.
- name: CmpyCtryCode
  type: varchar(7)
  nullable: true
  description: CmpyCtryCode indicates the country where the company's main activities are. In some cases, this field indicates
    where the prime quote is listed. Ds2Company.CmpyCtryCode cross-references with DS2XRef.Code where Type_ = 1006. To get
    descriptions for the three-letter country codes, cross-reference with DS2XRef.Code where Type_ = 1004.
- name: CmpyCtryType
  type: SMALLINT
  nullable: true
  description: 'CmpyCtryType is the company country type. It may be: – 1 (ISO Region) – (Datastream Region) – 3 (Index Region)
    LSEG Quantitative Analytics Database Schema for Datastream 11'
- name: IndusIsDef
  type: varchar(2)
  nullable: true
  description: IndusIsDef indicates whether an industry code was supplied by Industry Classification Benchmark (ICB). Y indicates
    the code was supplied by ICB; N indicates that it was not.
---
table: qa_datastream.Ds2CtryQtInfo
domain: pricing
description: Country-level Identifiers | This table contains information about country-level identifiers. This table maps
  to the master tables SECMAPX
columns:
- name: InfoCode
  type: INTEGER
  nullable: false
  description: InfoCode is the Quantitative Analytics internal code for Datastream tables. InfoCode is the primary mapping
    code for country-level identifiers. InfoCode cross- references with DS2CtryQtInfo.
- name: DsCode
  type: varchar(13)
  nullable: true
  description: DsCode is the Datastream code.
- name: DsSecCode
  type: INTEGER
  nullable: true
  description: DsSecCode is the Quantitative Analytics internal security code.
- name: Region
  type: varchar(7)
  nullable: true
  description: Region is the region or country code indicating where the security is traded. Cross- reference Region with
    Ds2Region.Region.
- name: RegCodeTypeId
  type: SMALLINT
  nullable: true
  description: 'RegCodeTypeId is the region type code identifier. It may be: – 1 = ISO country code (for example, US = United
    States, NO = Norway) – 2 = Datastream region code (for example, 07 = international) – 3 = index region (for example, AMADVE
    = Advanced Emerging, FTSE index region)'
- name: IsPrimQt
  type: TINYINT
  nullable: true
  description: IsPrimQt flags whether this is the primary country-level quote. This field can have a value of 1 (yes) or 0
    (no).
- name: DsQtName
  type: varchar(91)
  nullable: true
  description: DsQtName contains the name of the name of country-level quote.
- name: DsLocalCode
  type: varchar(13)
  nullable: true
  description: DsLocalCode is the country code combined with the exchange ticker. For example, US:IBM is the U.S. country
    code combined with the exchange ticker for IBM.
- name: DsMnem
  type: varchar(13)
  nullable: true
  description: DsMnem is the Datastream mnemonic for the equity.
- name: CovergCode
  type: char(1)
  nullable: true
  description: 'CovergCode indicates the type of coverage. CovergCode may be: – C (Unlisted Shares) – D (Dead quotes) – E
    (Emerging - Unadjusted prices only) – F (Full Coverage; Research + Company Accounts) – L (Foreign Quotes) – R (Research)
    – W (Temporary/Detached/Dummy/Unlisted security part of index constituents list added by source due to corporate action
    like spin off or demerger.)'
- name: StatusCode
  type: char(1)
  nullable: true
  description: 'StatusCode is the status code indicating the status of the item. StatusCode may be: LSEG Quantitative Analytics
    Database Schema for Datastream 12'
- name: PermID
  type: varchar(11)
  nullable: true
  description: PermID is the permanent country-level ID associated with the item.
- name: TypeCode
  type: varchar(5)
  nullable: true
  description: TypeCode is the code indicating the type of equity. Cross-reference TypeCode with Ds2XRef.Code where Type_
    = 2.
- name: PrimISOCurrCode
  type: char(3)
  nullable: true
  description: PrimISOCurrCode is the three-character primary ISO currency code of the security’s country of origin. Cross-reference
    PrimISOCurrCode with DS2XRef.Code where Type_ = 3.
- name: DelistDate
  type: TIMESTAMP(6)
  nullable: true
  description: DelistDate is the delisting date.
---

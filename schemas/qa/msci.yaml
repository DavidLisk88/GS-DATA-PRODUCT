table: qa_msci.MS2IdxConstDly
domain: risk_models
description: Daily MSCI Index Constituents | This table contains daily MSCI index constituents data. | Unless you are licensed
  for MSCI Deep History, the data in this table is purged on a 13-month rolling basis.
update_cadence: Daily
columns:
- name: MSCICode
  type: INTEGER
  nullable: false
  description: MSCICode is the MSCI index identifier. It is the primary link across all MS2Idx* tables. MSCICode is defined
    in MS2IdxInfo.
- name: SecID
  type: INTEGER
  nullable: false
  description: SecID is the security ID.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: 'If you are licensed for MSCI Deep History content: – StartDate is the date the security became part of the
    index. If you are not licensed for MSCI Deep History content: – If StartDate is more recent than 13 months ago from today
    (the beginning of the daily data rolling window), StartDate is the date the security became part of the index. In this
    scenario, the security joined the index within the current 13-month rolling window. – A StartDate that is older than 13
    months ago from today indicates '
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: When applicable, EndDate is the date the security was removed from the index.
- name: TotIncFactor
  type: FLOAT
  nullable: true
  description: TotIncFactor is the total inclusion factor. This is a derived field created by LSEG Quantitative Analytics.
- name: NextTotIncFactor
  type: FLOAT
  nullable: true
  description: NextTotIncFactor is the next day total inclusion factor.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a bit value that represents the license for this table.
---
table: qa_msci.MS2IdxConstMth
domain: risk_models
description: Monthly MSCI Index Constituents | This table contains monthly MSCI index constituents data. | Unless you are
  licensed for MSCI Deep History, the data in this table is purged on a 7-year rolling basis.
update_cadence: Monthly
columns:
- name: MSCICode
  type: INTEGER
  nullable: false
  description: MSCICode is the MSCI index identifier. It is the primary link across all MS2Idx* tables. MSCICode is defined
    in MS2IdxInfo.
- name: SecID
  type: INTEGER
  nullable: false
  description: SecID is the security ID. LSEG Quantitative Analytics Database Schema for MSCI 10
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: 'This date reflects the last calendar day of the month, and not the last business day. If you are licensed
    for MSCI Deep History content: – StartDate is the date the security became part of the index. If you are not licensed
    for MSCI Deep History content: – If StartDate is more recent than 7 years ago from today (the beginning of the monthly
    data rolling window), StartDate is the date the security became part of the index. In this scenario, the security joined
    the index within the current 7-year '
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: When applicable, EndDate is the date the security was removed from the index. This date reflects the last calendar
    day of the month, and not the last business day.
- name: TotIncFactor
  type: FLOAT
  nullable: true
  description: TotIncFactor is the total inclusion factor.
- name: NextTotIncFactor
  type: FLOAT
  nullable: true
  description: NextTotIncFactor is the next day total inclusion factor.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a bit value that represents the license for this table.
---
table: qa_msci.MS2IdxD
domain: risk_models
description: MSCI Index Date Data | This table contains daily MSCI index date data that changes infrequently. | Unless you
  are licensed for MSCI Deep History, the data in this table is purged on a 13-month rolling basis.
update_cadence: Daily
columns:
- name: MSCICode
  type: INTEGER
  nullable: false
  description: MSCICode is the MSCI index identifier. It is the primary link across all MS2Idx* tables. MSCICode is defined
    in MS2IdxInfo.
- name: Item
  type: INTEGER
  nullable: false
  description: Item is an integer code that represents a data item. Item cross-references with MS2Item and indicates what
    datapoint the record represents.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the date the period begins.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the date the period ends.
- name: Value_
  type: TIMESTAMP(6)
  nullable: true
  description: Value_ is the date information associated with given constraints.
- name: NextValue
  type: TIMESTAMP(6)
  nullable: true
  description: NextValue is the next day value. NULL = Next Day Value not provided. If the value is not changing from one
    day to next, the same value is populated in both the Value_ and NextValue fields.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a bit value that represents the license for this table. LSEG Quantitative Analytics Database Schema
    for MSCI 11
join_hints:
- to: MS2Item
  evidence: Item cross-references with MS2Item and indicates what datapoint the record represents.
  type: cross_reference

table: qa_msci.MS2Item
domain: risk_models
description: MSCI Data Item Descriptions | This table contains the MSCI data items. | Unless you are licensed for MSCI Deep
  History, the data in this table is purged on a 13-month rolling basis. | MS2ItemMap table to indicate the data table. If
  an item has DlyFlg = 1
update_cadence: Daily
columns:
- name: Item
  type: INTEGER
  nullable: false
  description: Item is an integer code that represents a data item. Item indicates what datapoint the record represents.
- name: Mnemonic
  type: varchar(50)
  nullable: true
  description: Mnemonic is the item mnemonic.
- name: Desc_
  type: varchar(75)
  nullable: true
  description: Desc_ is a plain-language description of the mnemonic.
- name: AdjCode
  type: TINYINT
  nullable: true
  description: AdjCode is the adjustment code (Multiplied, Divided, or Unaffected). MS2Item.AjdCode joins with MS2Code.Code
    where Type_ = 2.
- name: FrqFlg
  type: TINYINT
  nullable: true
  description: FrqFlg is a frequency flag and can be – 0 = daily – 1 = periodic This field only applies to items with DlyFlg
    = 1. FrqFlg is used with the MS2ItemMap table to indicate the data table. If an item has DlyFlg = 1 and FrqFlg = 0, it
    is a daily license item that changes daily. If an item has DlyFlg = 1 and FrqFlg = 1, it is a daily license item that
    only changes periodically.
- name: DlyFlg
  type: TINYINT
  nullable: true
  description: DlyFlg is the daily data flag. If DlyFlg = 1, the item is available to clients with a daily license. LSEG Quantitative
    Analytics Database Schema for MSCI 41
- name: MthFlg
  type: TINYINT
  nullable: true
  description: MthFlg is the monthly data flag. If MthFlg = 1, the item is available to clients with a daily or monthly license.
- name: ParentItem
  type: INTEGER
  nullable: true
  description: ParentItem is the parent item populated for next day items.
- name: CorrMnem
  type: varchar(15)
  nullable: true
  description: CorrMnem is the correction mnemonic.
- name: DataTypeCode
  type: TINYINT
  nullable: true
  description: DataTypeCode is the data type code. MS2Item.DataTypeCode joins with MS2Code.Code where Type_ = 3.
- name: DecimalNum
  type: TINYINT
  nullable: true
  description: DecimalNum is the number of decimals for float data.
- name: BoxFlg
  type: TINYINT
  nullable: true
  description: BoxFlg is the boxes/fundamentals data flag.
- name: ACEFlg
  type: TINYINT
  nullable: true
  description: ACEFlg is the ACE (Advance Corporate Event) flag.
- name: SecFlg
  type: TINYINT
  nullable: true
  description: SecFlg is the security-level data flag.
- name: IdxFlg
  type: TINYINT
  nullable: true
  description: IdxFlg is the index-level data flag.
- name: DSFlg
  type: TINYINT
  nullable: true
  description: DSFlg is the Data Set flag and is for LSEG Quantitative Analytics internal use only.
- name: BasicFlg
  type: TINYINT
  nullable: true
  description: BasicFlg is the basic flag.
- name: EnhFlg
  type: TINYINT
  nullable: true
  description: EnhFlg is the enhanced license flag.
- name: LegacyMnem
  type: varchar(30)
  nullable: true
  description: LegacyMnem is the legacy MSCI mnemonic.

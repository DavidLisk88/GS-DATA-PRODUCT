  type: TINYINT
  nullable: true
  description: 'DivDesc is the MSCI dividend description: – 0 = Annual – 1 = Final – 2 = Interim – 3 = Quarterly – 4 = Extra
    – 5 = Monthly – 6 = Regular – 7 = Commemorative This field cross-references with MS2Code.Code where Type_ = 5.'

  type: FLOAT
  nullable: true
  description: AdjGRSDiv is the gross dividend amount of withholding taxes to be reinvested in MSCI Daily Gross Total Return
    Indices.
- name: AdjNETDiv
  type: FLOAT
  nullable: true
  description: AdjNETDiv is the net dividend amount of withholding taxes to be reinvested in MSCI Daily Net Total Return Indices
    for MSCI international indices.
- name: ISOCurrCode
  type: char(3)
  nullable: true
  description: ISOCurrCode is the dividend ISO currency symbol. This field cross- references with MS2Desc.Code where Type_
    = 2.
- name: DivSubUnit
  type: FLOAT
  nullable: true
  description: DivSubUnit is the dividend sub-unit. It indicates whether the dividend amount is expressed for one share (1.000)
    or in lot (0.001); some securities in Brazil are provided in lot of 1000.
- name: DivAdjFactor
  type: FLOAT
  nullable: true
  description: DivAdjFactor is the dividend adjustment factor. It reflects the impact of corporate events on the declared
    dividend amount.
- name: DTRNumShares
  type: FLOAT
  nullable: true
  description: DTRNumShares is the number of shares used in the calculation of the MSCI DTR Indices, as of the dividend ex
    date, minus one.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a bit value that represents the license for this table. LSEG Quantitative Analytics Database Schema
    for MSCI 25

  type: char(8)
  nullable: true
  description: BarraID is the Barra security identifier.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the date the period ends.
- name: ModDate
  type: TIMESTAMP(6)
  nullable: true
  description: ModDate is the date the security information was last modified.
- name: LicFlag
  type: INTEGER
  nullable: true

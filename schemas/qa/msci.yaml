    COMMON, PREFERRED, and UNIT). MS2SecInfo.ShareClassCode joins with MS2Code.Code where Type_ = 8.
- name: ShareTypeCode
  type: TINYINT
  nullable: true
  description: ShareTypeCode is the share type code. It provides information on the sub-category of the security (for example,
    A, B, and H). MS2SecInfo.ShareTypeCode joins with MS2Code.Code where Type_ = 9.
- name: AltListingCode
  type: TINYINT
  nullable: true
  description: AltListingCode is the alternate listing code. It provides information on the listing of the security (for example,
    ADR and GDR). MS2SecInfo.AltListingCode joins with MS2Code.Code where Type_ = 10.

table: qa_msci.MS2IdxInfo
domain: risk_models
description: Current MSCI Index Information | This table contains MSCI index information. | Unless you are licensed for MSCI
  Deep History, the data in this table is purged on a 13-month rolling basis.
update_cadence: Daily
columns:
- name: MSCICode
  type: INTEGER
  nullable: false
  description: MSCICode is the MSCI index identifier. It is the primary link across all MS2Idx* tables.
- name: Name_
  type: varchar(40)
  nullable: true
  description: Name_ is the index name.
- name: ISOCtryCode
  type: char(2)
  nullable: true
  description: ISOCtryCode is the ISO country code. It is a two-digit alphabetic code for country classification. MS2IdxInfo.ISOCtryCode
    joins with MS2Desc.Code where Type_ = 1.
- name: RegCode
  type: char(4)
  nullable: true
  description: RegCode is the region code for regional indexes. MS2IdxInfo.RegCode joins with MS2Desc.Code where Type_ = 3.
- name: RIC
  type: varchar(20)
  nullable: true
  description: RIC is the LSEG Identification Code.
- name: RTTicker
  type: varchar(20)
  nullable: true
  description: RTTicker is the real time ticker.
- name: IdxFam
  type: TINYINT
  nullable: true
  description: IdxFam is the index family. This field cross-references with MS2Code.Code where Type_ = 12.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the date the period ends. This is the date on which an index becomes inactive.
- name: ModDate
  type: TIMESTAMP(6)
  nullable: true
  description: ModDate is the date the index information was last modified.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a bit value that represents the license for this table.
---

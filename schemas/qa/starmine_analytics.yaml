table: qa_starmine_an.SMACAMAm
domain: analytics
description: This table contains StarMine daily CAM Americas data.
update_cadence: Daily
columns:
- name: QuotePermID
  type: BIGINT
  nullable: false
  description: Quote Perm ID
- name: CalcDate
  type: TIMESTAMP(6)
  nullable: false
  description: Date the data was calculated
- name: SecCtryPermID
  type: INTEGER
  nullable: true
  description: Perm ID for the security's country of listing. Cross reference SMACode where CodeType = 2
- name: RegionPermID
  type: INTEGER
  nullable: true
  description: Perm ID for the security's region used in the region rank calculations. Cross reference SMACode where CodeType
    = 1
- name: CAMRegRank
  type: TINYINT
  nullable: true
  description: A 1-100 rank, relative to other firms in the same region, representing the StarMine Combined Alpha Model score
    for a security listing. Higher ranks are more bullish
- name: CAMCtryRank
  type: TINYINT
  nullable: true
  description: 1-100 rank, relative to other firms in the same country, representing the StarMine Combined Alpha Model score
    for a security listing. Higher ranks are more bullish
- name: CAMSectRank
  type: TINYINT
  nullable: true
  description: A 1-100 rank, relative to other firms in the same region and TRBC economic sector. There are ten TRBC economic
    sectors. Higher ranks are more bullish within a given sector Refinitiv Quantitative Analytics - Database Schema for StarMine
    Analytics Version 1.2.1 Page 12 of 26
- name: CAMIndRank
  type: TINYINT
  nullable: true
  description: A 1-100 rank, relative to other firms in the same region and TRBC industry group. There are approximately 53
    TRBC industry groups. Higher ranks are more bullish within a given industry group

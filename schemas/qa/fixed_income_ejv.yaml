- name: SettDate
  type: TIMESTAMP(6)
  nullable: true
  description: SettDate is the date on which the issuer receives payment for the new issue or tap.
- name: WhenIssdTypeCode
  type: char(3)
  nullable: true
  description: WhenIssdTypeCode is a code that specifies the type of when-issued security. FIEJVGovAuc.WhenIssdTypeCode joins
    with FIEJVDesc.Code where Type_ = 79.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs. LSEG Quantitative
    Analytics Database Schema for Fixed Income EJV 21

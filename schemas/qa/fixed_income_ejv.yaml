table: qa_fi_ejv.FIEJVCpnHdr
domain: fixed_income
description: Instrument Coupon Terms | This table contains the coupon terms for an instrument.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: CpnSubTypeCode
  type: varchar(4)
  nullable: true
  description: CpnSubTypeCode is a code representing the type of coupon payment applicable to the security. FIEJVCpnHdr.CpnSubTypeCode
    joins with FIEJVDesc.Code where Type_ = 22.
- name: FrstCpnDate
  type: TIMESTAMP(6)
  nullable: true
  description: FrstCpnDate is the date on which the first coupon payment is made.
- name: LastCpnDate
  type: TIMESTAMP(6)
  nullable: true
  description: LastCpnDate is the last possible reset date for floating rate bonds.
- name: RecDateDays
  type: INTEGER
  nullable: true
  description: RecDateDays is an integer used in conjunction with the record date code. For example, if the record_dt_cd is
    a "...calendar day of month" value and the record date is on the 30th calendar day of the month, 30 would show in this
    field. If the record_dt_cd is a "...calendar day(s) prior" value, then it is an offset from the pay date. For example,
    15 means ”15 calendar days prior to the pay date."
- name: StripCpnFl
  type: TINYINT
  nullable: true
  description: StripCpnFl is a 1/0 flag indicating whether the coupon payments may be "stripped" from the offered security.
    Stripping is the process of LSEG Quantitative Analytics Database Schema for Fixed Income EJV 15
- name: CurrCpnRate
  type: FLOAT
  nullable: true
  description: CurrCpnRate is the effective interest rate for the security, expressed as an annual percentage of face value.
    For preferred stocks, the rate is expressed as a percent of the liquidation preference.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.

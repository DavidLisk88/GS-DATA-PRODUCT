table: qa_fi_ejv.FIEJVPrefrdStk
domain: fixed_income
description: Preferred Stock Information | This table contains information pertaining specifically to preferred stock issues.
  | FIEJVCode table (PreferredStkDFlag) for a complete list of codes.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: AnnlDiv
  type: FLOAT
  nullable: true
  description: AnnlDiv is the last regular annual dividend paid to the stockholder by the company (expressed in currency of
    issue).
- name: AuthorizedShares
  type: INTEGER
  nullable: true
  description: AuthorizedShares is the maximum number of shares of a class or type of security which may be issued by the
    registrant, as authorized by the articles of incorporation of the registrant.
- name: InsIssueDiv
  type: FLOAT
  nullable: true
  description: InsIssueDiv is the initial rate at which earnings are distributed to holders of the offered security.
- name: LiqValue
  type: FLOAT
  nullable: true
  description: LiqValue is the total amount that a stockholder is entitled to receive from the distribution of assets in the
    event of liquidation.
- name: ShrParValue
  type: FLOAT
  nullable: true
  description: ShrParValue is the face value of a security.
- name: ISOCurCode

table: qa_fi_ejv.FIEJVSecIssInfo
domain: fixed_income
description: Security Original Issue Information | This table contains information associated with the original issue of the
  security. | FIEJVCode table (OrigIssDFlag) for a complete list of codes.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: EuroCenBnkCode
  type: char(1)
  nullable: true
  description: 'EuroCenBnkCode is a code representing eligibility for Eurosystem monetary policy operations. Eligible assets
    belong to one of two categories: tier one consists of marketable debt instruments fulfilling uniform euro area-wide eligibility
    criteria specified by the European Central Bank (ECB); tier two consists of additional assets, marketable and non-marketable,
    which are of particular importance to national financial markets and banking systems and for which eligibility criteria
    is established by'
- name: IssYTM
  type: FLOAT
  nullable: true
  description: IssYTM is the calculation that determines rate of the return an investor will receive if a long-term, interest-bearing
    investment is held to its maturity date. The calculation formula includes purchase price, redemption value, time to maturity,
    coupon yield, and the time between interest payments. For floating rate securities, the initial coupon rate is used in
    the calculation.
- name: OverallotDays
  type: INTEGER
  nullable: true
  description: If there is an over-allotment option granted to the underwriters to purchase additional securities, OverallotDays
    is the number of days in which the option is effective.
- name: PrcQuoteConvtCode
  type: varchar(3)
  nullable: true
  description: PrcQuoteConvtCode is a code representing the numeric format in which prices are quoted. FIEJVSecIssInfo.PrcQuoteConvtCode
    joins with FIEJVDesc.Code where Type_ = 53.
- name: PrcQuoteRndCode
  type: varchar(2)
  nullable: true
  description: PrcQuoteRndCode is a code representing the rounding factor or number of decimals retained when calculating
    a price given a yield. FIEJVSecIssInfo.PrcQuoteRndCode joins with FIEJVDesc.Code where Type_ = 62.
- name: SeasngDate
  type: TIMESTAMP(6)
  nullable: true
  description: SeasngDate is the first day that a non-U.S. domestic bond is considered seasoned for trading by U.S. investors.
- name: DebtInsOffrCode
  type: INTEGER
  nullable: true
  description: DebtInsOffrCode is a code representing the nature of the registration. FIEJVSecIssInfo.DebtInsOffrCode joins
    with FIEJVCode.Code where Type_ = 9.
- name: SnrtyCode
  type: varchar(8)
  nullable: true
  description: SnrtyCode is a code representing the debt seniority type. FIEJVSecIssInfo.SnrtyCode joins with FIEJVDesc.Code
    where Type_ = 64. LSEG Quantitative Analytics Database Schema for Fixed Income EJV 34
- name: PurAmtToPub
  type: FLOAT
  nullable: true
  description: PurAmtToPub is the price at which the public may purchase the offered security from the underwriters.
- name: ValuationDateCode
  type: char(2)
  nullable: true
  description: ValuationDateCode is a code representing the values that describe market rules for the setting of a valuation
    date, usually with respect to a trade or settlement date. FIEJVSecIssInfo.ValuationDateCode joins with FIEJVDesc.Code
    where Type_ = 76.
- name: IniPhyFormCode
  type: char(3)
  nullable: true
  description: IniPhyFormCode is a code representing the form in which the security is originally issued. FIEJVSecIssInfo.IniPhyFormCode
    joins with FIEJVDesc.Code where Type_ = 27. BnhmrkAtIssGemId number (38,0) Y Contains the asset_id of the benchmark against
    which the bond was priced at issuance.
- name: AvgLifeAtOffr
  type: FLOAT
  nullable: true
  description: AvgLifeAtOffr is the average number of years the principal of the offered security will be outstanding.
- name: ISOCurCode
  type: char(3)
  nullable: true
  description: ISOCurCode is the currency in which the principal is paid. FIEJVSecIssInfo.ISOCurCode joins with FIEJVDesc.Code
    where Type_ = 23.
- name: DelyDate
  type: TIMESTAMP(6)
  nullable: true
  description: DelyDate is the date on which the securities are delivered by the registrant for payment from the underwriter(s).
    It is also known as the settlement date.
- name: IssPrc
  type: FLOAT
  nullable: true
  description: IssPrc is the price at which the public may purchase the offered security from the underwriters. This price
    is expressed as a percentage of par.
- name: AmtIssd
  type: FLOAT
  nullable: true
  description: AmtIssd is the total amount, exclusive of interest or premium, due to the holder at maturity. This value is
    inscribed on the certificate or instrument.
- name: IssPriISOCtryCode
  type: char(2)
  nullable: true
  description: IssPrilSOCtryCode is the primary country where the security was issued (IsIssuedInPrimary). FIEJVSecIssInfo.IssPriISOCtryCode
    joins with FIEJVDesc.Code where Type_ = 12.
- name: IssDFlag
  type: INTEGER
  nullable: false
  description: IssDFlag is the codified value for the attributes for a security. See the FIEJVCode table (OrigIssDFlag) for
    a complete list of codes.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.

domain: fixed_income
description: Fungible Security Information | This table contains the instrument codes that identify fungible issues and exchange
  offers. | the same terms. See the FIEJVItem table (Item) for a complete list of codes.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: Item
  type: INTEGER
  nullable: false
  description: Item is an item code that identifies if the security is fungible or has already been funged. Fungible securities
    can be combined or exchanged into another security with the same terms. See the FIEJVItem table (Item) for a complete
    list of codes.
- name: GemInstrID
  type: BIGINT
  nullable: false
  description: GemInstrID is the GEM Instrument ID for the respective item.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.

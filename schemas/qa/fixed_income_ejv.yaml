table: qa_fi_ejv.FIEJVPayInKind
domain: fixed_income
description: Pay-in-Kind Security Information | This table contains information specific to pay-in-kind (PIK) securities.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: EffDate
  type: TIMESTAMP(6)
  nullable: false
  description: EffDate is the date on which interest begins to accrue at the cash or PIK rate.
- name: CashRate
  type: FLOAT
  nullable: true
  description: CashRate is the rate of interest that accrues when interest is payable in cash. Usually, the cash rate is the
    same as the coupon rate on the security.
- name: TypeCode
  type: INTEGER
  nullable: true
  description: TypeCode is a code representing the type of security to be distributed to holders in lieu of cash interest
    payments. FIEJVPayInKind.TypeCode joins with FIEJVCode.Code where Type_ = 20.
- name: PIKRate
  type: FLOAT
  nullable: true
  description: PIKRate is the rate of interest accruing when interest is payable in additional securities. Usually, the PIK
    rate is the same as the coupon rate on the security. PIKIssCode number (38,0) Y An identifier assigned to the security
    that is used for the payment of interest/dividends in kind, in lieu of cash. A value may only be updated when PIKRate
    is greater than 0.
- name: IntPayDate
  type: TIMESTAMP(6)
  nullable: true
  description: IntPayDate is the first date on which payment of interest may be made in securities instead of, or in addition
    to, cash.
- name: FrstCashPayDate
  type: TIMESTAMP(6)
  nullable: true
  description: FrstCashPayDate is the first date on which payment of interest may be made in cash instead of, or in addition
    to, additional securities.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.
---

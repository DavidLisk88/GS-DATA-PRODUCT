table: qa_fi_ejv.FIEJVFormula
domain: fixed_income
description: Formula String | This table contains the formula string associated with a formula ID.
update_cadence: Daily, Monday – Friday
columns:
- name: FmlID
  type: INTEGER
  nullable: false
  description: FmlID is a unique formula ID generated by Quantitative Data Warehouse (QDW).
- name: Formula
  type: varchar(max)
  nullable: true
  description: Formula specifies the entire formula. It is calculated by combining the various components of a formula.

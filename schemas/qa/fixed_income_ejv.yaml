table: qa_fi_ejv.FIEJVCpnFltRate
domain: fixed_income
description: Asset Coupon Rates | This table maintains the current and historical coupon rates for those assets that have
  coupons. There will be | may have more than one entry in this table for past rate changes.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in QUANTITATIVE
    DATA WAREHOUSE (QDW) and is not received from the vendor.
- name: EffDate
  type: TIMESTAMP(6)
  nullable: false
  description: EffDate is the date on which interest begins accruing at a specified rate.
- name: CpnRate
  type: FLOAT
  nullable: true
  description: CpnRate is the coupon rate associated with each corresponding date.
- name: NonAnnCpnRate
  type: FLOAT
  nullable: true
  description: NonAnnCpnRate is the non-annual coupon rate. This is used primarily for Italian bonds.

table: qa_fi_ejv.FIEJVEmuRedenom
domain: fixed_income
description: EMU Bond Redenomination Information | This table contains information regarding the redenomination of EMU bonds,
  such as when and by what means
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: RedenomMetcode
  type: char(1)
  nullable: true
  description: RedenomMetcode is a code representing the conversion method for the issue. FIEJVEmuRedenom.RedenomMetcode joins
    with FIEJVCode.Code where Type_ = 7.
- name: GovISOCtryCode
  type: char(2)
  nullable: true
  description: The Governing Law of a bond determines the basis for redenomination. A bond is redenominated depending on the
    Governing Law of the bond, not the currency in which the bond is denominated. If the Governing Law of a bond is from an
    'out' country and the currency is from an 'in' country, the redenomination conventions default to the currency in which
    the bond is denominated. FIEJVEmuRedenom.GovISOCtryCode joins with FIEJVDesc.Code where Type_ = 12.
- name: MinNtcDays
  type: INTEGER
  nullable: true
  description: MinNtcDays is the minimum number of days notice prior to redenomination from NCU into the EURO on or after
    January 01, 1999.
- name: OddLotCode
  type: char(2)
  nullable: true
  description: OddLotCode identifies the method used for the calculation of extraordinary principal repayments ('odd lots')
    associated with EMU Redenomination. FIEJVEmuRedenom.OddLotCode joins with FIEJVDesc.Code where Type_ = 44.
- name: ReconCode
  type: char(2)
  nullable: true
  description: ReconCode is a code representing the method used to reconcile the total issue to the sum of individual issues.
    FIEJVEmuRedenom.ReconCode joins with FIEJVDesc.Code where Type_ = 57.
- name: EffDate
  type: TIMESTAMP(6)
  nullable: true
  description: EffDate is the date on which the redenomination was performed and became effective. Prior to redenomination,
    this field is NULL. The planned future redenomination date can be found in the redenom_target_dt field.
- name: StatusCode
  type: char(1)
  nullable: true
  description: StatusCode is a code representing the status of the EMU redenomination. FIEJVEmuRedenom.StatusCode joins with
    FIEJVDesc.Code where Type_ = 59.
- name: EJVRedenomDate
  type: TIMESTAMP(6)
  nullable: true
  description: EJVRedenomDate is the date the bond is scheduled to be redenominated. Generally, the target date is the same
    as the effective date. However, this is not the case if the bond was redenominated before LSEG had knowledge of the redenomination.
- name: RenomCode
  type: char(1)
  nullable: true
  description: RenomCode is a code representing the method used to renominalize the converted bond par value. FIEJVEmuRedenom.RenomCode
    joins with FIEJVDesc.Code where Type_ = 61.
- name: RndgCode
  type: char(1)
  nullable: true
  description: RndgCode is a code representing the method used to round the calculated Euro amount after conversion. FIEJVEmuRedenom.RndgCode
    joins with FIEJVCode.Code where Type_ = 8.
- name: PriorGemInstrID
  type: BIGINT
  nullable: true
  description: PriorGemInstrID is the previous instrument code that the instrument was exchanged for (WasExchangedFor).
- name: LicFlag
  type: INTEGER
  nullable: true
  description: 'LicFlag is a license flag that identifies to which entitlement package each data row belongs. LSEG Quantitative
    Analytics Database Schema for Fixed Income EJV 48 FIEJV Exotics Tables The following diagram shows the relationships between
    the FIEJV Exotics tables. PK,FK1 InstrCode int PK,FK1 LegNum tinyint PK StartDate int MetCode char(1) ISOCurCode char(3)
    HrdlNtcDaysCode char(3) HrdlNtcDays int DurDaysCode char(3) DurDays int EndDate int NtcDaysCode char(3) NtcDays int PrcCode
    char(1) RedemCode '

table: qa_fi_ejv.FIEJVRng
domain: fixed_income
description: Floating Rate Bond Criteria | This table contains detailed criteria for floating rate bonds, where the coupon
  is determined based on the rate | falling within a certain range. This table is only used for interest legs with coupon
  class range.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: CpnLegNum
  type: TINYINT
  nullable: false
  description: A particular instrument can have multiple coupons. CpnLegNum helps capture this detail. This is derived based
    on the XML feed structure.
- name: RngLegNum
  type: TINYINT
  nullable: false
  description: RngLegNum is a number to differentiate between ranges on the same effective date.
- name: EffDate
  type: TIMESTAMP(6)
  nullable: false
  description: EffDate is the effective date for the range information.
- name: CmplxRngFl
  type: TINYINT
  nullable: true
  description: CmplxRngFl is a 1/0 flag marking the formula_(in out)_rng_id complex.
- name: CpnHolCalCode
  type: varchar(4)
  nullable: true
  description: CpnHolCalCode is a code representing the underlying holiday calendar convention used in determining the condition
    coupon. This is used if the conditional coupon is based on an Index. FIEJVRng.CpnHolCalCode joins with FIEJVDesc.Code
    where Type_ = 35.
- name: CpnInRng
  type: FLOAT
  nullable: true
  description: CpnInRng is a numerical value that describes the paid coupon, if the index is “in” range.
- name: CpnOutOfRng
  type: FLOAT
  nullable: true
  description: CpnOutOfRng is a numerical value that describes the paid coupon, if the index is “out” of range.
- name: RstCalCode
  type: char(3)
  nullable: true
  description: RstCalCode is a code representing the generic calendar position of the condition coupon reset. This is used
    if the conditional coupon is based on an Index. FIEJVRng.RstCalCode joins with FIEJVDesc.Code where Type_ = 8.
- name: RstCalValue
  type: INTEGER
  nullable: true
  description: RstCalValue is a numerical value associated with conditional coupon reset calendar code. This is used if the
    conditional coupon is based on an index.
- name: RstFreqCode
  type: INTEGER
  nullable: true
  description: RstFreqCode is a code representing the frequency of conditional coupon resets. This is used if the conditional
    coupon is based on an index. FIEJVRng.RstFreqCode joins with FIEJVCode.Code where Type_ = 4.
- name: RstDRCCode
  type: varchar(4)
  nullable: true
  description: RstDRCCode is a code specifying the rule if reset of the condition coupon falls on a non-business day. This
    is used if the conditional coupon is based on an index. FIEJVRng.RstDRCCode joins with FIEJVDesc.Code where Type_ = 36.
- name: LwrRngLmt
  type: FLOAT
  nullable: true
  description: LwrRngLmt is a numerical value describing the lower limit of the range.
- name: LwrRngLmtCode
  type: char(2)
  nullable: true
  description: LwrRngLmtCode is a code qualifying the lower range criteria. This is used if the conditional coupon is based
    on an Index. FIEJVRng.LwrRngLmtCode joins with FIEJVDesc.Code where Type_ = 45.
- name: UprRngLmt
  type: FLOAT
  nullable: true
  description: UprRngLmt is a numerical value indicating the upper limit of the range.
- name: UprRngLmtCode
  type: char(2)
  nullable: true
  description: UprRngLmtCode is a code qualifying the upper range criteria. This is used if the conditional coupon is based
    on an Index. FIEJVRng.UprRngLmtCode joins with FIEJVDesc.Code where Type_ = 45.
- name: RngInFmlID
  type: INTEGER
  nullable: true
  description: RngInFmlID is the RngInFormula ID and is populated from the FormulaInfo table, having the respective InstrCode
    and FormulaTypeCode as "Range In Formula". LSEG Quantitative Analytics Database Schema for Fixed Income EJV 66
- name: RngOutFmlID
  type: INTEGER
  nullable: true
  description: RngOutFmlID is the RngOutFormula ID and is populated from the FormulaInfo table, having the respective InstrCode
    and FormulaTypeCode as "Range Out Formula".
- name: RngIdxFmlID
  type: INTEGER
  nullable: true
  description: RngIdxFmlID is populated from the FormulaInfo table, having the respective InstrCode and FormulaTypeCode as
    "Range Index Formula".
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.

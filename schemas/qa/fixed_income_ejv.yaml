  type: varchar(20)
  nullable: true
  description: DataType is the data type for the item such as percentage, money, text, Boolean, numeric, date/time (not the
    SQL data type).
- name: TableName
  type: varchar(20)
  nullable: true
  description: TableName is the name of the data table in which the item is contained. Supplemental Item Descriptions The
    following table provides additional descriptions for some items in the FIEJVItem table. Item Mnemonic Description 3 EJVPartyId
    Internal identifier used to identify organizations. 4 OrganizationFixedIncomeSymbol Internal symbol used to uniquely identify
    each organization. A subsidiary of a parent entity has its own symbol. 5 RdcOrgId Internal identifier used to identify
    organizations. 6 EJVP

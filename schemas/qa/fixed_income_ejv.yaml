  type: TIMESTAMP(6)
  nullable: true
  description: RstDate is the date for which the value was calculated.
- name: CpnRateSrcCode
  type: varchar(3)
  nullable: true
  description: CpnRateSrcCode is a code specifying the source of the rate. Floating rate notes are programmatically calculated
    and are indicated by 'PGM'. FIEJVCpnFltRate.CpnRateSrcCode joins with FIEJVDesc.Code where Type_ = 71.
- name: UnadjRstDate
  type: TIMESTAMP(6)
  nullable: true
  description: UnadjRstDate is the reset date for the new rate, unadjusted by any holiday schedules or business rules.
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.

table: qa_fi_ejv.FIEJVExtcRfx
domain: fixed_income
description: Exotic Bond Refix Data | This table contains data values related to a possible refix of the conversion price
  and ratio of an exotic bond.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: LegNum
  type: TINYINT
  nullable: false
  description: LegNum identifies the segment for which a specific set of convertible terms are contained. A new leg number
    is added each time the key convertible terms of the security change. This is generated within Quantitative Data Warehouse
    (QDW) based on the feed file structure.
- name: EffDate
  type: TIMESTAMP(6)
  nullable: false
  description: EffDate is the date for which the refixed conversion price becomes effective.
- name: CapPrcPct
  type: FLOAT
  nullable: true
  description: CapPrcPct is the maximum to which the conversion price can be refixed. Expressed as a percentage of the prevailing
    conversion price.
- name: DaysCode
  type: char(3)
  nullable: true
  description: DaysCode is a code indicating whether refix condition runs on business or calendar days. FIEJVExtcRfx.DaysCode
    joins with FIEJVDesc.Code where Type_ = 26.
- name: DaysValue
  type: INTEGER
  nullable: true
  description: DaysValue is the number of days for which the refix conditions must be met prior to the setting date.
- name: FlrPrcPct
  type: FLOAT
  nullable: true
  description: FlrPrcPct is the minimum to which the conversion price can be refixed. This value is expressed as a percentage
    of the prevailing conversion price.
- name: RfxHrdlPrcLow
  type: FLOAT
  nullable: true
  description: RfxHrdlPrcLow is the lower reset limit and minimum amount by which the new price must be less than the existing
    or refix_ref_px (refix reference price) in order to trigger the refix. This value is expressed as a price (for example,
    EUR 1).
- name: RfxHrdlPrcHigh
  type: FLOAT
  nullable: true
  description: RfxHrdlPrcHigh is the upper reset limit and maximum amount by which the new price must be more than the existing
    or refix_ref_px (refix reference price) in order to trigger the refix. This value is expressed as a price (for example,
    EUR 1).
- name: Premium
  type: FLOAT
  nullable: true
  description: Premium defines whether the refixed conversion price will be at any premium to the average stock price over
    which the refixed conversion price is fixed. The refix premium is usually zero, but sometimes it is the same as the original
    premium at issue.
- name: RfxRefPrc
  type: FLOAT
  nullable: true
  description: RfxRefPrc is the price that is used to determine whether the underlying asset price has shifted enough to warrant
    a change in the conversion price. A large enough change in the underlying asset price from the reference price triggers
    a change in the conversion price.
- name: SetDate
  type: TIMESTAMP(6)
  nullable: true
  description: SetDate is the date on which the conversion refix terms are set.
- name: RfxTypeCode
  type: char(1)
  nullable: true
  description: RfxTypeCode is a code representing the refix type. FIEJVExtcRfx.RfxTypeCode joins with FIEJVDesc.Code where
    Type_ = 60.
- name: ISOCurCode
  type: char(3)
  nullable: true
  description: ISOCurCode is the currency in which the various amounts are mentioned. LSEG Quantitative Analytics Database
    Schema for Fixed Income EJV 52
- name: LicFlag
  type: INTEGER
  nullable: true
  description: LicFlag is a license flag that identifies to which entitlement package each data row belongs.

- name: IssNameTypeCode
  type: char(3)
  nullable: true
  description: IssNameTypeCode is set to 'LNG'. This value is populated directly from the feed file.
- name: IssNameLangCode
  type: char(2)
  nullable: true
  description: IssNameLangCode is set to 'en'. This value is populated directly from the feed file.
- name: IssClassTypeCode
  type: char(2)
  nullable: true
  description: IssClassTypeCode is set to 'FI'. This value is populated directly from the feed file.
- name: IssSovTypeCode
  type: varchar(4)
  nullable: true
  description: 'This value is populated directly from the feed file. SDI logic for this column is as follows: If asset.sovr_class_cd
    is ''AGNC'', IssSovTypeCode is ''AGCY''. If asset.sovr_class_cd is ''MUNI'', IssSovTypeCode is ''MUN''. If asset.sovr_class_cd
    is ''CTLB'', ''GOVT'', ''PROV'', or ''TREA'', IssSovTypeCode is ''GVSV''. If either asset.convertible_fl = ''y'' or orig_iss_info.instrument_type_cd
    is ''PFDSTK'' or ''TRPFDSEC'', IssSovTypeCode is ''PFDC''. Otherwise, default to ''CORP''.'
- name: IssSubTypeCode
  type: char(3)
  nullable: true
  description: IssSubTypeCode is set to 'UNK'. This value is populated directly from the feed file.
- name: IssSeries
  type: varchar(20)
  nullable: true
  description: IssSeries is the series number (for example, 1998-F). This field may also be used for hybrid securities such
    as MIPPS.
- name: MatDate
  type: TIMESTAMP(6)
  nullable: true
  description: MatDate is the date on which the principal amount of the security becomes due and payable, as stated in the
    terms of the security.
- name: IssStatusCode
  type: varchar(5)
  nullable: true
  description: IssStatusCode is a code representing the status of the security. FIEJVSecInfo.IssStatusCode joins with FIEJVDesc.Code
    where Type_ = 5.
- name: IssStatusEffDate
  type: TIMESTAMP(6)
  nullable: true
  description: IssStatusEffDate is the date for which the status code is effective.

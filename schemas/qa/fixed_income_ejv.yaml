table: qa_fi_ejv.FIEJVCurve
domain: fixed_income
description: Curve Information | This table contains curve information that shows the relationship between the interest rate
  and the time to
update_cadence: Daily, Monday – Friday
columns:
- name: CurveId
  type: INTEGER
  nullable: false
  description: CurveId is a unique EJV system-generated identifier indicating the curve for the benchmark.
- name: AnltyYldCurveFl
  type: TINYINT
  nullable: true
  description: AnltyYldCurveFl is a 1/0 flag indicating whether the analytic yield curve was created by LSEG Evaluated Pricing
    Service.
- name: ISOCtryCode
  type: char(2)
  nullable: true
  description: ISOCtryCode is a code representing the domicile of the issuer for the bonds that make up the curve. FIEJVCurve.ISOCtryCode
    joins with FIEJVDesc.Code where Type_ = 12.
- name: PriCtryFl
  type: TINYINT
  nullable: true
  description: PriCtryFl is a 1/0 flag indicating whether the curve is the primary curve for the country specified by ISOCtryCode.
- name: CompFreqCode
  type: INTEGER
  nullable: true
  description: CompFreqCode is a code representing the frequency used for analytic calculations across the curve. FIEJVCurve.CompFreqCode
    joins with FIEJVCode.Code where Type_ = 4.
- name: CpnTypeCode
  type: varchar(4)
  nullable: true
  description: CpnTypeCode is a code representing the interest payment type applicable to the majority of the bonds for the
    curve. FIEJVCurve.CpnTypeCode joins with FIEJVDesc.Code where Type_ = 21.
- name: ISOCurCode
  type: char(3)
  nullable: true
  description: ISOCurCode is a code representing the currency for the bonds that make up the curve. FIEJVCurve.ISOCurCode
    joins with FIEJVDesc.Code where Type_ = 23.
- name: PriCurFl
  type: TINYINT
  nullable: true
  description: PriCurFl is a 1/0 flag indicating whether the curve is the primary curve for the currency specified by ISOCurCode.
- name: YldCurveCode
  type: char(2)
  nullable: true
  description: YldCurveCode is a code representing the curve classification. FIEJVCurve.YldCurveCode joins with FIEJVDesc.Code
    where Type_ = 24.
- name: YldCurveSubCode
  type: varchar(4)
  nullable: true
  description: YldCurveSubCode is a code used in conjunction with curve_cd to further classify, in terms of market sector,
    the type of underlying instruments that produce the curve. FIEJVCurve.YldCurveSubCode joins with FIEJVDesc.Code where
    Type_ = 25.
- name: YldCurveIndCode
  type: varchar(8)
  nullable: true
  description: YldCurveIndCode is a code identifying the industry of the issuer. FIEJVCurve.YldCurveIndCode joins with FIEJVDesc.Code
    where Type_ = 38.
- name: LongName
  type: varchar(255)
  nullable: true
  description: LongName is the long name for the curve.
- name: ShortName
  type: varchar(20)
  nullable: true
  description: ShortName is the short name for the curve. LSEG Quantitative Analytics Database Schema for Fixed Income EJV
    16
- name: TermCalCode
  type: char(1)
  nullable: true
  description: TermCalCode is a code indicating whether analytic calculations use actual terms (A) or nominal terms (N) across
    the curve. FIEJVCurve.TermCalCode joins with FIEJVDesc.Code where Type_ = 70.
- name: VenCurveId
  type: BIGINT
  nullable: true
  description: VenCurveId is the Curve ID received in the feed.
- name: IsDeleted
  type: TINYINT
  nullable: false
  description: IsDeleted is a (1/0) flag indicating whether the curve has been deleted.
- name: DelDate
  type: TIMESTAMP(6)
  nullable: true
  description: DelDate is the date the curve was deleted (feed date).
- name: DelTime
  type: TIMESTAMP(6)
  nullable: true
  description: DelTime is the time the curve was deleted (feed time).

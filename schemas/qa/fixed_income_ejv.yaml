table: qa_fi_ejv.FIEJVFormulaHdr
domain: fixed_income
description: FRN Formula Components | This table contains the formula components for FRNs in postfix order.
update_cadence: Daily, Monday – Friday
columns:
- name: FmlID
  type: INTEGER
  nullable: false
  description: FmlID is a unique formula ID generated by Quantitative Data Warehouse (QDW).
- name: PayFmlSeqNum
  type: INTEGER
  nullable: false
  description: PayFmlSeqNum is the sequence number of the component.
- name: PayFmlFuncArg
  type: INTEGER
  nullable: true
  description: PayFmlFuncArg is the number of arguments for the function.
- name: PayFmlFuncCode
  type: varchar(10)
  nullable: true
  description: PayFmlFuncCode is a code representing the functions that are legal in formulas. FIEJVFormulaHdr.PayFmlFuncCode
    joins with FIEJVDesc.Code where Type_ = 32.
- name: IdxLkbckNum
  type: INTEGER
  nullable: true
  description: IdxLkbckNum is a code representing the lookbacks used in formulas.
- name: IdxLkbckTypeCode
  type: char(1)
  nullable: true
  description: IdxLkbckTypeCode is a description of index_lb_num. FIEJVFormulaHdr.IdxLkbckTypeCode joins with FIEJVDesc.Code
    where Type_ = 40.
- name: PayFmlIdxName
  type: varchar(20)
  nullable: true
  description: PayFmlIdxName is the short name of the index.
- name: PayFmlNumVal
  type: FLOAT
  nullable: true
  description: PayFmlNumVal is the numeric constant.
- name: PayFmlOperator
  type: varchar(2)
  nullable: true
  description: 'PayFmlOperator is the operator values. For example: +-*/^<> =! <= >='
- name: PayFmlStrg
  type: varchar(512)
  nullable: true
  description: PayFmlStrg is the string constant.
- name: PayFmlTypeCode
  type: varchar(3)
  nullable: true
  description: PayFmlTypeCode is a code representing the types of formula components. LSEG Quantitative Analytics Database
    Schema for Fixed Income EJV 20

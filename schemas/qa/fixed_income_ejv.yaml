table: qa_fi_ejv.FIEJVOrgInfo
domain: fixed_income
description: Asset Issuer Information | This table contains the basic information for the issuer of the asset.
update_cadence: Daily, Monday – Friday
columns:
- name: OrgCode
  type: INTEGER
  nullable: false
  description: OrgCode is a unique integer code that identifies an organization. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: AddTypeCode
  type: char(3)
  nullable: true
  description: AddTypeCode is set to 'HEA'.
- name: AddLine1
  type: varchar(255)
  nullable: true
  description: AddLine1 is the current address of the organization's principal executive offices.
- name: City
  type: varchar(60)
  nullable: true
  description: City is the current city of the organization's principal executive offices.
- name: Region
  type: varchar(80)
  nullable: true
  description: Region is the current state, province, or region of the organization's principal executive offices.
- name: PostCode
  type: varchar(10)
  nullable: true
  description: PostCode is the current post code of the organization's principal executive offices.
- name: ISOCtryCode
  type: char(2)
  nullable: true
  description: ISOCtryCode is a code representing the current country of the organization's principal executive offices. FIEJVOrgInfo.ISOCtryCode
    joins with FIEJVDesc.Code where Type_ = 12.
- name: PhoneNum
  type: varchar(20)
  nullable: true
  description: PhoneNum is the current telephone number, including area code, of the organization's principal executive offices.
- name: URL
  type: varchar(100)
  nullable: true
  description: URL is the Internet address for the party.
- name: OrgIncorpYr
  type: INTEGER
  nullable: true
  description: OrgIncorpYr is the year in which the company received its state charter allowing it to operate as a corporation.
    If the year of incorporation is not disclosed, or if the company is not a corporation, then this is the year in which
    the company was formed.
- name: PubPriFl
  type: TINYINT
  nullable: true
  description: PubPriFl is a 1/0 flag indicating whether the registrant is privately owned.
- name: OrgActiveFl
  type: TINYINT
  nullable: true
  description: OrgActiveFl indicates whether a GovCorp party still exists as a company. 1 = Active, 2 = Inactive.
- name: FiscalYrEnd
  type: varchar(6)
  nullable: true
  description: FiscalYrEnd is the date that marks the end of a company’s annual accounting period, when the books are closed
    and profit or loss is determined.
- name: OrgTypeCode
  type: varchar(5)
  nullable: true
  description: 'In Quantitative Data Warehouse (QDW), this value is populated directly from SDI. In SDI the logic is as follows:
    If party.indu_sector_cd = ''SPRA'', the OrgTypeCode is ''SUPN''. Else, if party.sovr_class_cd = ''GOVT'', ''MUNI'', ''PROV'',
    or ''TREA'', the OrgTypeCode is ''GVT''. Else, if party.sovr_class_cd = ''AGNC'', the OrgTypeCode is ''GVTOC''. LSEG Quantitative
    Analytics Database Schema for Fixed Income EJV 25'
- name: OrgSubTypeCode
  type: varchar(5)
  nullable: true
  description: If party.sovr_class_cd = 'CTLB', the OrgSubTypeCode is 'CBNK'. Else, if party.sovr_class_cd = 'MUNI', the OrgSubTypeCode
    is 'LGVT'. Else, if party.sovr_class_cd = 'PROV', the OrgSubTypeCode is 'SPGVT'. Otherwise, OrgSubTypeCode is NULL. FIEJVOrgInfo.OrgSubTypeCode
    joins with FIEJVDesc.Code where Type_ = 67.
- name: AcctOrgID
  type: BIGINT
  nullable: true
  description: AcctOrgID is the identifier for the current accountant representing the organization.
- name: IncISOCtryCode
  type: char(2)
  nullable: true
  description: IncISOCtryCode is the country in which the organization received its charter allowing it to operate as a corporation.
    If the country of incorporation is not disclosed, or if the company is not a corporation, then this is the country in
    which the company was formed. FIEJVOrgInfo.IncISOCtryCode joins with FIEJVDesc.Code where Type_ = 12.
- name: CurImmParOrgID
  type: BIGINT
  nullable: true
  description: An immediate parent is a company that owns or controls the issuer through the ownership of greater than 50%
    of the voting stock.
- name: CurUltParOrgID
  type: BIGINT
  nullable: true
  description: An ultimate parent is a company that owns or controls the immediate parent through the ownership of greater
    than 50% of the voting stock.
- name: GemOrgID
  type: BIGINT
  nullable: true
  description: GemOrgID is a unique GEM Perm ID attributed to an organization.
- name: IsDeleted
  type: TINYINT
  nullable: false
  description: IsDeleted is a 1/0 flag indicating if the organization has been deleted.
- name: DelDate
  type: TIMESTAMP(6)
  nullable: true
  description: DelDate is the date the organization was deleted (feed date).
- name: DelTime
  type: TIMESTAMP(6)
  nullable: true
  description: DelTime is the time the organization was deleted (feed time).

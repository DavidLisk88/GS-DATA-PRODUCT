table: qa_fi_ejv.FIEJVPrcDly
domain: fixed_income
description: Composite Pricing Information | This table contains composite pricing information for a particular security.
  | Price Source. See the FIEJVPRCCode table (License Flag) for complete list
update_cadence: Daily
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor. GEMInstrId is the logical key used to generate InstrCode.
- name: TradeDate
  type: TIMESTAMP(6)
  nullable: false
  description: TradeDate is the date on which the contributor or exchange quoted the price of the security.
- name: PrcSrcCode
  type: varchar(3)
  nullable: true
  description: PrcSrcCode is the code indicating the contributor or exchange that quotes the pricing value of the security.
    FIEJVPrcDly.PrcSrcCode joins with FIEJVDesc.Code where Type_ = 77. PrcSrcCode cross-references with FIEJVPrcDesc on FIEJVPrcDesc.Code
    = FIEJVPrcDly.PrcSrcCode where Type_ = 1.
- name: Prc
  type: FLOAT
  nullable: true
  description: Prc is the price quoted for the security.
- name: DebtIsoCurCode
  type: char(3)
  nullable: true
  description: DebtIsoCurCode is the code representing the primary currency of the issue. FIEJVPrcDly.DebtIsoCurCode joins
    with FIEJVDesc.Code where Type_ = 23.
- name: PrcgMetCode
  type: varchar(2)
  nullable: true
  description: PrcgMetCode is the code indicating the ask and/or bid value for the security. FIEJVPrcDly.PrcgMetCode joins
    with FIEJVPrcDesc.Code where Type_ = 4.
- name: MatCorpYld
  type: FLOAT
  nullable: true
  description: 'If price source equals the LSEG Composite, MatCorpYld represents the annual yield as defined by ISMA. Otherwise,
    MatCorpYld is the corporate bond equivalent cash-flow yield using the cash flow assumptions described as follows: the
    average life of the security, calculated with the cash-flow assumption that corporate and government securities trade
    to maturity. LSEG Quantitative Analytics Database Schema for Fixed Income EJV 70'
- name: WrstCorpYld
  type: FLOAT
  nullable: true
  description: 'If price source equals the LSEG Composite, WrstCorpYld represents the annual yield to worst defined by ISMA.
    Otherwise, WrstCorpYld is the corporate bond equivalent cash-flow yield using the cash-flow assumptions described as follows:
    the average life, computed using cash-flow assumptions that represent expected outcome. LSEG determines the worst sinking
    fund and call, and the best put.'
- name: MatStdYld
  type: FLOAT
  nullable: true

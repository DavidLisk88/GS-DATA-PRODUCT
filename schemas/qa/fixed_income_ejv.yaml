table: qa_fi_ejv.FIEJVGovAuc
domain: fixed_income
description: Government Treasury Securities Information | This table contains information on securities issued by a government
  treasury.
update_cadence: Daily, Monday – Friday
columns:
- name: InstrCode
  type: INTEGER
  nullable: false
  description: InstrCode is a unique integer code that identifies an instrument. This integer code is defined in Quantitative
    Data Warehouse (QDW) and is not received from the vendor.
- name: IssDate
  type: TIMESTAMP(6)
  nullable: false
  description: IssDate is the date on which the security was issued via an auction process. It is used for Treasury securities.
- name: AnnDate
  type: TIMESTAMP(6)
  nullable: true
  description: AnnDate is the date on which information was announced pertaining to an upcoming auction of Treasury securities.

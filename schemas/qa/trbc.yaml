table: qa_trbc.RDCOrgInfo
domain: reference
description: Organization Information | This table contains information for organizations of interest in the capital markets.
update_cadence: Full refresh is available weekly. Incremental updates from RDC are available every 15 minutes.
columns:
- name: OrgId
  type: INTEGER
  nullable: false
  description: OrgId is the permanent identifier of the organization.
- name: ComName
  type: varchar(110)
  nullable: true
  description: ComName is the name of the organization in mixed case, manually limited to 80 characters to meet OptionX requirements.
    The organization’s legal name is used to populate this field when the legal name does not exceed 80 characters.
- name: LegalName
  type: varchar(255)
  nullable: true
  description: LegalName is the fully registered legal name of the company, or the official name of the institution.
- name: ShortName
  type: varchar(40)
  nullable: true
  description: ShortName is the short name of the organization in mixed case (unless it is a recognized acronym entered in
    uppercase, such as IBM for International Business Machines Corp), manually limited to a maximum of 16 characters.
- name: OrgStatus
  type: char(2)
  nullable: true
  description: 'OrgStatus is the role-to-issue status of the organization. It can have the following values: – AC = Active
    – DC = Inactive Values are to be populated automatically, according to the type of organization. Values are never populated
    or maintained manually.'
- name: ContriCode
  type: varchar(20)
  nullable: true
  description: ContriCode is the code used to identify organizations contributing data (usually quotes) to the real-time Integrated
    Data Network. (IDN). RDCOrgInfo.ContriCode cross-references with RDCDesc.Code where Type_ = 27035.
- name: ContriTypeCode
  type: char(3)
  nullable: true
  description: ContriTypeCode is the classifier of the contributing organization. ContriTypeCode can be bank or broker. RDCOrgInfo.ContriTypeCode
    cross-references with RDCDesc.Code where Type_ = 110661.
- name: ClSiteLocCode
  type: varchar(20)
  nullable: true
  description: ClSiteLocCode uniquely identifies the contributor. The code is comprised of the country code, followed by a
    generated sequence number of the contributor in that country. RDCOrgInfo.ClSiteLocCode cross-references with RDCDesc.Code
    where Type_ = 114785.
- name: CntryHQISOCode
  type: char(3)
  nullable: true
  description: CntryHQISOCode is the geographical headquarters of the organization. RDCOrgInfo.CntryHQISOCode cross-references
    with RDCDesc.Code where Type_ = 27165.
- name: CntryOfIncCode
  type: char(3)
  nullable: true
  description: CntryOfIncCode is the country in which the party received its charter, allowing it to operate as a corporation.
    If the country of incorporation is not disclosed, or if the company is not a corporation, then this would be populated
    the same as the current country or where the company was formed. RDCOrgInfo.CntryOfIncCode cross-references with RDCDesc.Code
    where Type_ = 30986.
- name: ISOCurrCode
  type: char(3)
  nullable: true
  description: ISOCurrCode is the currency of record of the fund entity. RDCOrgInfo.ISOCurrCode cross-references with RDCDesc.Code
    where Type_ = 80867.
- name: OrgTypeCode
  type: varchar(5)
  nullable: true
  description: OrgTypeCode is described in the OrgTypeCode section on page 8.
- name: DFlag
  type: INTEGER
  nullable: true
  description: 'DFlag stores a bitmasked combination for the IsContributor, IsExch, and IsFundSupCmp data items. OrgTypeCode
    is the organization type. It can be: Code Description CO Corporation FD Fund GA Government Agency GP State & Provincial
    GT Government SP Supranational CF Closed End Fund (not used) OF Open End Fund (not used) NC Not Categorized PC Private
    Corporation 2. The Reference Business Classification (TRBC) Tables RDCTRBCAudit: TRBC Audit Trail 9 Code Description CTLB
    Central Bank MUNI Municipal TR'

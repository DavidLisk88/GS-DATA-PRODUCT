table: qa_trbc.RDCCode
domain: reference
description: Numeric Codes | This table contains descriptions of Reference Data Convergence (RDC) numeric codes.
update_cadence: Full refresh is available weekly. Incremental updates from RDC are available every 15 minutes.
columns:
- name: Type_
  type: INTEGER
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: INTEGER
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(255)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code.

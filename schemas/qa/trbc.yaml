- name: CntryOfIncCode
  type: char
  nullable: true
  description: CntryOfIncCode is the country in which the party received its charter, allowing it to operate as a corporation.
    If the country of incorporation is not disclosed, or if the company is not a corporation, then this would be populated
    the same as the current country or where the company was formed.
- name: CntryOfInc
  type: varchar
  nullable: true
  description: The description of CntryOfIncCode.
- name: ISOCurrCode

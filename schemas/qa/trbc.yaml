table: qa_trbc.RDCOrgAddr
domain: reference
description: Address and Contact Information | This table contains the address and contact information of an organization.
update_cadence: Full refresh is available weekly. Incremental updates from RDC are available every 15 minutes.
columns:
- name: OrgId
  type: INTEGER
  nullable: false
  description: OrgId is the permanent identifier of the organization.
- name: AddrTypeCode
  type: char(2)
  nullable: true
  description: 'AddrTypeCode is the address type of the organization. AddrTypeCode can be: – TR = Trading – MK = Marketing
    – RG = Registered – HQ = Headquarters RDCOrgAddr.AddrTypeCode cross-references with RDCDesc.Code where Type_ = 80948.'
- name: EmailId
  type: varchar(255)
  nullable: true
  description: EmailId is the e-mail address of the organization.
- name: FaxNo
  type: varchar(75)
  nullable: true
  description: FaxNo is the fax number.
- name: IndiEmailId
  type: varchar(255)
  nullable: true
  description: IndiEmailId is the e-mail address of the individual.
- name: IndiFaxNo
  type: varchar(75)
  nullable: true
  description: IndiFaxNo is the fax number of the individual.
- name: IndiName
  type: varchar(110)
  nullable: true
  description: IndiName is the contact name of the individual.
- name: IndiTelNo
  type: varchar(75)
  nullable: true
  description: IndiTelNo is the telephone number of the individual.
- name: PostalCode
  type: varchar(10)
  nullable: true
  description: PostalCode is the first line of an address, excluding county, zip code, and country.
- name: StateCntry
  type: varchar(90)
  nullable: true
  description: StateCntry is the state or country in the address.
- name: StrAddr
  type: varchar(255)
  nullable: true
  description: StrAddr is the first line of an address, excluding county, zip code, and country.
- name: CityTown
  type: varchar(90)
  nullable: true
  description: CityTown is the city or town of an address.
- name: TelNo
  type: varchar(75)
  nullable: true
  description: TelNo is the telephone number.
- name: TollFreeNo
  type: varchar(75)
  nullable: true
  description: TollFreeNo is the toll free number of the organization.
- name: WebAddr
  type: varchar(255)
  nullable: true
  description: WebAddr is the organization’s Web site.
join_hints:
- to: RDCDesc
  evidence: 'AddrTypeCode can be: – TR = Trading – MK = Marketing – RG = Registered – HQ = Headquarters RDCOrgAddr.AddrTypeCode
    cross-references with RDCDesc.Code where Type_ = 80948.'
  type: cross_reference

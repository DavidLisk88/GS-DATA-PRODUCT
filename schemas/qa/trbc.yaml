table: qa_trbc.OrgID
domain: reference
columns:
- name: OrgId
  type: INTEGER
  nullable: false
  description: OrgId is the permanent identifier of the organization.
- name: CommonName
  type: varchar
  nullable: true
  description: CommonName is the name of the organization in mixed case, manually limited to 80 characters to meet OptionX
    requirements. The organization’s legal name is used to populate this field when the legal name does not exceed 80 characters.
- name: LegalName
  type: varchar
  nullable: true
  description: LegalName is the fully registered legal name of the company, or the official name of the institution.
- name: ShortName
  type: varchar
  nullable: true
  description: ShortName is the short name of the organization in mixed case (unless it is a recognized acronym entered in
    uppercase, such as IBM for International Business Machines Corp), manually limited to a maximum of 16 characters.
- name: orgStatus
  type: varchar
  nullable: true
  description: 'OrgStatus is the role-to-issue status of the organization. It can have the following values: • AC = Active
    • DC = Inactive. Values are to be populated automatically, according to the type of organization. Values are never populated
    or maintained manually.'
- name: CntryHQISOCode
  type: char
  nullable: true
  description: CntryHQISOCode is the geographical headquarters of the organization.
- name: CntryHQ
  type: varchar
  nullable: true

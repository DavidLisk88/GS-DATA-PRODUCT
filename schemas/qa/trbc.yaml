- name: ActLongDesc
  type: varchar
  nullable: true
  description: 'LongDesc is the long description for each item (Activity level). Example Use Case: --This query shows the
    TRBC history for QAID @HONDA9 select aa.*, cc.* from vw_SecurityMasterX aa LSEG Quantitative Analytics TRBC 16 join vw_TRBCMapping
    bb on bb.seccode = aa.seccode and bb.typ = aa.typ join vw_TRBCHistory cc on cc.OrgId = bb.OrgID where aa.id = ''@HONDA9''
    order by cc.StartDate'

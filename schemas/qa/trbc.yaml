- name: OrgType
  type: varchar
  nullable: true
  description: 'The description of OrgTypeCode. Example Use Case: --This query shows the basic information for Microsoft select
    aa.*, cc.* from vw_SecurityMasterX aa join vw_TRBCMapping bb on bb.seccode = aa.seccode and bb.typ = aa.typ LSEG Quantitative
    Analytics TRBC 17 join vw_TRBCOrgInfo cc on cc.OrgId = bb.OrgID where aa.id = ''MSFT'''

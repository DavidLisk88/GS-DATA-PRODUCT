table: qa_wscope.Wsitem
domain: fundamentals
description: Worldscope Data Items | This table contains information on Worldscope data items. | field corresponds to the
  table where the data is stored. For example,
update_cadence: Daily
columns:
- name: Number
  type: INTEGER
  nullable: false
  description: Number cross-references with all Ws*DATA tables where Number = Ws*data.Item.
- name: Name
  type: varchar(55)
  nullable: true
  description: Name is the name of the data item.
- name: Frequency
  type: varchar(1)
  nullable: true
  description: 'Frequency may be: • C: Current, meaning this item represents a current value • H: Historical, meaning this
    item is available on a historical basis'
- name: DataType
  type: varchar(1)
  nullable: true
  description: 'DataType may be: • A: Data item is Alphanumeric. • N: Data item is Numeric. Chapter 3: Wordscope Schema: Data
    Tables Refinitiv Quantitative Analytics - Database Schema for Worldscope Version 1.2.5 Page 15 of 28'
- name: Length_
  type: SMALLINT
  nullable: true
  description: Length_ represents the string length and is applicable for a DataType of A.
- name: QType
  type: varchar(1)
  nullable: true
  description: 'QType is the designation assigned to the data item by Refinitiv. This a QType of N indicates that the data
    item is Numeric and is found in the Wsndata table. QType may be: • A: Alphanumeric (Wssdata, Wsmdata, Wsldata, Wsxdata,
    and depends on Length_) • D: Date (Wsddata) • F: Flag (Wsfnote) • I: Integer (Wsidata) • N: Numeric (Wsndata)'
- name: SplitFlag
  type: varchar(1)
  nullable: true
  description: SplitFlag indicates whether the operation performed to adjust the data is multiplication or division. A star
    character (“*”) indicates multiplication; a slash character (“/”)indicates division.
- name: Industry
  type: varchar(6)
  nullable: true
  description: 'This field indicates the industry category using 0 and/or 1 to indicate the industry out of 6 possibilities.
    Reading the values listed below from left to right: Industrial farthest on the left and Other Financial farthest right.
    Examples: • An Industry of ''111'' means it is available in Industrial, Utility, and Transportation. • An Industry of
    ''000101'' means it is available in Bank and Other Financial. Position 1 = INDUSTRIAL Position 2 = UTILITY Position 3
    = TRANSPORTATION Position 4 = BANK Posi'
- name: Units
  type: TINYINT
  nullable: true
  description: 'Units may be: • The item is U.S. dollar denominated (0) • The item is non-U.S. dollar denominated (1)'
- name: RefSect
  type: varchar(1)
  nullable: true
  description: RefSect cross-references with Wscode where RefSect = WSCODE.Section_.
- name: RefNumb
  type: INTEGER
  nullable: true
  description: 'RefNumb cross-references with Wscode and Wstext depending on whether the QType is A, N, or I. For example,
    QTypes of N or I cross-reference with Wscode where RefNumb = Wscode.Field and RefSect = Wscode.Section_. Chapter 3: Wordscope
    Schema: Data Tables Refinitiv Quantitative Analytics - Database Schema for Worldscope Version 1.2.5 Page 16 of 28'
- name: Table_
  type: varchar(1)
  nullable: true
  description: 'Table_ associates the data item with a specific Ws*data table. Table_ may be: • D: Wsddata • I: Wsidata •
    L: Wsldata • M: Wsmdata • N: Wsndata • S: Wssdata • X: Wsxdata'
- name: UsBasis
  type: varchar(1)
  nullable: true
  description: UsBasis indicates whether the item is on a United States calendar basis (C) or a United States fiscal basis
    (F).
- name: NonUsBasis
  type: varchar(1)
  nullable: true
  description: NonUsBasis indicates whether the item is on a Non-United States calendar basis (C) or Non-United States fiscal
    basis (F).
- name: Month_
  type: TINYINT
  nullable: true
  description: Month_ indicates the calendar month, denoted by 1 (for January) through 12 (for December). A Month_ value of
    0 indicates that Month_ is not applicable to the data item.
join_hints:
- to: Wscode
  evidence: RefNumb int Y RefNumb cross-references with Wscode and Wstext depending on whether the QType is A, N, or I.
  type: cross_reference

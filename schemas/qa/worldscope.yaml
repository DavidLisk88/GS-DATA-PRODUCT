columns:
- name: code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all Worldscope (Ws*) tables.
- name: item
  type: INTEGER
  nullable: false
  description: item cross-references with all Ws*DATA tables where item = Ws*data.Item.
- name: Freq
  type: Varchar(1)
  nullable: false
  description: Freq describes the periodicity of the data item, as described in “Quantitative Analytics Database Schema -
    Worldscope” eg ‘A’ means annual, ‘Q’ means quarterly, ‘C’ means current etc
- name: year_
  type: SMALLINT
  nullable: false
  description: Year_ represents the fiscal year for the period end date or reference observation period.
- name: seq
  type: SMALLINT
  nullable: false
  description: Seq represents the order of Item + Freq where Item and Freq are constant fiscalPeriodEndDate smalldatetim e
    Y fiscalPeriodEndDate contains the month, day and year on which the company's fiscal period ended epsReportDate smalldatetim
    e Y epsReportDate represents the source date for the earnings reported by the company for the corresponding
- name: periodUpdateFlag
  type: varchar(12)
  nullable: true
  description: 'periodUpdateFlag is a code for the periodUpdateDescription, below. It can be: 1. Preliminary 2. FAST 3. Final
    4. Only Specified Unconsolidated Data Fields are available. 5. Preliminary – Flash 6. Final – Flash varchar(120) Y periodUpdateDescription
    indicates the status of data provided in the annual and interim time series, as detailed in "Worldscope Data Definition
    Guide".'
- name: currencyOfDocument
  type: varchar(12)
  nullable: true
  description: 'currencyOfDocument represents the ISO currency code in which the company''s financial statements are filed.
    currencyOfDocument is not the currency used to represent the data in Worldscope Chapter 4: SQL Views Refinitiv Quantitative
    Analytics - Database Schema for Worldscope Version 1.2.5 Page 26 of 28'
- name: periodSource
  type: varchar(3)
  nullable: false
  description: periodSource indicates time series which have had data sourced from the Refinitiv Financials product. An item
    meeting this criterion will have ‘RKD’ in this field; otherwise it will have ‘WS’
- name: rate
  type: FLOAT
  nullable: true
  description: rate is the exchange rate from the Worldscope currency to the currency of document
- name: reportedValue
  type: FLOAT
  nullable: true
  description: Value_ is the value of the specified item in the currency of document rather than the Worldscope currency (This
    WSItemDataVw and dividing by rate)
- name: itemUnits
  type: Varchar(9)
  nullable: true
  description: 'units describes the units this item is stored in and can be: • ‘Shares’ • ‘Persons’ • currency eg ‘USD’ •
    currency per share eg ‘CHF/share’ Note: This is the currency of document above, not the Worldscope currency Example Use
    Case: m.id as qaID,m.sedol,m.name,d.fiscalPeriodEndDate,d.epsReportDate,d.periodUpdateFlag,d.periodU pdateDescription,
    d.currencyOfDocument,d.periodSource,d.rate,d.reportedValue,d.itemUnits from vw_SecurityMasterX m join vw_WsCompanyMapping
    w on w.code = m.seccode and w.typ'

    currency per share eg ‘CHF/share’ Note: This is the Worldscope currency, not the currency of document, above Example Use
    Case: m.id as qaID,m.sedol,m.name,d.fiscalPeriodEndDate,d.epsReportDate,d.periodUpdateFlag,d.periodU pdateDescription,
    d.currencyOfDocument,d.periodSource,d.Value_,d.itemUnits from vw_SecurityMasterX m join vw_WsCompanyMapping w on w.code
    = m.seccode and w.type_ = m.typ le'
- name: code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all Worldscope (Ws*) tables.
- name: WsId
  type: varchar(9)
  nullable: false
  description: WsId is the Worldscope unique identifier. This ID does not change.
- name: Sedol
  type: varchar(6)
  nullable: true
  description: Sedol is the entity Sedol identifier.
- name: Cusip
  type: varchar(8)
  nullable: true
  description: Cusip is the entity CUSIP identifier.
- name: companyName
  type: Varchar(152)
  nullable: true
  description: companyName is the entity name.
- name: worldscopeNationCode
  type: INTEGER
  nullable: true
  description: NATION CODE represents the country under which the company is followed on Worldscope. The currency of analysis
    is the currency of the nation indicated by NATION CODE. NATION CODE usually corresponds to the country of domicile but
    there are some exceptions.
- name: nationCodeDescription
  type: Varchar(30)
  nullable: true
  description: nationCodeDescription is the name of the country name of this company
- name: worldscopeCurrency
  type: Varchar(3)
  nullable: true
  description: worldscopeCurrency is the ISO code of the country’s current currency.
- name: icbIndustryDescription
  type: Varchar(120)
  nullable: true
  description: icbIndustryDescription gives the text corresponding to the icbIndustryId eg 0001 is “Oil & Gas”
- name: icbIndustryId
  type: INTEGER
  nullable: true
  description: The industry code is the highest level in the hierarchical structure. on Varchar(120) Y icbSuperSectorDescription
    gives the text corresponding to the icbSuperSector eg 0500 is “Oil & Gas”
- name: icbSuperSectorId
  type: INTEGER
  nullable: true
  description: 'The SuperSector code is the second highest level in the hierarchical structure. Chapter 4: SQL Views Refinitiv
    Quantitative Analytics - Database Schema for Worldscope Version 1.2.5 Page 24 of 28'
- name: icbSectorDescription
  type: Varchar(120)
  nullable: true
  description: icbSectorDescription gives the text corresponding to the icbSector eg 0530 is “Oil & Gas Producers”
- name: icbSectorId
  type: INTEGER
  nullable: true
  description: The Sector code is the second lowest level in the hierarchical structure. n Varchar(120) Y icbSubSectorDescription
    gives the text corresponding to the icbSubSector eg 0533 is “Exploration & Production”
- name: icbSubSectorId
  type: INTEGER
  nullable: true
  description: The SubSector code is the lowest level in the hierarchical structure.
- name: active
  type: INTEGER
  nullable: false
  description: 'the active field represents whether a company is active. Can be: • 0: a company that became privately held,
    merged, liquidated, or otherwise became inactive. • 1: an active company'
- name: dataSource
  type: varchar(3)
  nullable: false
  description: 'dataSource indicates time series which have had data sourced from the Refinitiv Financials product. A company
    meeting this criterion will have ‘RKD’ in this field; otherwise it will have ‘WS’ Example Use Case: wsid, Sedol, Cusip,
    companyName, worldscopeNationCode, nationCodeDescription, worldscopeCurrency, icbIndustryDescription, icbIndustryId, icbSuperSectorDescription,
    icbSuperSectorId, icbSectorDescription, icbSectorId, icbSubSectorDescription, icbSubSectorId, active,dataSource from vw_WsComp'

table: qa_idc_global.Gprcret
domain: pricing
description: Global Pricing Total Returns | This table stores composite total returns values.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: Date_
  type: smalldatetime
  nullable: false
  description: Date_ is the date associated with TotRet.
- name: TotRet
  type: FLOAT
  nullable: true
  description: TotRet is the gross total return as a percent of the first close price. It is an index starting at 100 from
    the IPO date or, if the company history goes beyond the date the data has been stored, it is 100 from the point at which
    the data starts in the MQA database. TotalRet takes into account price movement, dividends, spin-offs, and takeovers.

- name: LastCumCurr
  type: SMALLINT
  nullable: true
  description: LastCumCurr represents the mid price (for UK securities) or the closing/last-traded price (for non-UK securities)
    quoted immediately prior to the capital change effective date, and the currency code. Cross-reference LastCumCurr with
    Gprccode where LastCumCurr = Gprccode.Code and Gprccode.Type_ = 6.
- name: FirstExPrice
  type: FLOAT
  nullable: true
  description: FirstExPrice represents the mid price (for UK securities) or the closing/last-traded price (for non-UK securities)
    quoted immediately prior to the capital change effective date, and the currency code.
- name: FirstExCurr
  type: SMALLINT
  nullable: true
  description: FirstExCurr represents the mid price (for UK securities) or the closing/last-traded price (for non-UK securities)

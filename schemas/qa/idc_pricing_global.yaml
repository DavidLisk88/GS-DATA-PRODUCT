  type: SMALLINT
  nullable: true
  description: TotDivCurr is the currency code associated with TotDiv. Cross- reference TotDivCurr with Gprccode where TotDivCurr
    = Gprccode.Code and Gprccode.Type_ = 6.
- name: TotDivMarker
  type: varchar(1)
  nullable: true
  description: TotDivMarker provides information on the company’s estimated total annual dividend. This marker specifies which
    dividend amount is used and identifies any limiting conditions surrounding the dividend forecast. Cross-reference TotDivMarker
    with Gprccode where TotDivMarker = Gprccode.Code and Gprccode.Type_ = 130.
- name: DivRuleNumb
  type: varchar(2)
  nullable: true
  description: DivRuleNumb identifies the rule applied in the calculation of TotDiv. Cross-reference DivRuleNumb with Gprccode
    where DivRuleNumb = Gprccode.Code and Gprccode.Type_ = 131. For most non-UK securities, the value is “00” because the
    forecast method is unknown.
- name: DivGenMarkA
  type: varchar(1)
  nullable: true
  description: DivGenMarkA provides security-level information about the current status of dividend/interest payments in general.
    Cross-reference DivGenMarkA with Gprccode where DivGenMarkA = Gprccode.Code and Gprccode.Type_ = 132.
- name: DivGenMarkB
  type: varchar(1)
  nullable: true
  description: DivGenMarkB provides additional security-level information about the current status of dividend/interest payments
    in general. Cross- reference DivGenMarkB with Gprccode where DivGenMarkB = Gprccode.Code and Gprccode.Type_ = 133.
- name: DivGenMarkBDate
  type: smalldatetime
  nullable: true
  description: DivGenMarkBDate is the date associated with DivGenMarkB. Cross-reference DivGenMarkDate with Gprccode where
    DivGenMarkDate = Gprccode.Code and Gprccode.Type_ = 134. LSEG Quantitative Analytics Database Schema for IDC Equity Pricing
    (Global) 25
- name: DivTaxMark
  type: varchar(1)
  nullable: true
  description: DivTaxMark identifies the tax implications of the dividend. Cross- reference DivTaxMark with Gprccode where
    DivTaxMark = Gprccode.Code and Gprccode.Type_ = 135.
- name: PayDate1
  type: SMALLINT
  nullable: true
  description: PayDate1 is the first date (ddmm) of the year on which interest/dividends are usually paid. If interest/dividends
    are paid more frequently, this is the first date.
- name: PayDate2
  type: SMALLINT
  nullable: true
  description: PayDate2 is the second date (ddmm) of the year on which interest/dividends are usually paid. If interest/dividends
    are paid more frequently, this is the second date.
- name: PayDate3
  type: SMALLINT
  nullable: true
  description: PayDate3 is the third date (ddmm) of the year on which interest/dividends are usually paid. If interest/dividends
    are paid more frequently, this is the third date.
- name: PayDate4
  type: SMALLINT
  nullable: true
  description: PayDate4 is the fourth date (ddmm) of the year on which interest/dividends are usually paid. If interest/dividends
    are paid more frequently, this is the fourth date.
- name: PayFreq
  type: varchar(1)
  nullable: true
  description: PayFreq indicates the interest/dividend frequency of PayDate1-4. Cross-reference PayFreq with Gprccode where
    PayFreq = Gprccode.Code and Gprccode.Type_ = 136.
---
table: qa_idc_global.GPrcQBM

    Gprccode where FirstExCurr = Gprccode.Code and Gprccode.Type_ = 6.
- name: LastCumDate
  type: smalldatetime
  nullable: true
  description: LastCumDate is the last trading date prior to the ex-date. This applies to UK securities only.
- name: LastSplitDate
  type: smalldatetime
  nullable: true
  description: LastSplitDate is the last date that the security can be split for trading purposes.
- name: NumCalls
  type: TINYINT
  nullable: true
  description: NumCalls is the number of calls or installments associated with an issue.
- name: CallAmt1
  type: FLOAT
  nullable: true
  description: CallAmt1 is the first amount payable on application for a partly-paid security.
- name: CallCurr1
  type: SMALLINT
  nullable: true
  description: CallCurr1 is the currency code associated with CallAmt1. Cross- reference CallCurr1 with Gprccode.Code where
    Type_ = 6.
- name: CallDate1
  type: smalldatetime
  nullable: true
  description: CallDate1 is the date associated with CallAmt1.
- name: CallAmt2
  type: FLOAT
  nullable: true
  description: CallAmt2 is the second amount payable on application for a partly-paid security.
- name: CallCurr2
  type: SMALLINT
  nullable: true
  description: CallCurr2 is the currency code associated with CallAmt2. Cross- reference CallCurr2 with Gprccode.Code where
    Type_ = 6.
- name: CallDate2
  type: smalldatetime
  nullable: true
  description: CallDate2 is the date associated with CallAmt2.
- name: CallAmt3
  type: FLOAT
  nullable: true
  description: CallAmt3 is the third amount payable on application for a partly-paid security.
- name: CallCurr3
  type: SMALLINT
  nullable: true
  description: CallCurr3 is the currency code associated with CallAmt3. Cross- reference CallCurr3 with Gprccode.Code where
    Type_ = 6.
- name: CallDate3
  type: smalldatetime
  nullable: true
  description: CallDate3 is the date associated with CallAmt3.
- name: CallAmt4
  type: FLOAT
  nullable: true
  description: CallAmt4 is the fourth amount payable on application for a partly-paid security.
- name: CallCurr4
  type: SMALLINT
  nullable: true
  description: CallCurr4 is the currency code associated with CallAmt4. Cross- reference CallCurr4 with Gprccode.Code where
    Type_ = 6.
- name: CallDate4
  type: smalldatetime
  nullable: true
  description: CallDate4 is the date associated with CallAmt4.
- name: XRefMarkA
  type: varchar(1)
  nullable: true
  description: XRefMarkA is a capitalization change cross-reference marker. This capital change, and the SEDOL or FTEX code
    of the previous tradable line. Cross-reference XRefMarkA with Gprccode where XRefMarkA = Gprccode.Code and Gprccode.Type_
    = 91.
- name: XRefSedolA
  type: varchar(6)
  nullable: true
  description: XRefSedolA is a capitalization change cross-reference marker. This LSEG Quantitative Analytics Database Schema
    for IDC Equity Pricing (Global) 11
- name: XRefMarkB
  type: varchar(1)
  nullable: true
  description: XRefMarkB is a capitalization change cross-reference marker. This capital change, and the SEDOL or FTEX code
    of the previous tradable line. Cross-reference XRefMarkA with Gprccode where XRefMarkA = Gprccode.Code and Gprccode.Type_
    = 91.
- name: XRefSedolB
  type: varchar(6)
  nullable: true
  description: XRefSedolB is a capitalization change cross-reference marker. This capital change, and the SEDOL or FTEX code
    of the previous tradable line.
- name: NumComponents
  type: TINYINT
  nullable: true
  description: NumComponents represents the number of individual components that make up multiple concurrent capital changes.
    A value of 0 indicates it is not applicable.
- name: MECalcBasis
  type: varchar(1)
  nullable: true
  description: MECalcBasis is the multiple event calculation basis. It describes the rating basis between the individual components
    shown in second and third issue items. Cross-reference MECalcBasis with Gprccode where MECalcBasis = Gprccode.Code and
    Gprccode.Type_ = 92.
- name: NewShrRights
  type: varchar(1)
  nullable: true
  description: NewShrRights describes the dividend ranking right of new shares for the parent security. Similar information
    on the new security can be found in Gprcpay.DivGenMarkB and Gprcpay.DivGenMarkBDate. Cross-reference NewShrRights with
    Gprccode where NewShrRights = Gprccode.Code and Gprccode.Type_ = 93.
- name: NewShrDate
  type: smalldatetime
  nullable: true
  description: NewShrDate describe the dividend ranking right of new shares for the parent security. Similar information on
    the new security can be found in Gprcpay.DivGenMarkB and Gprcpay.DivGenMarkBDate.
- name: NewSecType
  type: varchar(2)
  nullable: true
  description: NewSecType identifies the new type of security being issued in a capitalization change.
- name: LastBonusDate
  type: smalldatetime
  nullable: true
  description: LastBonusDate is the last trading date for subscription or bonus rights.
- name: SpecMarker
  type: varchar(1)
  nullable: true
  description: SpecMarker is the special situation marker. Together with SpecDate, it describes the ranking right of new shares.
    Cross-reference SpecMarker with Gprccode where SpecMarker = Gprccode.Code and Gprccode.Type_ = 94.
- name: SpecDate
  type: smalldatetime
  nullable: true
  description: SpecDate is the special situation date. Together with SpecMarker, it describes the ranking right of new shares.
- name: IssueQualB
  type: varchar(1)
  nullable: true
  description: IssueQualB represents issue qualification marker B. When more than one marker is needed, IssueQualA is the
    highest priority (see IssueQualA, above). Cross-reference IssueQualB with Gprccode where IssueQualB = Gprccode.Code and
    Gprccode.Type_ = 90.
- name: METype1
  type: varchar(1)
  nullable: true
  description: METype1 represents the issue type of the first component of multiple concurrent capital changes.
- name: MENewQuant1
  type: FLOAT
  nullable: true

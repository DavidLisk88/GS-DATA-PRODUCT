  type: varchar(6)
  nullable: true
  description: Sedol is the SEDOL of the security.
- name: Ticker
  type: varchar(12)
  nullable: true
  description: This field is not supported. Instead, refer to the TickerCode, LocalCodeA, or LocalCodeB field in the Gprcinfa
    table.
- name: Isin
  type: varchar(12)
  nullable: true
  description: Isin is the ISIN of the security.
- name: Issuer
  type: varchar(18)
  nullable: true
  description: Issuer is the name of the Issuer. Note that because the description is limited to 18 characters, abbreviations
    may be used.
- name: Issue
  type: varchar(35)
  nullable: true
  description: Issue is a brief, differentiating description of the issue. Note that because the description is limited to
    35 characters, abbreviations may be used.
- name: QuoteCtry
  type: varchar(2)
  nullable: true
  description: QuoteCtry returns the two-letter EXTEL country code for the country in which the security price is quoted.
    Cross-reference QuoteCtry with Gprccode.Code where Type_ = 2.
- name: Exchange
  type: varchar(1)
  nullable: true
  description: Exchange returns the one-letter exchange code indicating where a security is traded. Cross-reference Exchange
    with Gprccode where QuoteCtry + Exchange = Gprccode.Code and Gprccode.Type_ = 75.
- name: IssueCtry
  type: varchar(2)
  nullable: true
  description: IssueCtry returns the two-letter EXTEL country code identifying the country of incorporation for the issuer
    of the security. Cross-reference IssueCtry with Gprccode .Code where Type_ = 2.
- name: SecType
  type: varchar(2)
  nullable: true
  description: SecType returns the two-digit security type code. Cross-reference SecType with Gprccode.Code where Type_ =
    76.
- name: Industry
  type: varchar(4)
  nullable: true
  description: Industry returns the relevant country's industry code for the company underlying the issue. Cross-reference
    Industry with Gprccode where QuoteCtry code = (%%) of Gprccode.Desc_ and Gprccode.Type_ = 1. For example, if QuoteCtry
    is FJ, the corresponding Type_ 1 code is 36. To perform the industry description lookup, cross-reference Industry with
    Gprccode where Industry = Gprccode.Code and Type_ = 36.
- name: Status
  type: varchar(1)
  nullable: true
  description: Status returns the Issue Status Code which is a one-character code for a detailed description related to an
    issue's status. For example, Q = “Reason for extinction is no market maker” can be found by cross- referencing Gprccode
    where Status = Gprccode.Code and Type_ = 77.
- name: Health
  type: varchar(1)
  nullable: true
  description: Health is the live/dead indicator. Cross-reference Health with Gprccode where Health = Gprccode.Code and Type_
    = 82.
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: ModDate
  type: smalldatetime
  nullable: true
  description: ModDate is the last date on which changes were made within the table. LSEG Quantitative Analytics Database
    Schema for IDC Equity Pricing (Global) 24

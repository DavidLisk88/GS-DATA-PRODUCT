description: Global Pricing Quote Basis Marker | This table returns the quotation basis for a given security. The default
  is per share. | Use this table to find the per-share value of a security when an exchange quotes on a basis other than per-share.
update_cadence: Daily
columns:
- name: Vendor
  type: has
  nullable: false
  description: QBM data prior to 1995. LSEG Quantitative Analytics Database Schema for IDC Equity Pricing (Global) 26
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: StartDate
  type: TIMESTAMP(6)
  nullable: false
  description: StartDate is the first date for which the QBM is effective. To avoid overlap or conflicting dates, total return
    calculations use StartDate only.
- name: EndDate
  type: TIMESTAMP(6)
  nullable: true
  description: EndDate is the last date for which the QBM is effective.
- name: QBM
  type: varchar(2)
  nullable: true
  description: QBM cross-references Gprccode where GPrcQBM.QBM = Gprccode.CODE and Gprccode.TYPE_=154. QBM cross-references
    the divisor where GPrcQBM.QBM = Gprccode.CODE and Gprccode.TYPE_=166.

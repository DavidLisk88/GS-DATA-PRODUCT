table: qa_idc_global.GprcCapB
domain: pricing
description: Global Pricing Capital Changes – Additional Fields (B) | This table contains additional information for the global
  pricing capital changes data in Gprccap and Gprccapa.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all Gprc* tables.
- name: Number
  type: INTEGER
  nullable: false
  description: Number is the sequence number.
- name: RateCurr
  type: SMALLINT
  nullable: true
  description: RateCurr is the EXTEL currency of split equivalent ratio of the capital change. Cross-reference RateCurr with
    Gprccode where RateCurr = Gprccode.Code and Gprccode.Type_ = 6.
- name: NewSharesCurr
  type: SMALLINT
  nullable: true
  description: NewSharesCurr is the EXTEL currency of post-split shares.
- name: OldSharesCurr
  type: SMALLINT
  nullable: true
  description: OldSharesCurr is the EXTEL currency of pre-split shares.
---

table: qa_idc_global.Gprcadj
domain: pricing
description: Global Pricing Adjustment Factors | This table contains adjustment factors used to adjust daily pricing from
  the Gprcval table.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary link across all Gprc* tables.
- name: StartDate
  type: smalldatetime
  nullable: false
  description: StartDate is the first date the adjustment is applied.
- name: EndDate
  type: smalldatetime
  nullable: true
  description: EndDate is the last date the adjustment is applied.
- name: Rate
  type: FLOAT
  nullable: true
  description: Rate is the rate of the capital event.
- name: Factor
  type: FLOAT
  nullable: true
  description: 'Factor is the cumulative adjustment factor over time. Sample Query – adjusted pricing history The following
    query takes a given ID and returns the market cap history for the security: DECLARE @ID VARCHAR(20) SET @ID = ''@HONDA9''
    -- Honda Motor SELECT S.ID AS ID , S.NAME , S.SEDOL , V.DATE_ , (V.CLOSE_ * A.FACTOR) AS ADJ_CLOSING_PRICE_LOCAL , (V.CLOSE_
    * A.FACTOR) / X.RATE AS ADJ_CLOSING_PRICE_USD FROM QAI.DBO.GSECMSTRX S JOIN QAI.DBO.GSECMAPX M ON M.SECCODE = S.SECCODE
    AND M.VENTYPE = 1 -- Global'
---
table: qa_idc_global.Gprccap
domain: pricing
description: Global Pricing Capital Changes | Use this table to retrieve global capital changes data. This table is supplemented
  by the data in Gprccapa and
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: Number
  type: INTEGER
  nullable: false
  description: Number is the method used to identify capital change records that are uniquely from the vendor. Number is used
    for database updates only.
- name: ExDate
  type: smalldatetime
  nullable: true
  description: ExDate is the ex-date.
- name: RecDate
  type: smalldatetime
  nullable: true
  description: RecDate is the record date.
- name: PayDate
  type: smalldatetime
  nullable: true
  description: PayDate is the date on which payment is made.
- name: EntDate
  type: smalldatetime
  nullable: true
  description: EntDate is the entry date.
- name: RevDate
  type: smalldatetime
  nullable: true
  description: RevDate is the revision date.
- name: Rate
  type: FLOAT
  nullable: true
  description: Rate represents the factor applied towards OldShares.
- name: OldShares
  type: FLOAT
  nullable: true
  description: OldShares is the share count before capital action.
- name: NewShares
  type: FLOAT
  nullable: true
  description: NewShares is the share count after capital action.
- name: IssuePrice
  type: FLOAT
  nullable: true
  description: IssuePrice is the price of the shares distributed.
- name: Currency_
  type: SMALLINT
  nullable: true
  description: Currency_ is the OldShare currency code. To convert to US dollars, cross- reference Currency_ with Gprcexr
    where Currency_ = Gprcexr.Currency_ and ExDate = Gprcexr.Date_.
- name: ChangeType
  type: varchar(1)
  nullable: true
  description: ChangeType can be cross-referenced with Gprccode where ChangeType = Gprccode.Code and Gprccode.Type_ = 81.
join_hints:
- to: Gprccode
  evidence: ChangeType varchar(1) Y ChangeType can be cross-referenced with Gprccode where ChangeType = Gprccode.Code and
    Gprccode.Type_ = 81.
  type: cross_reference
---
table: qa_idc_global.Gprccapa

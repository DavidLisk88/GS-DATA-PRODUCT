table: qa_idc_global.GPrcSecChg
domain: pricing
description: Global Pricing Sedol, Name, and Isin Changes | This table is for LSEG internal use only. | This table returns
  security change information.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: StartDate
  type: smalldatetime
  nullable: false
  description: StartDate is the effective date of the change.
- name: EndDate
  type: smalldatetime
  nullable: true
  description: EndDate is the last date before the change.
- name: Cusip
  type: varchar(8)
  nullable: true
  description: Cusip is the CUSIP of the security.
- name: Sedol
  type: varchar(6)
  nullable: true
  description: Sedol is the SEDOL of the security. LSEG Quantitative Analytics Database Schema for IDC Equity Pricing (Global)
    27
- name: Isin
  type: varchar(12)
  nullable: true
  description: Isin is the ISIN of the security.
- name: Ticker
  type: varchar(12)
  nullable: true
  description: Ticker is the ticker ID of the security.
- name: Exchange
  type: varchar(1)
  nullable: true
  description: Exchange returns the one-letter exchange code indicating where a security is traded. Cross-reference Exchange
    with Gprccode where QuoteCtry + Exchange = Gprccode.Code and Gprccode.Type_ = 75.
- name: QuoteCtry
  type: varchar(2)
  nullable: true
  description: QuoteCtry returns the two-letter EXTEL country code for the country in which the security price is quoted.
    Cross-reference QuoteCtry with Gprccode.Code where Type_ = 2.
- name: Issuer
  type: varchar(18)
  nullable: true
  description: Issuer is the name of the Issuer. Note that because the description is limited to 18 characters, abbreviations
    may be used.
- name: IssueCtry
  type: varchar(2)
  nullable: true
  description: IssueCtry returns the two-letter EXTEL country code identifying the country of incorporation for the issuer
    of the security. Cross-reference IssueCtry with Gprccode .Code where Type_ = 2.

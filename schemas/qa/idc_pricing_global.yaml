table: qa_idc_global.Gprctom
domain: pricing
description: Global Pricing Takeovers and Mergers | This table contains the global pricing takeovers and mergers data.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: Number
  type: SMALLINT
  nullable: false
  description: Number provides a unique reference to each individual event. The number will increase in increments of one
    and will remain following the removal of the associated event details.
- name: Date_
  type: smalldatetime
  nullable: true
  description: Date_ is the date associated with Marker or the effective date of the situation.
- name: ModDate
  type: smalldatetime
  nullable: true
  description: ModDate is the date on which the security was last modified.
- name: Marker
  type: varchar(1)
  nullable: true
  description: Marker provides the type and current status of the takeover/merger. Cross-reference Marker with Gprccode where
    Marker = Gprccode.Code and Gprccode.Type_ = 140.
- name: QualCode
  type: varchar(1)
  nullable: true
  description: QualCode further qualifies Marker. Cross-reference QualCode with Gprccode where QualCode = Gprccode.Code and
    Gprccode.Type_ = 141.
- name: StartDate
  type: smalldatetime
  nullable: true
  description: StartDate is the date on which the offer started.
- name: OfferUnit
  type: INTEGER
  nullable: true
  description: OfferUnit is the minimum number of shares or amount of debt related to the offer terms.
- name: OfferCurr
  type: SMALLINT
  nullable: true
  description: OfferCurr is the currency code associated with OfferUnit. Cross-reference OfferCurr with Gprccode where OfferCurr
    = Gprccode.Code and Gprccode.Type_ = 6.
- name: MultInd
  type: varchar(1)
  nullable: true
  description: MultInd indicates if multiple securities or cash amounts are offered in a merger or takeover attempt. When
    more than one security is offered, details of the equity or main equity are given in OfferedSedol1, OfferedType1, and
    StockAmt1. Cross-reference MultInd with Gprccode where MultInd = Gprccode.Code and Gprccode.Type_ = 142.
- name: PartMarker
  type: varchar(1)
  nullable: true
  description: PartMarker indicates if the takeover is a partial acquisition (A) or a 100% acquisition (blank).
- name: PartPct
  type: FLOAT
  nullable: true
  description: PartPct is the percentage offered in a proposed partial acquisition.
- name: AcceptPct
  type: FLOAT
  nullable: true
  description: AcceptPct is the total percentage of shareholders accepting a partial takeover offer.
- name: OfferingSedol1
  type: varchar(6)
  nullable: true
  description: OfferingSedol1 is the SEDOL/FTEX of the primary company making the offer.
- name: OfferedSedol1
  type: varchar(6)
  nullable: true
  description: OfferedSedol1 is the SEDOL/FTEX of the first or only security offered.
- name: OfferedType1
  type: varchar(2)
  nullable: true
  description: OfferedType1 is the type of the first or only security offered. Cross- reference OfferedType1 with Gprccode
    where OfferedType1 = Gprccode.Code and Gprccode.Type_ = 76.
- name: StockAmt1
  type: FLOAT
  nullable: true
  description: StockAmt1 is the number of shares or the amount of debt securities being offered.
- name: StockCurr1
  type: SMALLINT
  nullable: true
  description: StockCurr1 is the currency code associated with StockAmt1. Cross- reference StockCurr1 with Gprccode where
    StockCurr1 = Gprccode.Code and Gprccode.Type_ = 6.
- name: CashAmt1
  type: FLOAT
  nullable: true
  description: CashAmt1 is the amount of cash offered as a direct part of the offer.
- name: CashCurr1
  type: SMALLINT
  nullable: true
  description: CashCurr1 is the currency code associated with CashAmt1. CashCurr1 can be cross-referenced with Gprccode where
    CashCurr1 = Gprccode.Code and Gprccode.Type_ = 6.
- name: OfferingSedol2
  type: varchar(6)
  nullable: true
  description: OfferingSedol2 is the SEDOL/FTEX of the second company making the offer.
- name: OfferedSedol2
  type: varchar(6)
  nullable: true
  description: OfferedSedol2 is the SEDOL/FTEX of the second security offered. LSEG Quantitative Analytics Database Schema
    for IDC Equity Pricing (Global) 29
- name: OfferedType2
  type: varchar(2)
  nullable: true
  description: OfferedType2 is the type of the second security offered. Cross-reference OfferedType2 with Gprccode where OfferedType2
    = Gprccode.Code and Gprccode.Type_ = 76.
- name: StockAmt2
  type: FLOAT
  nullable: true
  description: StockAmt2 is the number of shares or the amount of a second security offered.
- name: StockCurr2
  type: SMALLINT
  nullable: true
  description: StockCurr2 is the currency code associated with StockAmt2. Cross- reference StockCurr2 with Gprccode where
    StockCurr2 = Gprccode.Code and Gprccode.Type_ = 6.
- name: CashAmt2
  type: FLOAT
  nullable: true
  description: CashAmt2 is the second amount of cash offered.
- name: CashCurr2
  type: SMALLINT
  nullable: true
  description: CashCurr2 is the currency code associated with CashAmt2. Cross- reference CashCurr2 with Gprccode where CashCurr2
    = Gprccode.Code and Gprccode.Type_ = 6.
- name: OfferingName1
  type: varchar(18)
  nullable: true
  description: OfferingName1 is the name of the primary offering company.
- name: OfferingName2
  type: varchar(18)
  nullable: true
  description: OfferingName2 is the name of the secondary offering company.
join_hints:
- to: Gprccode
  evidence: CashCurr1 can be cross-referenced with Gprccode where CashCurr1 = Gprccode.Code and Gprccode.Type_ = 6.
  type: cross_reference
---
table: qa_idc_global.Gprcval
domain: pricing
description: Global Pricing Exchange Specific Pricing | This table contains exchange-specific global pricing data. This table
  is supplemented by GprcValA.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: Date_
  type: smalldatetime
  nullable: false
  description: Date_ is the date associated with the price.
- name: Open_
  type: FLOAT
  nullable: true
  description: Open_ is the first price at which a security was traded on a given date.
- name: High
  type: FLOAT
  nullable: true
  description: High is the highest price at which a security was traded.
- name: Low
  type: FLOAT
  nullable: true
  description: Low is the lowest price at which a security was traded.
- name: Close_
  type: FLOAT
  nullable: true
  description: Close_ is the price at the close of the market. For stocks that do not trade on any given trading day, Close_
    is an average of Bid and Ask.
- name: Bid
  type: FLOAT
  nullable: true
  description: Bid contains the most recent bid price. For equities in which only a current ask price is available, this field
    is zero-filled.
- name: Ask
  type: FLOAT
  nullable: true
  description: Ask contains the most recent ask price. For equities where only a current bid price is available, this field
    is zero-filled.
- name: Volume
  type: FLOAT
  nullable: true
  description: Volume is the number of shares traded on a given day.
- name: Currency_
  type: SMALLINT
  nullable: true
  description: Currency_ is based on EXTEL codes. Gprccode provides EXTEL to ISO translation.
- name: Flags
  type: SMALLINT
  nullable: true
  description: Flags is obsolete and should not be used.
- name: Exchange
  type: varchar(3)
  nullable: true
  description: Exchange returns the three-character Exchange Codes. The first two letters are the EXTEL country code for the
    exchange, and the third letter is the one- letter abbreviation for the exchange. Exchange cross-references with Gprccode
    where Exchange = Gprccode.Code and Gprccode.Type_ = 75. LSEG Quantitative Analytics Database Schema for IDC Equity Pricing
    (Global) 30
join_hints:
- to: Gprccode
  evidence: Exchange cross-references with Gprccode where Exchange = Gprccode.Code and Gprccode.Type_ = 75.
  type: cross_reference
---
table: qa_idc_global.GprcValA
domain: pricing
description: Global Pricing Exchange Specific Pricing – Additional | This table contains additional descriptions of the Gprcval
  records.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the primary reference across all Gprc* tables.
- name: Date_
  type: smalldatetime
  nullable: false
  description: Date_ indicates the date on which the Bid or Ask price last changed.
- name: QuoteCurr
  type: SMALLINT
  nullable: true
  description: QuoteCurr is the EXTEL currency of the Bid or Ask. Cross-reference QuoteCurr with Gprccode where QuoteCurr
    = Gprccode.code and Gprccode.Type_ = 6.
- name: IncomeMarker
  type: varchar(1)
  nullable: true
  description: 'IncomeMarker indicates entitlement or non-entitlement to a dividend payment or capital change (other than
    a regular dividend). IncomeMarker can be: Not Applicable; marker set on day after the payment date of dividend (0) Cum-dividend;
    marker set on date when declared dividend is first input (1) Ex-dividend; marker set on the ex-dividend date (2)'
- name: EventMarker
  type: varchar(1)
  nullable: true
  description: EventMarker identifies whether a capital change is pending and if the security is trading Cum or Ex rights
    to change. It cross-references Gprccode where EventMarker = Gprccode.Code and Gprccode.Type_ = 151.
- name: PrcCondMarker
  type: varchar(1)
  nullable: true
  description: PrcCondMarker is the price condition marker and indicates if the prices are normally reported. PrcCondMarker
    cross-references Gprccode where PrcCondMarker = Gprccode.Code and Gprccode.Type_ = 152.
- name: VolMarker
  type: varchar(1)
  nullable: true
  description: VolMarker defines the reported volume. It cross-references Gprccode where VolMarker = Gprccode.Code and Gprccode.Type_
    = 153.
- name: QuoteBasisMarker
  type: varchar(1)
  nullable: true
  description: QuoteBasisMarker describes how bid, ask, and close prices are quoted. It cross-references Gprccode where QuoteBasisMarker
    = Gprccode.Code and Gprccode.Type_ = 154.
- name: QuoteTypeCode
  type: varchar(1)
  nullable: true
  description: QuoteTypeCode describes the bid or ask provided, or why no price is available. QuoteTypeCode cross-references
    Gprccode where QuoteTypeCode = Gprccode.Code and Gprccode.Type_ = 155.
- name: CloseTypeCode
  type: varchar(1)
  nullable: true
  description: CloseTypeCode describes the close price provided, or why no price is available. Cross-reference CloseTypeCode
    with Gprccode where CloseTypeCode = Gprccode.Code and Gprccode.Type_ = 155.
- name: HighLowTypeCode
  type: varchar(1)
  nullable: true
  description: HighLowTypeCode describes the high or low provided, or why no price is available. Cross-reference HighLowTypeCode

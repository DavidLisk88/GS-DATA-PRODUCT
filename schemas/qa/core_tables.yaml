  nullable: true
  description: PrimaryUpdateTime is the most recent date and time of the primary update.
- name: FilesDone
  type: INTEGER
  nullable: true
  description: FilesDone is the number of updates processed for Update_Log.FileDate.
- name: LastFileNum
  type: INTEGER
  nullable: true
  description: LastFileNum is the last Update_Log.FileNum processed.
- name: LastUpdateTime
  type: smalldatetime

  type: INTEGER
  nullable: true
  description: PrimaryUpdateNum is a predetermined value indicating that a data update is likely to occur in a certain numeric
    update file. For example, the PrimaryUpdateNum for the table prc.PrcDly is 1. This means the major update for this table
    occurs where FileNum = 1.

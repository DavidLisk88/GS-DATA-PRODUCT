  type: TIMESTAMP(6)
  nullable: false
  description: StartTime is the time the update for TableName was started.
- name: EndTime
  type: TIMESTAMP(6)
  nullable: true
  description: EndTime is the time the update for TableName was completed.
- name: Status
  type: INTEGER
  nullable: false
  description: status is the bcp return status of the table update. A return status of 0 represents a clean update of that
    table.
- name: insertCount
  type: INTEGER
  nullable: true
  description: insertCount is the number of records inserted into a table.
- name: updateCount
  type: INTEGER
  nullable: true
  description: updateCount is the number of existing records modified in a table. LSEG Quantitative Analytics Database Schema
    for Core Tables 24
- name: deleteCount
  type: INTEGER
  nullable: true
  description: deleteCount is the number of records deleted in a table.
- name: ACount
  type: INTEGER
  nullable: true
  description: ACount is the number of adds in the update file.
- name: UCount

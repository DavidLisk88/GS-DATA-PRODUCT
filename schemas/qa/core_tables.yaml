table: qa_core.Update_Status
domain: reference
description: Statistical Recap of Most Recent Update for Every Table | This table is available only in LSEG Quantitative Analytics
  deployed. | This table contains statistical information about the most recent update for all tables in your subscription.
  | example, the PrimaryUpdateNum for the table prc.PrcDly is 1. This | means the major update for this table occurs where
  FileNum = 1.
update_cadence: Calculated from Update_Log.
columns:

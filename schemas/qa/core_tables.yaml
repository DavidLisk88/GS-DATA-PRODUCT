domain: reference
description: Cumulative Account of Every Table Update | This table is not available in LSEG Quantitative Analytics in the
  cloud. | This table contains cumulative update information for all tables in your subscription. In Snowflake, this table
  is | available at schema level i.e., DBO and PRC. Note the table structure in Snowflake is different to the one listed |
  below. The table serves the purpose to list adds, updates, and deletes to all tables in your subscription. Please | TableName
  varchar(101) N TableNam

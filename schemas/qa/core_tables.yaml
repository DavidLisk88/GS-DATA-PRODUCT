- name: TableName
  type: varchar(101)
  nullable: false
  description: TableName may name any user table in your database.
- name: FileDate
  type: smalldatetime
  nullable: false
  description: FileDate is the date in the name of the update file that was processed. For example, an entry of 2003-10-30
    means the update filename had 20031030 as part of the name.
- name: FileNum
  type: INTEGER
  nullable: false
  description: FileNum is the index of the FileDate that was processed. For example, expanding on the previous example, an
    entry of 1 would mean the update file name is 20031030-1.UPD.

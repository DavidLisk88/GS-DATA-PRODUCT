  type: TINYINT
  nullable: false
  description: Type_ is the type identifier. Types are defined where Type_ = 0 and Code identifies the Type.
- name: Code
  type: varchar(10)
  nullable: false
  description: Code is described by Desc_. Code is cross-referenced from other SM2* tables.
- name: Desc_
  type: varchar(100)
  nullable: false
  description: Desc_ is the full name of Code.
- name: Adjust
  type: TINYINT
  nullable: false
  description: Adjust identifies which measures and preferred earnings are affected by stock splits.
join_hints:
- to: other
  evidence: Code is cross-referenced from other SM2* tables.
  type: cross_reference

table: qa_starmine.Sm2Item
domain: analytics
description: StarMine Item Identifiers | Use this table to retrieve item identifiers and descriptions.
update_cadence: Daily
columns:
- name: Item
  type: SMALLINT
  nullable: false
  description: Item is the unique numeric identifier for the item. This field cross- references Sm2ItemDesc.
- name: Mnemonic
  type: varchar(40)
  nullable: true
  description: Mnemonic is the unique character identifier for the item.
- name: ItemName
  type: varchar(50)
  nullable: true
  description: ItemName is the full item name. Database Schema for Starmine Data 10
- name: Model
  type: TINYINT
  nullable: true
  description: Model identifies the model to which the item belongs. Model cross- references Sm2Code where Sm2Code.Type_ =
    3 and Sm2Code.Code = Sm2Item.Model.
- name: Table_
  type: TINYINT
  nullable: true
  description: Table_ identifies the corresponding table. Table_ cross-references Sm2Code where Sm2Code.Type_ = 13 and Sm2Code.Code
    = Sm2Item.Table_.
- name: DataType
  type: TINYINT
  nullable: true
  description: DataType identifies the data type. DataType cross-references Sm2Code where Sm2Code.Type_ = 4 and Sm2Code.Code
    = Sm2Item.DataType.
- name: Category
  type: TINYINT
  nullable: true
  description: Category identifies the StarMine category of the item. Category cross- references Sm2Code where Sm2Code.Type_
    = 5 and Sm2Code.Code = Sm2Item.Category.
- name: Scalable
  type: TINYINT
  nullable: true
  description: Scalable is the Million/Billion flag. It identifies whether the data is in whole number terms of millions or
    billions. A value of 1 indicates that the flag applies.
- name: Adjust
  type: TINYINT
  nullable: true
  description: 'Adjust identifies how the item is affected by stock splits. Adjust may be: Not Applicable (0) Split Adjust
    (1) Dependent on Measure (2) When Sm2Item.Adjust = 2, to refine your results: 1. Cross-reference Sm2Item.Item with Sm2DArm*.Item
    to identify the appropriate Measure code. 2. Then cross-reference Sm2DArm*.Measure with Sm2Code.Code where Sm2Code.Type_
    = 12. Adjust is defined as above. 3. When Sm2Code.Adjust = 2 at Type_ = 12, the adjustment is dependent on the preferred
    earnings type. Preferr'
- name: DFlag
  type: SMALLINT
  nullable: true
  description: 'DFlag indicates which fields, or combination of fields, from the data model tables apply to the item. Applicable
    fields may be: Fiscal Period, Change Period, or Measure. DFlag cross- references with Sm2Code where Sm2Code.Type_ = 17
    and Sm2Code.Code = Sm2Item.DFlag. Database Schema for Starmine Data 11'
---

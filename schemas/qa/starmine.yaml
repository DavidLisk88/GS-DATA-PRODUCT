- name: Ident
  type: varchar
  nullable: false
  description: Ident is the value of the identifier during that period.
- name: IdentDesc
  type: varchar
  nullable: true
  description: The description of the identifier.
- name: CmpName
  type: varchar
  nullable: true
  description: CmpName is the company name.
- name: SecCtry
  type: char
  nullable: true
  description: SecCtry is the country in which the security trades. SecCtry cross-references Sm2Code where Sm2Code.Type_ =
    1 and Sm2Code.Code = Sm2HInfo.SecCtry.
- name: CmpCtry
  type: char
  nullable: true
  description: CmpCtry indicates the country of the company’s headquarters. The two-character code cross- references Sm2Code
    where Sm2Code.Type_ = 1 and Sm2Code.Code = Sm2DInfo.CmpCtry.
- name: PermRegionDesc
  type: varchar
  nullable: true
  description: PermRegion is the permission region. There are multiple Smart Holdings regions that fit into a single permission
    region. select aa.SecCode, bb.Exchange, cc.CmpName, cc.Ticker, cc.SecId, dd.StartDate, dd.EndDate, dd.IdentDesc, dd.Exch,
    dd.Ident from vw_SecurityMasterX aa join vw_SM2MappingHist bb on bb.seccode = aa.seccode and bb.Typ = aa.typ join SM2HInfo
    cc on cc.SecId = bb.VenCode join vw_SM2HIdentChg dd on dd.SecId = cc.SecId and dd.IdentType = 2 where aa.id = 'TOC' and
    bb.exchange = 2 -- Can

table: qa_dataexp.DXLLicMrktID
domain: short_interest
description: Code Mapping Information | This table maps Codes to the corresponding CUSIP, SEDOL, and ISIN identifiers. This
  table also stores the
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the unique number provided by DXL that identifies each quote.
- name: Item
  type: TINYINT
  nullable: false
  description: Item is the item number corresponding to the type of identifier captured.
- name: StartDate
  type: INTEGER
  nullable: false
  description: StartDate is the start date for the value.
- name: EndDate
  type: INTEGER
  nullable: true
  description: EndDate is the end date for the value.
- name: Value_
  type: varchar(100)
  nullable: true
  description: Value_ is the identifier value. The nine-character CUSIP value is truncated to eight characters, with the ninth
    check digit removed. The seven-character SEDOL value is truncated to six characters, with the seventh check digit removed.
- name: Licflag
  type: INTEGER
  nullable: false
  description: Licflag is the licensing flag for CUSIP or SEDOL entitlement. If the ISIN is generated from the SEDOL (the
    first seven of the last eight characters of the ISIN is equal to the SEDOL), it will have the SEDOL entitlement key. If
    the ISIN is generated from the CUSIP (the first nine of the last ten characters of the ISIN is equal to the CUSIP), it
    will have the CUSIP entitlement key. All other security items will not be restricted and will have the entitlement key
    for ‘Others’.

table: qa_dataexp.DXLDivReqData
domain: short_interest
description: Stock-Lending Information for Dividend Levels | This table contains stock-lending information for each reported
  dividend level.
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the unique number provided by DXL that identifies each quote.
- name: DvdReqd
  type: INTEGER
  nullable: false
  description: DvdReqd is the proportion of a dividend payment beneficial owners are entitled to, if their shares are on loan
    over a dividend record date.
- name: Date_
  type: INTEGER
  nullable: false
  description: Date_ is the date the data was made available to the public, in the format YYYYMMDD.
- name: ISO3CurCode
  type: char(3)
  nullable: false
  description: ISO3CurCode is the ISO 3 currency code of the money items for the record. DXLDivReqData.ISO3CurCode cross-references
    with DXLDesc.Code where Type_ = 1.
- name: TotDemVal
  type: FLOAT
  nullable: true
  description: TotDemVal is the total value of borrowed or loaned securities.
- name: TotDemQty
  type: BIGINT
  nullable: true
  description: TotDemQty is the total quantity of borrowed or loaned securities.
- name: BOInvVal
  type: FLOAT
  nullable: true
  description: BOInvVal is the value of current inventory available from beneficial owners, in millions. This value is implied.
    LSEG Quantitative Analytics Database Schema for Data Explorers 8
- name: BOInvQty
  type: BIGINT
  nullable: true
  description: BOInvQty is the quantity of current inventory available from beneficial owners. This value is implied.
- name: ImpliedUtility
  type: FLOAT
  nullable: true
  description: ImpliedUtility is the value of assets on loan from beneficial owners (Beneficial Owner Value on Loan) divided
    by the total lendable assets (Beneficial Owner Inventory Value), expressed as a percentage. This value is implied.
- name: ImpliedTenure
  type: SMALLINT
  nullable: true
  description: ImpliedTenure is the weighted average number of days from the start date to present for all open transactions.
- name: OpenLoanTrans
  type: SMALLINT
  nullable: true
  description: OpenLoanTrans is the total number of open transactions from the beneficial owner’s side only. Custodians typically
    report a separate transaction for every underlying beneficial owner or fund from whom the loan is taken.
- name: LicFlag
  type: INTEGER
  nullable: false
  description: LicFlag is the licensing flag. DXLDivReqData.LicFlag cross-references with DXLCode.Code where Type_ = 8.
---

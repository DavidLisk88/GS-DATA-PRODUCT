table: qa_dataexp.DXLSecInfo
domain: short_interest
description: Security Information | This table contains securities covered by the stock-lending data provided by DXL over
  time. This table only
update_cadence: Daily
columns:
- name: Code
  type: INTEGER
  nullable: false
  description: Code is the unique number provided by DXL that identifies each quote.
- name: SecName
  type: varchar(150)
  nullable: true
  description: SecName is the name of the security.
- name: ExchName
  type: varchar(150)
  nullable: true
  description: 'ExchName is the name of the exchange. Note: This field has been discontinued and contains a Null Value.'
- name: Ticker
  type: varchar(20)
  nullable: true
  description: 'Ticker is a symbol used to identify the company listed on the stock exchanges. Note: This field has been discontinued
    and contains a Null Value.'
- name: Quick
  type: varchar(10)
  nullable: true
  description: Quick is the QUICK value for Japanese securities.
- name: DataRegionCode
  type: TINYINT
  nullable: false
  description: 'DataRegionCode identifies the data region to which the security belongs. It is also used for entitlement.
    DataRegionCode is derived from the file name and can be one the following valid values: – 1 = All regions – 2 = Asia (excluding
    Japan) – 3 = Australasia – 4 = Europe – 5 = Japan – 6 = North America – 7 = Others DXLSecInfo.DataRegionCode cross-references
    with DXLCode.Code where Type_ = 1.'
- name: MarketCode
  type: TINYINT
  nullable: false
  description: MarketCode indicates the market in which the security trades. DXLSecInfo.MarketCode cross-references with DXLCode.Code
    where Type_ = 3.
- name: AssetClassCode
  type: TINYINT
  nullable: false
  description: AssetClassCode indicates the type of security. DXLSecInfo.AssetClassCode cross-references with DXLCode.Code
    where Type_ = 4.
join_hints:
- to: the
  evidence: 'DataRegionCode is derived from the file name and can be one the following valid values: – 1 = All regions – 2
    = Asia (excluding Japan) – 3 = Australasia – 4 = Europe – 5 = Japan – 6 = North America – 7 = Others DXLSecInfo.DataRegionCode
    cross-references with DXLCode.Code where Type_ = 1.'
  type: cross_reference

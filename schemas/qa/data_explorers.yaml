table: qa_dataexp.DXLMktSummData
domain: short_interest
description: Country-Level Proprietary Indicators | This table reports a set of proprietary indicators developed by Data Explorers,
  aggregated at a country level.
update_cadence: Daily
columns:
- name: MarketCode
  type: TINYINT
  nullable: false
  description: MarketCode is the country or region of trade. DXLMktSummData.MarketCode cross-references with DXLCode.Code
    where Type_ = 3. LSEG Quantitative Analytics Database Schema for Data Explorers 10
- name: AssetClassCode
  type: TINYINT
  nullable: false
  description: AssetClassCode is the type of security being aggregated. DXLMktSummData.AssetClassCode cross-references with
    DXLCode.Code where Type_ = 4.
- name: Date_
  type: INTEGER
  nullable: false
  description: Date_ is the date the data was made available to the public, in the format YYYYMMDD.
- name: DNSIndicator
  type: FLOAT
  nullable: true
  description: DNSIndicator is the DNS (Data Explorers Negative Sentiment) indicator. It is based on the normalized sum of
    the moving average of utilization and the change in utilization. This indicator is based on a relative scale (normalized)
    from 0 to 100. A relatively high DNS generally reflects negative sentiment (an increasing amount of shorts relative to
    longs), while a low number shows relatively less negative sentiment.
- name: DIPSIndicator
  type: FLOAT
  nullable: true
  description: 'DIPSIndicator is the DIPS (Data Explorers Increasing Price Squeeze) indicator. It compares security-lending
    data (change in inventory quantity and loans) to cash market data (average trade volume and close price) to determine
    the risk of a rapid increase in price (price squeeze). DIPSIndicator gives a higher score to stocks that have a high level
    of utilization, a high loan position relative to cash market volume, a high proportion of shares outstanding on loan,
    a recent sharp declines in stock '
- name: DIMVIndicator
  type: FLOAT
  nullable: true
  description: DIMVIndicator is the DIMV (Data Explorers Increasing Market Volatility) indicator. It combines the DNS and
    DIPS indicators. If only one of these indicators has a high value, or if the combination of the two results in a high
    value, then there is a higher risk of stock price volatility. The indicator is based on a relative scale from 0 to 100.
- name: DPSIndicator
  type: FLOAT
  nullable: true
  description: 'DPSIndicator is the DPS (Data Explorers Positive Sentiment) indicator. It is based on the average loan quantity
    (shorts) relative to the average inventory quantity (longs) for the security, with a higher score for stocks that have
    had little or no shorting activity over the previous 12 months. This indicator is based on a relative scale (normalized)
    from 0 to 100. A relatively high DPS generally reflects positive sentiment (relatively more longs than shorts), while
    a relatively low number shows '
- name: DSS
  type: FLOAT
  nullable: true
  description: DSS is the DSS (Data Explorers Short Score) indicator. It converts the Percent of the Shares Outstanding on
    Loan of a company (a measure of short interest) to a score between zero and five. A high score means that a large amount
    of the company’s share base is out on loan to cover short sales. Generally, a score of four or five is considered very
    high.
- name: LicFlag
  type: INTEGER
  nullable: false
  description: LicFlag is the licensing flag. DXLMktSummData.LicFlag cross-references with DXLCode.Code where Type_ = 8.
---

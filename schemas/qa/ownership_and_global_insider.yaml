- name: BuySellFlag
  type: char(1)
  nullable: true
  description: BuySellFlag indicates whether the issue was Acquired (A) or Disposed of (D). A null value indicates another
    type of transaction, such as an opening balance. This field cross-references OwnInsDesc where OwnInsDesc.Type_ = 2 and
    OwnInsDesc.Code = OwnInsData.BuySellFlag.
- name: Posnchg
  type: BIGINT
  nullable: true
  description: Posnchg indicates the position change, reported as the number of shares in the transaction. In the case of
    a disposition, this value is negative. A null value may indicate an opening balance.
- name: SharHeld
  type: BIGINT
  nullable: true
  description: SharHeld is the number of shares held after completion of the given transaction.
- name: AmndFlag
  type: char(1)
  nullable: true
  description: AmndFlag is the Amended flag. This flag indicates whether the transaction has been amended (A), or if there
    has been no amendment (N). This field cross- references OwnInsDesc where OwnInsDesc.Type_ = 3 and OwnInsDesc.Code = OwnInsData.AmndFlag.
- name: ExerPriceUSD
  type: FLOAT
  nullable: true
  description: ExerPriceUSD is the exercise or transaction price in USD (United States dollars), rounded to a tenth of a cent.
    If data is unavailable, the field is null.
- name: ExerpriceLocal
  type: FLOAT
  nullable: true
  description: ExerpriceLocal is the exercise price. If this value is from the UK feed, it is as reported in GBP (Great Britain
    pounds). If from the SEDI feed, the value is in CAD (Canada dollars), or is as reported and converted to CAD.
- name: ExerpriceEU
  type: FLOAT
  nullable: true
  description: ExerpriceEU is the exercise price in EUR (Europe Euros), rounded to a tenth of a cent. If data is unavailable,
    this field is null.
- name: GLTPctUK
  type: char(1)
  nullable: true
  description: GLTPctUK describes whether the holder’s share holding is less than or more than the percentage specified in
    the PctUK field. If the PctUK field contains the actual reported value, then this field is null. This applies only to
    UK data. This OwnInsDesc.Code = OwnInsData.GLTPctUK.
- name: PctUK
  type: FLOAT
  nullable: true
  description: PctUK is the percentage of holdings the transaction represents, as reported by trade announcements.
- name: HoldFlagUK
  type: char(1)
  nullable: true
  description: HoldFlagUK indicates whether the trade is the latest, previous, or historical trade announcement for this combination
    of issue and filer. This field cross- references OwnInsDesc where OwnInsDesc.Type_ = 5 and OwnInsDesc.Code = OwnInsData.HoldFlagUK.
- name: UpdDateUK
  type: TIMESTAMP(6)
  nullable: true
  description: UpdDateUK is the date an update occurred in the LSEG database.
- name: DirFlag
  type: char(1)
  nullable: true
  description: DirFlag indicates whether the filer is (Y) or is not (N) a Director. This field cross- references OwnInsDesc
    where OwnInsDesc.Type_ = 6 and OwnInsDesc.Code = OwnInsData.DirFlag.
- name: OwnerCode
  type: INTEGER
  nullable: true
  description: OwnerCode is the unique identifier for an owner. It is defined by OwnInfo. This
- name: ProdID
  type: INTEGER
  nullable: true
  description: ProdID is a unique LSEG identifier. This field is blank or null if the SEDI filer does not have filings on
    record with the LSEG data source.

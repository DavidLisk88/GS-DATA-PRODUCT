table: qa_own_insider.OwnInsDesc
domain: ownership
description: Insider Codes (varchar) | This table contains translations for codes of varchar datatype.
update_cadence: Daily
columns:
- name: Type_
  type: INTEGER
  nullable: false
  description: Type_ is a numeric code for a type of data.
- name: Code
  type: varchar(11)
  nullable: false
  description: Code is a coded value for an element of Type_. When Type_ = 0, Code is the numeric code for each Type_ other
    than 0 and Desc_ is a description of each Type_.
- name: Desc_
  type: varchar(101)
  nullable: true
  description: Desc_ is a plain-language description of the element defined by Type_ and Code. See OwnInsCode on page 29.
    LSEG Quantitative Analytics Database Schema for Ownership and Global Insider 31
---
table: qa_own_insider.OwnInsInfo
domain: ownership
description: Insider Investors Information | This table provides information about insider investors.
update_cadence: Daily
columns:
- name: InsID
  type: INTEGER
  nullable: false
  description: InsID is a unique insider identifier generated by LSEG. This field cross- references OwnInsData.
- name: OwnerCode
  type: INTEGER
  nullable: true
  description: OwnerCode is the unique identifier for an owner. It is defined by OwnInfo. This
- name: ProdId
  type: INTEGER
  nullable: true
  description: ProdId is a unique LSEG identifier. This field is blank or null if the SEDI (System for Electronic Disclosure
    by Insiders) filer does not have filings on record with the LSEG data source.
- name: FilerId
  type: INTEGER
  nullable: true
  description: FilerId is a unique identifier for each filer.
- name: FilerName
  type: varchar(80)
  nullable: true
  description: FilerName is the filer name, as filed.
- name: ProdName
  type: varchar(80)
  nullable: true
  description: ProdName is the standardized LSEG filer name. This field will be null if the filer does not have filings on
    record with LSEG.
- name: FeedCode
  type: INTEGER
  nullable: false
  description: FeedCode indicates the feed source of the data. FeedCode cross-references OwnInsCode where OwnInsCode.Type_
    = 1 and OwnInsCode.Code = OwnInsInfo.FeedCode.
- name: LicFlag
  type: INTEGER
  nullable: false
  description: 'LicFlag describes licensing requirements: – LicFlag = 1 for UK and Canada – LicFlag = 2 for Asia LSEG Quantitative

- name: RestrExpireOffset
  type: SMALLINT
  nullable: true
  description: Regional time zone offset from UTC, used to normalize RestrExpireDate, expressed in minutes. The offset can
    be -300 or -240 for the Americas, 0 or 60 for EMEA, and 330 for Asia.

  description: The date and time of an open estimate or actual record. For Actuals, AnnounceDate always equals EffectiveDate.
    For Estimates, AnnounceDate always equals the EffectiveDate of the Open domain action, but not always the Effective Date
    for Confirm, Exclude or Include domain actions. The Announce date can be used to link a Confirm, Exclude or Include back

table: qa_ibes_v2.TREActRpt
domain: estimates
description: 'This table contains the actuals reported data. | the Code field in the TRECode table for the following descriptions:
  | TRECode table for the following description: CodeType=2. | field in the TRECode table for the following descriptions:
  currency | table for the following descriptions: currency name (CodeType = 6),'
update_cadence: Every 15 minutes
columns:
- name: EstPermID
  type: BIGINT
  nullable: false
  description: PermID of the unique entity being forecasted or reported (1:1 with IBESTicker).
- name: Measure
  type: SMALLINT
  nullable: false
  description: 'The attribute or the financial statement item that is being estimated (e.g., EPS, Sales, EBITDA, DPS). This
    field cross-references with the Code field in the TRECode table for the following descriptions: measure code (CodeType
    = 4), measure name (CodeType = 5).'
- name: IsParent
  type: BOOLEAN
  nullable: false
  description: Boolean flag identifying the measure as a parent company differentiating it from a consolidated company. Database
    Schema for I/B/E/S Estimates Version2 10
- name: PerType
  type: SMALLINT
  nullable: false
  description: 'Period interval (monthly, quarterly, third, semi-annual, annual, long term). This field cross-references with
    the Code field in the TRECode table for the following description: CodeType=2.'
- name: PerEndDate
  type: TIMESTAMP(6)
  nullable: false
  description: Date/time the period ends.
- name: FYEMonth
  type: TINYINT
  nullable: false
  description: The month of the fiscal year end, used to distinguish when a single period end date applies to different fiscal
    years.
- name: EffectiveDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date and time the estimate becomes valid due to a real-world event, for example, a broker submits an estimate
    or a company reports its earnings. It is represented as a local date/time with a time zone offset from UTC.
- name: EffectiveOffset
  type: SMALLINT
  nullable: true
  description: Regional time zone offset from UTC, used to normalize EffectiveDate, expressed in minutes. The offset can be
    -300 or -240 for the Americas, 0 or 60 for EMEA, and 330 for Asia.
- name: ExpireDate
  type: TIMESTAMP(6)
  nullable: true
  description: Expire date is part of an estimate state as it is an attribute of EffectiveDate, marking the end of the date
    range in which an event is valid. When ExpireDate is NULL it represents the current/active record.
- name: ExpireOffset
  type: SMALLINT
  nullable: true
  description: Regional time zone offset from UTC, used to normalize ExpireDate, expressed in minutes. The offset can be -300
    or -240 for the Americas, 0 or 60 for EMEA, and 330 for Asia.
- name: ActivationDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date and time the estimate is active and retrievable in the collection database. It is a system-generated
    transaction date/time, represented in UTC. ActivationDate is always greater than or equal to EffectiveDate and represents
    the delay required to enter estimate values into the system.
- name: AnnounceDate
  type: TIMESTAMP(6)
  nullable: true
  description: The date and time of an open estimate or actual record. For Actuals, AnnounceDate always equals EffectiveDate.
    For Estimates, AnnounceDate always equals the EffectiveDate of the Open domain action, but not always the Effective Date
    for Confirm, Exclude or Include domain actions. The Announce date can be used to link a Confirm, Exclude or Include back
    to the Open estimate record.
- name: AnnounceOffset
  type: SMALLINT
  nullable: true
  description: Regional time zone offset from UTC, converted to minutes. Used to normalize AnnounceDate. The offset can be
    -300 or -240 for the Americas, 0 or 60 for EMEA, and 330 for Asia.
- name: UnitType
  type: varchar(80)
  nullable: true
  description: Type of unit for this data field. This can be Percentage (e.g., for ROA), Currency (e.g., for EPS), Per Share,
    or some KPI units such as Barrels, Cubic Feet, Projects, Seats, Stores, Square Feet, Home Units, Members, Doctors, Shares,
    Money, etc.
- name: DefActValue
  type: FLOAT
  nullable: true
  description: The actual value in the reported currency.
- name: DefCurrPermID
  type: INTEGER
  nullable: true
  description: Default currency PermId. This field cross-references with the Code name (CodeType = 6), ISO3 code (CodeType
    = 7), and ISO numeric code (CodeType = 8).
- name: DefScale
  type: FLOAT
  nullable: true
  description: This is a scale factor, indicating whether a value is scaled. 1 means no scaling, 1000 means the value was
    scaled by a factor of 1000. The value multiplied by the factor is the ‘true estimate value’, before any adjustments were
    made. Specific to this particular record.
- name: DefCurrAdj
  type: FLOAT
  nullable: true
  description: The adjustment applied to the actual value to convert it to the default currency.
- name: NormActValue
  type: FLOAT
  nullable: true
  description: The actual value in normalized currency.
- name: NormCurrPermID
  type: INTEGER
  nullable: true
  description: 'Normalized currency permid. This field cross-references with the Code field in the TRECode table for the following
    descriptions: currency name (CodeType = 6), ISO3 code (CodeType = 7), and ISO numeric code (CodeType = 8). Database Schema
    for I/B/E/S Estimates Version2 11'
- name: NormScale
  type: FLOAT
  nullable: true
  description: Normalized factor necessary to reach the true estimate value (1 = no scale, 1000 = multiply by 1000).
- name: NormSplitFactor
  type: FLOAT
  nullable: true
  description: Adjustment applied to convert the EstValue during normalization due to stock splits (divide).
- name: NormCurrAdj
  type: FLOAT
  nullable: true
  description: Adjustment applied to EstValue during normalization due to currency adjustments (multiply).
- name: AsContribActValue
  type: FLOAT
  nullable: true
  description: The actual value as contributed by the company.
- name: AsContribCurrPermID
  type: INTEGER
  nullable: true
  description: 'The currency in the actual document contributed by the company. This field cross-references with the Code
    field in the TRECode table for the following descriptions: currency name (CodeType = 6), ISO3 code (CodeType = 7), and
    ISO numeric code (CodeType = 8).'
- name: AsContribScale
  type: FLOAT
  nullable: true
  description: Recommendation scale as contributed by the company, as a factor to reach the true estimate value (1 = no scale,
    1000 = multiply by 1000).
- name: RegionPermID
  type: INTEGER
  nullable: true
  description: 'PermID for the region. The descriptions are: 110172 = EMEA, 110173 = AMER, 110171 = ASIA.'
---

  type: TIMESTAMP(6)
  nullable: false
  description: Date/time the period ends.
- name: FYEMonth
  type: TINYINT
  nullable: false
  description: The month of the fiscal year end, used to distinguish when a single period end date applies to different fiscal
    years.
- name: BrokerID
  type: INTEGER
  nullable: false
  description: Unique identifier for the broker, displayed as a masked code. This is the main identifier in the Broker database.
- name: EffectiveDate
  type: TIMESTAMP(6)
  nullable: false
  description: The date and time the estimate becomes valid due to a real- world event, for example, a broker submits an estimate
    or a company reports its earnings. It is represented as a local date/time with a time zone offset from UTC.
- name: DomainAction
  type: TINYINT
  nullable: false
  description: Domain actions represent the state of the content item, triggered by real-world events (open, confirm, exclude
    from mean, etc.) This field cross-references with TRECode where CodeType=13.
- name: EffectiveOffset
  type: SMALLINT
  nullable: true
  description: Regional time zone offset from UTC, used to normalize EffectiveDate, expressed in minutes. The offset can be
    -300 or - 240 for the Americas, 0 or 60 for EMEA, and 330 for Asia.
- name: ExpireDate
  type: TIMESTAMP(6)
  nullable: true
  description: Expire date is part of an estimate state as it is an attribute of EffectiveDate, marking the end of the date
    range in which an event is valid. When ExpireDate is NULL it represents the current/active record.
- name: ExpireOffset
  type: SMALLINT
  nullable: true
  description: Regional time zone offset from UTC, used to normalize ExpireDate, expressed in minutes. The offset can be -300
    or - 240 for the Americas, 0 or 60 for EMEA, and 330 for Asia.

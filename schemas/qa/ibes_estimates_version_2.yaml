  type: BOOLEAN
  nullable: true
  description: Indicates whether the estimate is Open and Valid. When ‘True’ the estimate is open and valid; when ‘False’
    it is inactive. (independent of IsExcluded)
- name: IsConfirmed
  type: BOOLEAN
  nullable: true
  description: Indicates whether the estimate value has been confirmed by the contributor. When ‘True’ the value has been
    confirmed.
- name: IsExcluded
  type: BOOLEAN
  nullable: true
  description: Indicates whether the value has been excluded from Summary Estimates. When ‘True’ the estimate is excluded.
- name: IsPublic
  type: BOOLEAN
  nullable: true
  description: Indicates whether the estimate is included in consensus data such as the mean. Estimates from sell-side brokers
    are public and included in consensus data. Bottom-up estimates are private and not included. Sell- side estimates have
    IsPublic equal to true. Bottom-up estimates have IsPublic equal to false. Buy-side estimates are not covered.
- name: UnitType
  type: varchar
  nullable: true
  description: Type of unit for this data field. This can be Percentage (e.g., for ROA), Currency (e.g., for EPS), Per Share,
    or some KPI units such as Barrels, Cubic Feet, Projects, Seats, Stores, Square Feet, Home Units, Members, Doctors, Shares,
    Money, etc.
- name: DefEstValue
  type: FLOAT
  nullable: true
  description: Forecast value, delivered in default currency.
- name: DefCurrPermID
  type: INTEGER
  nullable: true
  description: Default currency PermId.
- name: DefCurr_Desc
  type: varchar
  nullable: true
  description: The description of the default currency.
- name: DefScale
  type: FLOAT
  nullable: true
  description: This is a scale factor, indicating whether a value is scaled. 1 means no scaling, 1000 means the value was
    scaled by a factor of 1000. The value multiplied by the factor is the ‘true estimate value’, before any adjustments were
    made. Specific to this particular record.
- name: DefCurrAdj
  type: FLOAT
  nullable: true
  description: The adjustment applied to the actual value to convert it to the default currency.
- name: NormEstValue
  type: FLOAT
  nullable: true
  description: Forecast value, delivered in normalized currency.
- name: NormCurrPermID
  type: INTEGER
  nullable: true
  description: Normalized currency permid. Database Schema for I/B/E/S Estimates Version2 102
- name: NormCurr_Desc
  type: varchar
  nullable: true
  description: The description of the normalized currency.
- name: NormScale
  type: FLOAT
  nullable: true
  description: Normalized factor necessary to reach the true estimate value (1 = no scale, 1000 = multiply by 1000).
- name: NormSplitFactor
  type: FLOAT
  nullable: true
  description: Adjustment applied to convert the EstValue during normalization due to stock splits (divide).
- name: NormCurrAdj
  type: FLOAT
  nullable: true
  description: Adjustment applied to EstValue during normalization due to currency adjustments (multiply).
- name: AsContribEstValue
  type: FLOAT
  nullable: true
  description: Forecast value, delivered in ‘as contributed’ currency.
- name: AsContribCurrPermID
  type: INTEGER
  nullable: true
  description: The currency in the actual document contributed by the company.
- name: AsContribCurr_Desc
  type: varchar
  nullable: true
  description: The description of the reported currency.
- name: AsContribScale
  type: FLOAT
  nullable: true
  description: Recommendation scale as contributed by the company, as a factor to reach the true estimate value (1 = no scale,
    1000 = multiply by 1000).
- name: DocType
  type: varchar
  nullable: true
  description: 'Type of the research document that the Estimate is sourced from. One of four values: Note, Document, Batch,
    or Manual.'
- name: DocID
  type: varchar
  nullable: true
  description: Filename of the research document in the system.
- name: RegionPermID
  type: INTEGER
  nullable: true
  description: 'PermID for the region. The descriptions are: 110172 = EMEA, 110173 = AMER, 110171 = ASIA.'
- name: Region_Desc
  type: varchar
  nullable: true
  description: 'Description of the RegionPermID field. Example Use Case: --This query returns the detail estimates made by
    Deutsche Bank Equity Research for Microsoft 12 month price target. select aa.id, aa.name, cc.* from vw_SecurityMasterX
    aa join vw_IBES2Mapping bb on bb.SecCode = aa.seccode and bb.Typ = aa.typ join vw_IBES2DetHzn cc on cc.EstPermID = bb.EstPermID
    and cc.Measure = 31 --Price Target and cc.PerType = 2 and cc.PerLength = 12 and cc.BrokerName = ''Deutsche Bank Equity
    Research'' where aa.id = ''MSF'

  nullable: true
  description: The adjustment applied to the actual value to convert it to the default currency.
- name: NormEstValue
  type: FLOAT
  nullable: true
  description: Forecast value, delivered in normalized currency.
- name: NormCurrPermID
  type: INTEGER
  nullable: true
  description: 'Normalized currency permid. This field cross-references with the Code field in the TRECode table for the following
    descriptions: currency name (CodeType = 6), ISO3 code (CodeType = 7), and ISO numeric code (CodeType = 8).'

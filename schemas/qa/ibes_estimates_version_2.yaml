  type: TIMESTAMP(6)
  nullable: true
  description: 'Summary window data is calculated using two points in time: 1) the end point is the EffectiveDate of the summary
    window, and 2) the start point is the midnight point from X days in the past. WinEndDate is the EffectiveDate for the
    summary window record.'
- name: WinEndOffset
  type: SMALLINT

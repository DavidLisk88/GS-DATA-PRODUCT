    transaction date/time, represented in UTC. ActivationDate is always greater than or equal to EffectiveDate and represents
    the delay required to enter estimate values into the system.
- name: ActGrowth
  type: FLOAT
  nullable: true
  description: A historical growth rate corresponding to ActStability that averages annualized earnings per share growth for
    a company over the past five years.
- name: ActStability
  type: FLOAT
  nullable: true
  description: Stability measures the consistency of EPS growth. Five-year earnings per share stability measures the consistency
    of earnings per share growth over the past five years. The lower the number, the more uniform growth has been.
- name: UnitType
  type: varchar(80)
  nullable: true
  description: Type of unit for this data field. This can be Percentage (e.g., for ROA), Currency (e.g., for EPS), Per Share,
    or some KPI units such as Barrels, Cubic Feet, Projects, Seats, Stores, Square Feet, Home Units, Members, Doctors, Shares,
    Money, etc.
- name: DefActChg
  type: FLOAT
  nullable: true
  description: 'Actual change is the ratio of a current actual over a past actual (default currency). Note: Currently, ActChg
    and ActChgPct are always null.'
- name: DefCurrPermId
  type: INTEGER
  nullable: true

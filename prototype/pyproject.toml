[project]
name = "lseg_copilot"
version = "0.1.0"
description = "LSEG Data Copilot — RAG + Text-to-SQL prototype against a mock LSEG catalog."
requires-python = ">=3.10"
authors = [{name = "Internal R&D"}]
license = {text = "Internal"}
dependencies = [
  "duckdb>=0.10.0",
  "sqlglot>=23.0.0",
  "pyyaml>=6.0",
  "pydantic>=2.5.0",
  "click>=8.1.0",
  "rich>=13.7.0",
  "rank-bm25>=0.2.2",
  "pandas>=2.2.0",
  "pypdf>=4.0.0",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=2.5.0",
  "faiss-cpu>=1.7.4",
]
llm = [
  "openai>=1.30.0",
]
ui = [
  "streamlit>=1.34.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
lseg-copilot = "lseg_copilot.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["lseg_copilot*"]
